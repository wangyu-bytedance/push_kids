  <text x="152" y="75" fill="#788071" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">今天 0 项 · 明天 3 项</text>
  <path d="M350 72 L358 64 L366 72" fill="none" stroke="#9AA58F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
