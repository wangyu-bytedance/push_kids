  <text x="74" y="392" fill="#30352F" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">dance、sing</text>
  <line x1="48" y1="414" x2="342" y2="414" stroke="#EEE9DF"/>
  <circle cx="58" cy="447" r="4" fill="#7FA65C"/>
