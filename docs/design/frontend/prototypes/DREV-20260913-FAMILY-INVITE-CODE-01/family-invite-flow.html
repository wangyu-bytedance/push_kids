<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>六位家庭邀请码</title>
  <style>
    :root{--paper:#faf7f0;--card:#fffdf8;--ink:#24332d;--muted:#6e7771;--line:#e7e0d3;--green:#1f5b45;--green-soft:#e7f0e9;--amber:#a9762a;--danger:#a85742;--gutter:20px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.page{min-height:100vh;padding:env(safe-area-inset-top) var(--gutter) calc(28px + env(safe-area-inset-bottom));overflow:hidden}.status{height:28px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:650}.nav{height:44px;display:grid;grid-template-columns:44px 1fr 72px;align-items:center;margin:0 calc(-1 * var(--gutter))}.nav .back{font-size:25px;padding-left:18px}.nav h1{margin:0;text-align:center;font-size:17px;font-weight:650}.capsule{height:28px;border:1px solid #d8d3c9;border-radius:999px;margin-right:10px}.hero{margin-top:18px;padding:22px;border-radius:24px;background:var(--green);color:white;box-shadow:0 10px 30px rgba(31,91,69,.16)}.eyebrow{display:block;font-size:12px;letter-spacing:.08em;opacity:.78}.hero h2,.title{font-family:"Songti SC","STSong",serif}.hero h2{margin:7px 0 4px;font-size:28px;line-height:1.2}.hero p{margin:0;font-size:14px;line-height:1.5;opacity:.85}.card{margin-top:16px;padding:20px;border-radius:16px;background:var(--card);border:1px solid rgba(231,224,211,.85);box-shadow:0 10px 28px rgba(67,57,42,.06)}.label{display:block;color:var(--muted);font-size:13px}.code{display:block;margin:9px 0 5px;color:var(--green);font-size:36px;font-weight:760;letter-spacing:.12em;font-variant-numeric:tabular-nums}.help{color:var(--muted);font-size:14px;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{min-height:46px;border:0;border-radius:12px;background:var(--green);color:white;font-weight:650}.btn.secondary{background:var(--green-soft);color:var(--green)}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:end;padding:0 2px 10px;border-bottom:1px solid var(--line)}.section-head strong{font-family:"Songti SC","STSong",serif;font-size:18px}.section-head span{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line)}.avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:700}.grow{flex:1;min-width:0}.row strong,.row small{display:block}.row small{margin-top:3px;color:var(--muted);font-size:13px}.step{margin-top:20px;color:var(--green);font-size:12px;font-weight:700;letter-spacing:.08em}.title{margin:6px 0 8px;font-size:29px;line-height:1.2}.lead{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.field{margin-top:22px}.field label{display:block;margin-bottom:10px;font-size:14px;font-weight:650}.input-wrap{height:62px;display:flex;align-items:center;justify-content:center;border:2px solid var(--green);border-radius:16px;background:var(--card);box-shadow:0 0 0 4px rgba(31,91,69,.08)}.input-wrap input{width:100%;border:0;outline:0;background:transparent;text-align:center;color:var(--ink);font-size:30px;font-weight:760;letter-spacing:.14em;font-variant-numeric:tabular-nums}.input-wrap input::placeholder{color:#a9aea9;font-size:18px;font-weight:500;letter-spacing:.04em}.notice{display:flex;gap:10px;margin-top:16px;padding:14px;border-radius:12px;background:#f3efe4;color:var(--muted);font-size:14px;line-height:1.5}.shield{width:22px;height:22px;flex:0 0 auto;border:2px solid var(--green);border-radius:7px 7px 10px 10px;position:relative}.shield:after{content:"";position:absolute;width:6px;height:3px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg);left:6px;top:6px}.cta{margin-top:20px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--green);color:white;font-weight:700}.alt{text-align:center;margin-top:16px;color:var(--green);font-size:14px}.screen-manager,.screen-join{display:none}body[data-screen="manager"] .screen-manager{display:block}body[data-screen="join"] .screen-join{display:block}@media(max-width:340px){:root{--gutter:16px}.hero{padding:18px}.hero h2,.title{font-size:25px}.card{padding:17px}.code{font-size:32px}.actions{grid-template-columns:1fr}.section{margin-top:17px}}
  </style>
</head>
<body data-screen="manager">
  <main class="page screen-manager">
    <div class="status"><span>9:41</span><span>● ●●</span></div>
    <div class="nav"><span class="back">‹</span><h1>家庭与成员</h1><span class="capsule"></span></div>
    <section class="hero"><span class="eyebrow">一起记录，一起陪伴</span><h2>小芽的家</h2><p>加入前需要你确认 · 邀请 24 小时内有效</p></section>
    <section class="card"><span class="label">6 位家庭邀请码</span><strong class="code">482 731</strong><p class="help">家人可以输入邀请码，或直接打开微信邀请；提交后仍需你确认。</p><div class="actions"><button class="btn secondary">复制邀请码</button><button class="btn">微信邀请</button></div></section>
    <section class="section"><div class="section-head"><strong>加入申请</strong><span>暂时没有等待确认</span></div><div class="row"><span class="avatar">妈</span><span class="grow"><strong>妈妈 · 你</strong><small>管理员 · 可编辑与管理成员</small></span><span>›</span></div></section>
  </main>
  <main class="page screen-join">
    <div class="status"><span>9:41</span><span>● ●●</span></div>
    <div class="nav"><span class="back">‹</span><h1>申请加入家庭</h1><span class="capsule"></span></div>
    <div class="step">使用家人发来的邀请码</div><h2 class="title">输入 6 位家庭邀请码</h2><p class="lead">邀请码由家庭管理员生成，24 小时内有效。通过微信邀请进入时无需手动填写。</p>
    <section class="field"><label for="code">家庭邀请码</label><div class="input-wrap"><input id="code" inputmode="numeric" value="482 731" aria-label="6 位家庭邀请码"></div><p class="help">输入完整六位后，可以先确认家庭名称再提交申请。</p></section>
    <div class="notice"><span class="shield" aria-hidden="true"></span><span>邀请码只用来找到这个家庭。管理员确认前，你看不到孩子的学习记录、照片或成员名单。</span></div>
    <button class="cta">查看家庭</button><div class="alt">返回</div>
  </main>
  <script>const screen=new URLSearchParams(location.search).get('screen');if(screen==='join'||screen==='manager')document.body.dataset.screen=screen;</script>
</body>
</html>
