const SCENES={reports:'报表标题与指标',records:'学习记录与上传',settings:'设置模块',nested:'嵌套卡片与反馈',loading:'加载',empty:'空态',error:'错误与重试',disabled:'保存中',sheet:'弹层与选中'};
const params=new URLSearchParams(location.search);let theme=params.get('theme')||'garden',scene=params.get('scene')||'records';
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${name==='chevron-right'?'<path d="m9 5 7 7-7 7"/>':GLYPHS[name]||GLYPHS.book}</svg>`}
const chip='<button class="chip"><b>满</b><span>小满</span></button>';
function row(name,sub,glyph='book'){return `<div class="line"><div class="mark">${icon(glyph)}</div><div class="grow"><h3>${name}</h3><div class="muted">${sub}</div></div>${icon('chevron-right')}</div>`}
function header(t,report){return `<header class="hero ${t.assets.hero?'has-art':''}">${t.assets.hero?`<img class="hero-art" src="${ART[t.assets.hero]}" alt="">`:''}<div class="hero-copy">${report?`<h1 class="report-title">一点一滴，看得见</h1><p>只统计已确认的学习</p>${chip}${!t.assets.hero?`<img class="original-report-art" src="${ART[t.assets.report]}" alt="">`:''}`:`<div class="hero-row"><h1>学习记录⌄</h1>${chip}</div>`}</div></header>`}
function records(t){return `<section class="card"><div class="line"><span>实际学习时间</span><strong>今天 18:30</strong></div></section><div class="section-head"><h2>学习照片</h2><span class="muted">0 / 9</span></div><button class="upload">${t.id==='original'?`<img class="upload-art" src="${ART[t.assets.upload]}" alt="">`:`<span class="camera-scene">${icon('camera')}</span>`}<strong>添加学习照片</strong><small>拍摄或从相册选择</small></button><div class="section-head"><h2>文字记录</h2><span class="muted">选填</span></div><div class="field">也可以记下今天学了什么…</div>`}
function reports(){return `<div class="seg"><button class="on">近 7 天</button><button>近 30 天</button><button>近 100 天</button></div><div class="metrics"><div class="metric"><b>12</b><span class="muted">学习记录</span></div><div class="metric"><b>8</b><span class="muted">复习反馈</span></div></div><h2>最近的学习足迹</h2><section class="card"><div class="line"><h3>每天都有一点积累</h3><span class="tag">已确认</span></div><div class="bars">${[38,55,84,45,63,92,52].map(h=>`<i class="bar" style="height:${h}%"></i>`).join('')}</div><div class="labels"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div></section>`}
function settings(t){return `<h2>按你的节奏来</h2><section class="card"><h2>在学科目</h2>${row('语文','已加入')}${row('自然观察','自定义科目',t.fallback)}<button class="button" style="margin-top:16px">${icon('plus')}添加其他科目</button></section><section class="card"><h2>每日任务</h2>${row('阅读','每天 20 分钟','clock')}<button class="button" style="margin-top:16px">${icon('plus')}添加每日任务</button></section>`}
function nested(){return `<h2>今天的复习安排</h2><section class="card"><div class="line"><div class="mark">${icon('book')}</div><div class="grow"><h3>一起回顾今天的阅读</h3><div class="muted">语文 · 预计 5 分钟</div></div></div><div class="inset"><h3>这次回顾感觉怎么样？</h3><div class="line"><span>已经能自己说一说</span>${icon('check')}</div><div class="line"><span>再一起看看</span>${icon('chevron-right')}</div></div><button class="button" style="margin-top:16px">记录这次回顾</button></section><section class="card"><h3>接下来，按自己的节奏来</h3><p class="muted">用留白和底色区分内容，保留表单、选择状态与错误提示的清晰边界。</p><button class="button secondary">查看今天的安排</button></section>`}
function content(t){if(scene==='reports')return reports();if(scene==='records')return records(t);if(scene==='settings')return settings(t);if(scene==='nested')return nested();if(scene==='loading')return '<div class="sk"></div><div class="sk"></div>';if(scene==='empty')return `<div class="empty">${icon(t.fallback)}<h2>还没有学习记录</h2><p class="muted">记录第一次学习，慢慢积累。</p><button class="button">记录学习</button></div>`;if(scene==='error')return `<div class="notice">暂时无法读取，已保留你的输入。<button class="button" style="margin-top:12px">重新读取</button></div>`;if(scene==='disabled')return `<h2>文字记录</h2><div class="field">今天阅读了一个新的故事。</div><p class="muted">正在提交，请稍候</p><button class="button" disabled>正在提交…</button>`;return settings(t)}
function phone(t){const report=scene==='reports',style=t.style.replaceAll('&','&amp;').replaceAll('"','&quot;');return `<article class="phone theme-${t.id}" style="${style}"><div class="brand">${icon('sprout')}知芽</div>${header(t,report)}<div class="body">${content(t)}</div><nav class="tabbar">${['今日','日程','记录','报表','设置'].map((n,i)=>`<button class="${i===(report?3:scene==='settings'?4:2)?'active':''}">${icon(['sprout','calendar','camera','chart','sliders'][i])}<span>${n}</span></button>`).join('')}</nav>${scene==='sheet'?`<div class="sheet-backdrop"><section class="sheet"><h2>添加每日任务</h2><div class="line chosen">阅读 ${icon('check')}</div><div class="line">每天 20 分钟 ${icon('chevron-right')}</div><button class="button">保存</button></section></div>`:''}</article>`}
function render(){if(params.has('board')){document.body.className='board-mode';document.getElementById('stage').insertAdjacentHTML('afterend',`<div class="board">${THEMES.map(t=>`<section><div class="sample-label">${t.name}</div>${phone(t)}</section>`).join('')}</div>`);return}document.getElementById('stage').innerHTML=phone(THEMES.find(t=>t.id===theme)||THEMES[0]);if(params.has('single')){document.body.className='single';document.body.append(document.querySelector('.phone'))}}
document.getElementById('theme').innerHTML=THEMES.map(t=>`<option value="${t.id}" ${t.id===theme?'selected':''}>${t.name}</option>`).join('');document.getElementById('scene').innerHTML=Object.entries(SCENES).map(([id,name])=>`<option value="${id}" ${id===scene?'selected':''}>${name}</option>`).join('');for(const id of ['theme','scene'])document.getElementById(id).onchange=e=>{const p=new URLSearchParams(location.search);p.set(id,e.target.value);location.search=p};render();
</script></html>
