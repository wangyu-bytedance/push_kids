<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知芽 · 六主题视觉减法 · 待评审</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f3f3f1;color:#26332d}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--pk-primary);outline-offset:3px}.toolbar{padding:18px 24px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.toolbar label{font-size:13px}.toolbar select{padding:8px 12px}.toolbar small{color:#657267}.stage{padding:24px;display:flex;justify-content:center}.phone{width:390px;min-height:844px;position:relative;background:var(--pk-canvas);color:var(--pk-ink);font-family:var(--pk-sans);isolation:isolate;overflow:hidden}.brand{height:56px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--pk-nav-ink);background:var(--pk-nav-bg);font-weight:600;font-size:18px}.icon{width:24px;height:24px;display:inline-block;vertical-align:middle}.hero{position:relative;isolation:isolate;background:var(--pk-nav-bg);padding:20px 16px;min-height:140px}.hero.has-art{padding:0;min-height:0}.hero-art{display:block;width:100%;height:auto;aspect-ratio:780/304}.hero-copy{position:relative}.has-art .hero-copy{position:absolute;inset:14px 16px auto}.hero h1{font:600 24px/1.3 var(--pk-serif);letter-spacing:.4px;margin:0 0 6px;color:var(--pk-header-ink,var(--pk-ink));white-space:nowrap;max-width:100%}.hero p{color:var(--pk-header-muted,var(--pk-ink-2));margin:0;font-size:13px}.hero-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}.hero-row h1{font-size:22px;margin:0}.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:0;padding:4px 10px 4px 5px;background:var(--pk-surface);border-radius:24px;color:var(--pk-ink);max-width:100%}.chip b{display:grid;place-items:center;background:var(--pk-primary-tint);color:var(--pk-primary);width:28px;height:28px;border-radius:50%;font-size:14px}.hero .chip{margin-top:8px}.hero-row .chip{margin-top:0;flex:none}.original-report-art{position:absolute;right:0;bottom:0;width:88px;height:60px;object-fit:contain}.body{padding:16px 14px 104px}.card{border:1px solid transparent;background:var(--pk-surface);border-radius:18px;padding:18px;margin:0 0 14px}.theme-original .card{border:1px solid rgba(34,38,31,.06);box-shadow:0 3px 16px rgba(34,38,31,.035)}.theme-garden .card{border-bottom-left-radius:6px}.theme-tech .card{border-top-left-radius:4px;border-bottom-right-radius:4px}.theme-ocean .card{border-radius:24px}h2{font-size:17px;margin:0 0 12px;font-weight:600}h3{font-size:15px;margin:0 0 5px}.muted{color:var(--pk-text-muted);font-size:13px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px}.line+.line{border-top:1px solid var(--pk-line-soft);margin-top:12px;padding-top:12px}.mark{display:grid;place-items:center;background:var(--pk-primary-tint);color:var(--pk-primary);width:40px;height:40px;flex:none;border-radius:14px}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border-radius:24px;border:0;background:var(--pk-primary);color:var(--pk-on-primary);padding:8px 18px;font-weight:600;width:100%}.button.secondary{background:var(--pk-primary-tint);color:var(--pk-primary-strong)}.button:disabled{background:var(--pk-surface-sunken);color:var(--pk-ink-4);cursor:default}.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.section-head h2{margin:0}.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;min-height:176px;border:1px dashed var(--pk-primary-hairline);border-radius:20px;background:var(--pk-surface);color:var(--pk-primary-strong);padding:20px}.upload strong{font-size:15px}.upload small{font-size:12px;color:var(--pk-text-muted)}.upload-art{width:140px;height:94px;object-fit:contain}.camera-scene{position:relative;display:grid;place-items:center;width:112px;height:78px;margin-bottom:4px;color:var(--pk-primary)}.camera-scene:before{content:"";position:absolute;width:80px;height:62px;left:8px;top:5px;border-radius:16px;background:var(--pk-primary-tint);transform:rotate(-9deg)}.camera-scene:after{content:"";position:absolute;width:70px;height:54px;right:5px;top:11px;border-radius:16px;background:var(--pk-primary-wash);transform:rotate(9deg)}.camera-scene .icon{position:relative;z-index:1;width:44px;height:44px}.field{min-height:112px;border:1px solid var(--pk-line-strong);border-radius:12px;padding:13px;background:var(--pk-surface-raised);color:var(--pk-text-muted);font-size:14px}.seg{display:flex;padding:4px;border-radius:18px;gap:4px;background:var(--pk-surface-sunken);margin:0 0 16px}.seg button{flex:1;min-height:44px;border:0;border-radius:14px;background:transparent;color:var(--pk-text-muted)}.seg .on{background:var(--pk-surface);color:var(--pk-primary-strong)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.metric{padding:16px;border-radius:18px;background:var(--pk-surface);border:0}.metric b{font-size:28px;font-weight:600;color:var(--pk-primary);display:block}.bars{display:flex;align-items:flex-end;height:108px;gap:14px;padding:12px 8px 0}.bar{flex:1;background:var(--pk-primary-tint);border-radius:6px 6px 0 0}.bar:nth-child(3),.bar:nth-child(6){background:var(--pk-primary)}.labels{display:flex;justify-content:space-around;color:var(--pk-text-muted);font-size:12px;margin-top:8px}.inset{margin-top:14px;padding:14px;background:var(--pk-primary-wash);border:0;border-radius:12px}.inset .line{border:0}.tag{font-size:12px;color:var(--pk-text-muted)}.tabbar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:var(--pk-surface);min-height:72px;border-top:1px solid var(--pk-line-soft);padding-bottom:6px}.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;min-width:44px;border:0;background:transparent;color:var(--pk-text-muted);font-size:12px}.tabbar .active{color:var(--pk-primary);font-weight:600}.notice{padding:14px;background:var(--pk-danger-bg);color:var(--pk-danger-ink);border:1px solid var(--pk-danger-line);border-radius:12px}.sk{height:140px;border-radius:18px;background:var(--pk-surface-sunken);margin-bottom:16px}.empty{text-align:center;padding:48px 20px}.empty .icon{width:44px;height:44px;color:var(--pk-primary)}.sheet-backdrop{position:absolute;inset:56px 0 0;z-index:3;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}.sheet{width:100%;padding:24px 20px;background:var(--pk-surface);border-radius:24px 24px 0 0;color:var(--pk-ink)}.sheet .line{padding:12px 0}.sheet .chosen{outline:2px solid var(--pk-primary);border-radius:12px;padding:12px}.board{display:grid;grid-template-columns:repeat(3,320px);gap:24px;padding:24px;background:#f0f0ed}.sample-label{font-size:16px;font-weight:600;margin:0 0 10px}.board .phone{width:320px;min-height:568px;height:568px}.board .body{padding-bottom:90px}.board .section-head{margin-top:14px}.board .field{min-height:90px}.board .brand{height:48px}.board .upload{min-height:162px}.board .card{padding:14px}.single .toolbar,.single .stage{display:none}.single .phone{width:100vw;min-height:100vh}.board-mode .toolbar,.board-mode .stage{display:none}@media(max-width:650px){.stage{padding:0}.stage .phone{width:100%;min-height:844px}}
.has-art .hero-row{flex-direction:column;align-items:flex-start;gap:8px}.has-art .hero-row h1{min-height:44px;display:flex;align-items:center}.single .tabbar{position:fixed}.theme-original .hero{min-height:0}
</style>
<div class="toolbar"><strong>视觉减法 · 待评审</strong><label>风格 <select id="theme"></select></label><label>场景 <select id="scene"></select></label><small>HTML调整稿；合成数据；不代表原生验收</small></div><main class="stage" id="stage"></main>
<script>
const THEMES=__THEMES__,ART=__ART__,GLYPHS=__GLYPHS__;
const SCENES={reports:'报表标题与指标',records:'学习记录与上传',settings:'设置模块',nested:'嵌套卡片与反馈',loading:'加载',empty:'空态',error:'错误与重试',disabled:'保存中',sheet:'弹层与选中'};
const params=new URLSearchParams(location.search);let theme=params.get('theme')||'garden',scene=params.get('scene')||'records';
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${name==='chevron-right'?'<path d="m9 5 7 7-7 7"/>':GLYPHS[name]||GLYPHS.book}</svg>`}
const chip='<button class="chip"><b>满</b><span>小满</span></button>';
function row(name,sub,glyph='book'){return `<div class="line"><div class="mark">${icon(glyph)}</div><div class="grow"><h3>${name}</h3><div class="muted">${sub}</div></div>${icon('chevron-right')}</div>`}
function header(t,report){return `<header class="hero ${t.assets.hero?'has-art':''}">${t.assets.hero?`<img class="hero-art" src="${ART[t.assets.hero]}" alt="">`:''}<div class="hero-copy">${report?`<h1 class="report-title">一点一滴，看得见</h1><p>只统计已确认的学习</p>${chip}${!t.assets.hero?`<img class="original-report-art" src="${ART[t.assets.report]}" alt="">`:''}`:`<div class="hero-row"><h1>学习记录⌄</h1>${chip}</div>`}</div></header>`}
function records(t){return `<section class="card"><div class="line"><span>实际学习时间</span><strong>今天 18:30</strong></div></section><div class="section-head"><h2>学习照片</h2><span class="muted">0 / 9</span></div><button class="upload">${t.id==='original'?`<img class="upload-art" src="${ART[t.assets.upload]}" alt="">`:`<span class="camera-scene">${icon('camera')}</span>`}<strong>添加学习照片</strong><small>拍摄或从相册选择</small></button><div class="section-head"><h2>文字记录</h2><span class="muted">选填</span></div><div class="field">也可以记下今天学了什么…</div>`}
function reports(){return `<div class="seg"><button class="on">近 7 天</button><button>近 30 天</button><button>近 100 天</button></div><div class="metrics"><div class="metric"><b>12</b><span class="muted">学习记录</span></div><div class="metric"><b>8</b><span class="muted">复习反馈</span></div></div><h2>最近的学习足迹</h2><section class="card"><div class="line"><h3>每天都有一点积累</h3><span class="tag">已确认</span></div><div class="bars">${[38,55,84,45,63,92,52].map(h=>`<i class="bar" style="height:${h}%"></i>`).join('')}</div><div class="labels"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div></section>`}
function settings(t){return `<h2>按你的节奏来</h2><section class="card"><h2>在学科目</h2>${row('语文','已加入')}${row('自然观察','自定义科目',t.fallback)}<button class="button" style="margin-top:16px">${icon('plus')}添加其他科目</button></section><section class="card"><h2>每日任务</h2>${row('阅读','每天 20 分钟','clock')}<button class="button" style="margin-top:16px">${icon('plus')}添加每日任务</button></section>`}
function nested(){return `<h2>今天的复习安排</h2><section class="card"><div class="line"><div class="mark">${icon('book')}</div><div class="grow"><h3>一起回顾今天的阅读</h3><div class="muted">语文 · 预计 5 分钟</div></div></div><div class="inset"><h3>这次回顾感觉怎么样？</h3><div class="line"><span>已经能自己说一说</span>${icon('check')}</div><div class="line"><span>再一起看看</span>${icon('chevron-right')}</div></div><button class="button" style="margin-top:16px">记录这次回顾</button></section><section class="card"><h3>接下来，按自己的节奏来</h3><p class="muted">用留白和底色区分内容，保留表单、选择状态与错误提示的清晰边界。</p><button class="button secondary">查看今天的安排</button></section>`}
function content(t){if(scene==='reports')return reports();if(scene==='records')return records(t);if(scene==='settings')return settings(t);if(scene==='nested')return nested();if(scene==='loading')return '<div class="sk"></div><div class="sk"></div>';if(scene==='empty')return `<div class="empty">${icon(t.fallback)}<h2>还没有学习记录</h2><p class="muted">记录第一次学习，慢慢积累。</p><button class="button">记录学习</button></div>`;if(scene==='error')return `<div class="notice">暂时无法读取，已保留你的输入。<button class="button" style="margin-top:12px">重新读取</button></div>`;if(scene==='disabled')return `<h2>文字记录</h2><div class="field">今天阅读了一个新的故事。</div><p class="muted">正在提交，请稍候</p><button class="button" disabled>正在提交…</button>`;return settings(t)}
function phone(t){const report=scene==='reports',style=t.style.replaceAll('&','&amp;').replaceAll('"','&quot;');return `<article class="phone theme-${t.id}" style="${style}"><div class="brand">${icon('sprout')}知芽</div>${header(t,report)}<div class="body">${content(t)}</div><nav class="tabbar">${['今日','日程','记录','报表','设置'].map((n,i)=>`<button class="${i===(report?3:scene==='settings'?4:2)?'active':''}">${icon(['sprout','calendar','camera','chart','sliders'][i])}<span>${n}</span></button>`).join('')}</nav>${scene==='sheet'?`<div class="sheet-backdrop"><section class="sheet"><h2>添加每日任务</h2><div class="line chosen">阅读 ${icon('check')}</div><div class="line">每天 20 分钟 ${icon('chevron-right')}</div><button class="button">保存</button></section></div>`:''}</article>`}
function render(){if(params.has('board')){document.body.className='board-mode';document.getElementById('stage').insertAdjacentHTML('afterend',`<div class="board">${THEMES.map(t=>`<section><div class="sample-label">${t.name}</div>${phone(t)}</section>`).join('')}</div>`);return}document.getElementById('stage').innerHTML=phone(THEMES.find(t=>t.id===theme)||THEMES[0]);if(params.has('single')){document.body.className='single';document.body.append(document.querySelector('.phone'))}}
document.getElementById('theme').innerHTML=THEMES.map(t=>`<option value="${t.id}" ${t.id===theme?'selected':''}>${t.name}</option>`).join('');document.getElementById('scene').innerHTML=Object.entries(SCENES).map(([id,name])=>`<option value="${id}" ${id===scene?'selected':''}>${name}</option>`).join('');for(const id of ['theme','scene'])document.getElementById(id).onchange=e=>{const p=new URLSearchParams(location.search);p.set(id,e.target.value);location.search=p};render();
</script></html>
