<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知芽 · 旅行日记</title>
<style>
:root{--paper:#FAF7F0;--surface:#FFFDF8;--raised:#FFFDF8;--ink:#22261F;--muted:#59624F;--green:#1F5B45;--wash:#E4EDE6;--line:#E2DCCC;--sunken:#F3EFE4;--pill:999px;--shadow:0 1px 3px #22261f12}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button{font:inherit;color:inherit;cursor:pointer;border:0;min-width:44px;min-height:44px;background:none;border-radius:var(--pill);padding:8px 12px}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}button:disabled{cursor:default;background:var(--sunken);color:var(--muted);box-shadow:none}.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.brand{display:flex;align-items:center;justify-content:center;gap:8px;height:64px;color:var(--green);font-size:18px;font-weight:650}.brand span{color:var(--ink)}main{max-width:480px;margin:auto;padding:8px 16px 124px}.heading{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}.title{display:flex;align-items:center;gap:8px;padding:0;font:22px/1.5 'Songti SC','Noto Serif SC',serif}.title .icon{width:16px;color:var(--muted)}.child{display:flex;align-items:center;gap:8px;min-height:44px;max-width:100%;margin-left:auto;padding:6px 12px 6px 6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);font-weight:600}.avatar{display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:50%;background:var(--wash);color:var(--green)}.child-name{min-width:0;overflow-wrap:anywhere;word-break:break-all}.child .icon{width:16px;color:var(--muted)}.summary-row{display:flex;align-items:center;gap:8px}.stats{display:flex;flex:1;min-width:0;flex-wrap:wrap;column-gap:14px;row-gap:2px;color:var(--muted)}.more{display:grid;place-items:center;width:44px;height:44px;flex:none;padding:10px;color:var(--muted)}
.segments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:3px;background:#22261f0d;border-radius:var(--pill);margin:12px 0 4px;gap:0}.segments button{width:100%;min-width:0;min-height:44px;padding:8px 2px;border-radius:var(--pill);font-size:14px;font-weight:400;color:var(--muted)}.segments button[aria-pressed=true]{background:var(--raised);color:var(--green);font-weight:500;box-shadow:var(--shadow)}.drafts{display:block;color:var(--green);margin:4px auto 0}.status{margin:10px 0;color:var(--muted)}.visit{padding:16px 0 0 12px;border-left:1px solid #C7D8CB;margin-top:8px}.date{color:var(--green);margin-bottom:8px;font-variant-numeric:tabular-nums}.card{background:var(--surface);padding:12px;border:1px solid var(--line);border-radius:12px}.place{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}.place strong{font-size:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}.place .count{color:var(--muted);white-space:nowrap;flex:none}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.photo{min-width:0;padding:0;border-radius:12px;text-align:left;display:flex;flex-direction:column;gap:6px}.landscape{display:block;width:100%;height:100px;border-radius:12px;background:#DCE8E5}.time{display:block;color:var(--muted);font-size:14px;line-height:1.5;min-height:21px;font-variant-numeric:tabular-nums}.missing{display:flex;align-items:center;justify-content:center;width:100%;height:100px;border-radius:12px;background:var(--sunken);color:var(--muted)}.manual{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);min-height:44px}.manual .icon{width:20px;height:20px}.link{color:var(--green)}.full{width:100%}.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:10px 18px;border-radius:var(--pill);background:var(--green);color:#fff;font-size:16px;font-weight:500;box-shadow:0 3px 8px #1f5b451c}.primary:disabled{background:var(--sunken);color:var(--muted);box-shadow:none}.primary .icon{width:20px;height:20px}.secondary{background:var(--wash);color:var(--green);border-radius:var(--pill)}.import{margin-top:20px}.empty{display:flex;min-height:190px;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);text-align:center}.empty .icon{width:32px;height:32px;color:var(--green)}.empty p{margin:0}.notice{margin:12px 0;padding:12px;border-radius:12px;background:#F7E8E2;color:#A85742}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;min-height:88px;padding:8px 8px 24px;background:var(--surface);border-top:1px solid var(--line);z-index:2}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;max-width:96px;color:var(--muted);padding:6px 0}.nav .active{color:var(--green);font-weight:600}.backdrop{position:fixed;inset:0;background:#22261f66;display:flex;align-items:flex-end;z-index:10}.sheet{width:100%;max-height:88vh;background:var(--surface);border-radius:20px 20px 0 0;overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--line)}.sheet-head h2{font:600 16px/1.6 -apple-system,sans-serif;margin:0}.close{width:48px;height:48px;display:grid;place-items:center;padding:0}.sheet-body{padding:12px 16px}.sheet-footer{padding:12px 16px 28px;border-top:1px solid var(--line)}.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0;text-align:left;min-height:48px}.switch{width:48px;height:28px;min-width:48px;border-radius:var(--pill);background:#DFDFDB;padding:3px;position:relative}.switch::before{content:'';display:block;background:#fff;width:22px;height:22px;border-radius:50%;box-shadow:0 1px 3px #2222}.toggle[aria-checked=true] .switch{background:var(--green)}.toggle[aria-checked=true] .switch::before{transform:translateX(20px)}.map{position:relative;margin-top:12px;height:220px;border-radius:12px;background:#E4EDE6;overflow:hidden}.map svg{width:100%;height:100%}.map-label{position:absolute;left:12px;top:12px;color:var(--green)}.player{padding:16px;background:var(--surface);border-radius:12px;margin-top:12px}.player-controls{display:flex;align-items:center;gap:8px}.player-controls input{width:100%;min-width:0;min-height:44px}.player .primary{width:auto;min-height:44px;font-size:14px}.scope{display:flex;gap:8px;margin-top:12px}.scope button{flex:1;min-width:0;padding:8px 2px}.skeleton{height:160px;margin-top:16px;background:var(--sunken);border-radius:12px}.photo-large{height:220px;width:100%;border-radius:12px}.caption{margin-top:8px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:340px){main{padding-left:12px;padding-right:12px}.stats{column-gap:12px}.brand{height:56px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<div id="app"></div>
<script>
// Synthetic review data only. No network, storage, WeChat or production calls.
const paths={sprout:'M12 21v-9M12 15C6 15 3 12 3 6c6 0 9 3 9 9Zm0-3c0-5 3-8 9-8 0 6-3 9-9 9',down:'m6 9 6 6 6-6',camera:'M4 6h4l2-3h4l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2ZM16 13a4 4 0 1 1-8 0 4 4 0 0 1 8 0',calendar:'M4 5h16v16H4zM8 3v4m8-4v4M4 10h16',chart:'M5 20V10m7 10V4m7 16v-7M2 21h20',settings:'M3 6h18M3 12h18M3 18h18M8 4v4m8 2v4M8 16v4',more:'M5 12h.01M12 12h.01M19 12h.01',close:'m6 6 12 12M18 6 6 18',pin:'M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0ZM15 10a3 3 0 1 1-6 0 3 3 0 0 1 6 0',pen:'m4 16 12-12 4 4L8 20H4v-4ZM13 7l4 4'};
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]}"></path></svg>`;
const state=new URLSearchParams(location.search).get('state')||'overview';
const model={mode:state==='playback'?1:state==='lit'?2:0,sheet:['settings','saving','photo'].includes(state)?state:'',ai:false,playing:false,older:state==='older_window',detail:{day:'2026-10-24',place:'杭州 · 西湖',time:'14:30',manual:false,second:false}};
const scene=(second=false,large=false)=>`<svg class="${large?'photo-large':'landscape'}" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="100" fill="${second?'#EEE4D3':'#DCE8E5'}"/><circle cx="122" cy="23" r="10" fill="#E7D9AE"/><path d="M0 83 48 27 105 100H0Z" fill="${second?'#9B9F7B':'#759A8D'}"/><path d="m61 100 51-64 48 47v17Z" fill="${second?'#C0B792':'#ABC2B4'}"/><path d="M0 90q60-25 160 2v8H0Z" fill="#ACC9C9"/></svg>`;
function card(day,place,manual=false,second=false){const title=state==='long'?place+' · 湖畔自然探索与亲子户外观察地点名称':place;return `<article class="visit" data-date="${day}"><div class="date">${day.replaceAll('-',' / ')}</div><div class="card"><div class="place"><strong>${title}</strong><span class="count">${manual?'0':'2'} 张</span></div>${manual?`<div class="manual">${icon('pen')}<span>手动到访 · 时刻未知</span></div>`:`<div class="photos">${[0,1].map(i=>`<button class="photo" data-open-photo="true" data-day="${day}" data-place="${title}" data-time="${i?'时刻未知':second?'10:20':'14:30'}" data-second="${Boolean(i||second)}" aria-label="查看${day} ${i?'时刻未知':'14:30'}的照片">${state==='preview_failed'?'<span class="missing">暂不可预览</span>':scene(Boolean(i||second))}<span class="time">${i?'时刻未知':second?'10:20':'14:30'}</span></button>`).join('')}</div>`}<button class="link full" data-open-photo="true" data-day="${day}" data-place="${title}" data-time="${manual?'时刻未知':second?'10:20':'14:30'}" data-manual="${manual}" data-second="${second}">${manual?'查看到访':'查看照片'}</button></div></article>`;}
function render(){const viewer=state==='viewer',archived=state==='archived';const name=state==='long'?'小禾的超长名字用于换行验证':'小禾';
 let content='';
 if(state==='loading')content='<div class="status" role="status">正在加载…</div><div class="skeleton"></div>';
 else if(state==='empty')content=`<div class="empty">${icon('pin')}<p>还没有足迹</p>${viewer?'':'<button class="link" id="manual">手动记录</button>'}</div>`;
 else if(state==='error')content='<div class="notice" role="alert">暂时无法读取，请重试。</div><button class="secondary full" id="retry">重新读取</button>';
 else if(model.mode===0){content=model.older?card('2026-09-18','杭州 · 植物园')+card('2026-08-30','苏州 · 博物馆',true):card('2026-10-24','杭州 · 西湖')+card('2026-10-03','杭州 · 植物园',false,true)+card('2026-09-18','苏州 · 博物馆',true);content+='<button class="link full" id="older">查看下一组</button>';}
 else{content=`${model.mode===2?'<div class="scope"><button class="secondary">主要区域</button><button>中国</button><button>看全球</button></div>':''}<div class="map" aria-label="足迹地图"><svg viewBox="0 0 340 220" aria-hidden="true"><path d="M0 140 90 100 210 120 340 38" stroke="#C7D8CB" stroke-width="42" fill="none"/><path d="M0 55 112 210M130 0l70 220M0 175l340-70" stroke="#FFFDF8" stroke-width="13"/><path d="M70 160 165 92 270 138" stroke="#7FA65C" stroke-width="2" fill="none"/><g fill="#1F5B45" stroke="#FFFDF8" stroke-width="3"><circle cx="70" cy="160" r="7"/><circle cx="165" cy="92" r="7"/><circle cx="270" cy="138" r="7"/></g></svg><span class="map-label">杭州</span></div>${model.mode===1?`<section class="player"><div class="date">2026 / 10 / 03</div><div class="place"><strong>杭州 · 植物园</strong></div><div class="player-controls"><button class="primary" id="play">${model.playing?'暂停':'播放'}</button><input type="range" min="1" max="3" value="1" aria-label="回放进度"><span>1/3</span></div><button class="link full" data-open-photo="true">查看照片</button><div class="caption">连线为顺序示意</div></section>`:''}`;}
 let sheet='';if(['settings','saving'].includes(model.sheet))sheet=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">足迹设置</h2><button class="close" id="close" aria-label="关闭" ${model.sheet==='saving'?'disabled':''}>${icon('close')}</button></div><div class="sheet-body"><button class="toggle" id="ai" role="switch" aria-checked="${model.ai}" ${model.sheet==='saving'?'disabled':''}><span>AI 地点候选</span><span class="switch" aria-hidden="true"></span></button></div><div class="sheet-footer"><button class="primary" id="save" ${model.sheet==='saving'?'disabled':''}>${model.sheet==='saving'?'正在保存…':'保存设置'}</button></div></section>`;
 if(model.sheet==='photo')sheet=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">照片与到访详情</h2><button class="close" id="close" aria-label="关闭">${icon('close')}</button></div><div class="sheet-body">${model.detail.manual?'<div class="missing">手动到访</div>':scene(model.detail.second,true)}<div class="caption">${model.detail.day.replaceAll('-',' / ')} · ${model.detail.time}</div><div>${model.detail.place}</div></div><div class="sheet-footer">${viewer?'':'<button class="primary" id="edit">修改日期和地点</button>'}</div></section>`;
 document.querySelector('#app').innerHTML=`<div class="background" ${sheet?'inert aria-hidden="true"':''}><div class="brand">${icon('sprout')}<span>知芽</span></div><main><div class="heading">${state==='standalone'?'':`<button class="title" aria-label="记录类型，旅行日记">旅行日记${icon('down')}</button>`}<button class="child" aria-label="切换孩子"><span class="avatar" aria-hidden="true">小</span><span class="child-name">${name}</span>${icon('down')}</button></div>${viewer?'<div class="status">只读</div>':''}${archived?'<div class="status">已归档</div>':''}<div class="summary-row"><div class="stats"><span>${state==='empty'?'0':'8'} 个地点</span><span>${state==='empty'?'0':'5'} 座城市</span><span>${state==='empty'?'0':'3'} 个国家</span><span>${state==='empty'?'0':'24'} 张照片</span></div>${viewer?'':`<button class="more" id="more" aria-label="更多足迹操作">${icon('more')}</button>`}</div><div class="segments" aria-label="足迹视图">${['时间线','轨迹回放','地图点亮'].map((label,i)=>`<button data-mode="${i}" aria-pressed="${model.mode===i}">${label}</button>`).join('')}</div>${viewer?'':'<button class="drafts" id="drafts">查看待整理照片</button>'}<div class="timeline">${content}</div>${viewer||archived||state==='loading'?'':`<button class="primary import" id="import">${icon('camera')}<span>导入照片</span></button>`}</main>${state==='standalone'?'':`<nav class="nav" aria-label="主导航">${[['sprout','今日'],['calendar','日程'],['camera','记录'],['chart','报表'],['settings','设置']].map(([i,label])=>`<button class="${label==='记录'?'active':''}">${icon(i)}<span>${label}</span></button>`).join('')}</nav>`}</div>${sheet?`<div class="backdrop">${sheet}</div>`:''}`;
 const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
 bind('more',()=>{model.sheet='settings';render();document.getElementById('close').focus();});bind('close',()=>{model.sheet='';render();document.getElementById('more')?.focus();});bind('save',()=>{model.sheet='';render();document.getElementById('more')?.focus();});bind('ai',()=>{model.ai=!model.ai;render();document.getElementById('ai').focus();});bind('play',()=>{model.playing=!model.playing;render();document.getElementById('play').focus();});bind('older',()=>{model.older=true;render();window.scrollTo(0,0);});bind('retry',()=>{location.search='?state=overview';});
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{model.mode=Number(b.dataset.mode);render();document.querySelector('[data-mode="'+model.mode+'"]').focus({preventScroll:true});});
 document.querySelectorAll('[data-open-photo]').forEach(b=>b.onclick=()=>{model.detail={day:b.dataset.day||'2026-10-03',place:b.dataset.place||'杭州 · 植物园',time:b.dataset.time||'10:20',manual:b.dataset.manual==='true',second:b.dataset.second==='true'};model.sheet='photo';render();document.getElementById('close').focus();});
}
document.addEventListener('keydown',e=>{if(!model.sheet||model.sheet==='saving')return;if(e.key==='Escape'){model.sheet='';render();document.getElementById('more')?.focus();}if(e.key==='Tab'){const list=[...document.querySelectorAll('[role=dialog] button:not([disabled])')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script>
</html>
