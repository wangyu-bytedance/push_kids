<script>
'use strict';
const states=['recent-new','warming-up','no-history','missing-grade','no-subject','disabled','inactive','eligible-empty','viewer-empty','unknown-empty','proposal','proposal-long','task','partial','viewer-task','task-feature-off','generating','generation-error','stale','recover-after-remove','network-error'];
const hidden=states.slice(0,10);
let state=new URLSearchParams(location.search).get('state')||'proposal';
function link(label,target,cls){return '<a class="'+(cls||'btn secondary')+'" data-target="'+target+'" href="../DREV-20261024-TODAY-LEARNING-02/index.html?state='+target+'">'+label+'</a>';}
function render(){
 const task=['task','partial','viewer-task','task-feature-off'].includes(state),viewer=state==='viewer-task';
 const proposal=['proposal','proposal-long'].includes(state);
 const long=state==='proposal-long';
 const title=long?'用小物件练习已经学过的加法'.repeat(10).slice(0,120):'用凑十法试算 8 + 7';
 let html='<div class="page-head"><div><h1>今天，也慢慢来</h1><p class="date">10 月 24 日 星期六</p></div><button class="child-chip" aria-label="切换孩子"><span class="avatar">合</span>合成孩子</button></div>';
 html+='<section class="hero"><p class="hero-eyebrow">今天的复习安排</p><p class="hero-line">今天安排 1 项，约 3 分钟</p><p class="hero-note">按自己的节奏，做一点就好。</p><button class="btn">记录学习</button></section>';
 if(!hidden.includes(state)&&state!=='network-error'){
  html+='<section class="sec study-region" aria-label="今日学习"><header class="sec-bar"><h2 class="s-t">今日学习</h2></header><div class="sec-rule"></div>';
  if(task||proposal){
   html+='<article class="pk-card study-card">';
   if(task)html+='<p class="study-status">'+(state==='partial'?'已记录部分 · 继续待学':'家长已确认 · 待学')+'</p>';
   html+='<h3 class="study-title">'+title+'</h3><p class="study-meta">数学 · 预计 12 分钟'+(proposal?' · AI 建议':'')+'</p>';
   if(task)html+='<p class="study-copy">取 8 个和 7 个小物件。从 7 个里拿出 2 个与 8 个凑成 10，再数剩下的 5 个。</p><p class="study-meta">待学会保留，实际学过后再记录。</p>';
   if(proposal)html+=link('查看学习建议','suggestion');
   else if(viewer)html+='<p class="study-copy">当前为只读，请有编辑权限的家长记录。</p>';
   else html+=link('记录实际学习','suggestion-record','btn')+link('删除并换一项','suggestion-delete','link-btn');
   html+='</article>';
  }else{
   const recovery={generating:['正在准备学习建议','查看进度','suggestion-loading'],'generation-error':['学习建议暂时没准备好','查看并重试','suggestion-error'],stale:['学习内容有更新，请重新准备建议','查看并重新准备','suggestion-stale'],'recover-after-remove':['已移除待学，可以重新准备建议','重新准备建议','suggestion-loading']}[state];
   html+='<div class="study-progress" role="status"><p>'+recovery[0]+'</p>'+link(recovery[1],recovery[2])+'</div>';
  }
  html+='</section>';
 }
 if(state==='network-error')html+='<div class="notice" role="alert">学习建议暂时没加载出来，请稍后重试。'+link('重新加载','suggestion-offline','link-btn')+'</div>';
 html+='<section class="sec review-region"><header class="sec-bar"><h2 class="s-t">复习安排</h2><span class="s-m">今天 1 项</span></header><div class="sec-rule"></div><div class="pk-card review-row"><div class="grow"><p class="review-name">20 以内加法</p><p class="review-meta">数学 · 约 3 分钟</p></div><button class="review-done">完成</button></div></section>';
 document.getElementById('main').innerHTML=html;
 document.body.dataset.state=state;document.body.dataset.ready='true';
}
window.designStates=states;window.hiddenStates=hidden;window.designShow=function(next){if(!states.includes(next))throw Error('unknown design state');state=next;render();};render();
</script>
