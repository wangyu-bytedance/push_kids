<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知芽 · 学习建议标题约束 · DREV04</title>
<style>
:root{--canvas:#FAF7F0;--paper:#FFFDF8;--ink:#22261F;--muted:#464E43;--green:#1F5B45;--line:#EBE5D7;--strong:#DDD6C4;--sunken:#F3EFE4;--danger:#9F442D;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;--serif:"Songti SC","Noto Serif SC",serif;--r:calc(100vw / 750)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.6 var(--sans)}button,input,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer;min-height:44px;padding:8px 12px;background:transparent;white-space:normal;overflow-wrap:anywhere}button:disabled{opacity:.55;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}h1,h2,p{margin:0}.app{height:100dvh;max-width:480px;margin:auto;overflow:auto;padding:12px calc(32 * var(--r)) 24px}.brand{text-align:center;font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:24px}.child{font-size:17px;font-weight:600;margin-bottom:18px}.hero{padding:20px;background:#E4EDE6;border:1px solid #D2E1D6;border-radius:calc(40 * var(--r))}.hero h1{font-family:var(--serif);font-size:24px;margin:4px 0 10px}.hero p,.meta{font-size:14px;color:var(--muted)}.sec{margin-top:28px}.sec h2{font:600 17px/1.45 var(--serif);letter-spacing:.4px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}.card{padding:calc(32 * var(--r));border:1px solid var(--line);border-radius:calc(40 * var(--r));background:var(--paper);box-shadow:0 4px 18px #22261F08}.card-title{font-size:16px;font-weight:600;line-height:1.4;letter-spacing:.2px;overflow-wrap:anywhere}.card .meta{margin-top:8px}.capsule{width:100%;margin-top:16px;border-radius:999px;background:var(--sunken);color:var(--green);font-size:14px}.overlay{position:fixed;inset:0;background:#22261F61;display:flex;align-items:flex-end;justify-content:center}.sheet{position:relative;display:flex;flex-direction:column;width:100%;max-width:480px;max-height:85dvh;background:var(--paper);border-radius:calc(40 * var(--r)) calc(40 * var(--r)) 0 0;padding-bottom:env(safe-area-inset-bottom)}.head{display:flex;flex:none;align-items:flex-start;gap:calc(16 * var(--r));padding:16px calc(32 * var(--r)) 12px}.heading{flex:1;min-width:0}.title{font-size:20px;line-height:1.45;font-weight:600;overflow-wrap:anywhere}.head .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 8px}.close{flex:none;width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:calc(12 * var(--r));color:var(--muted)}.close svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}.body{flex:1;min-height:0;height:48dvh;overflow-y:auto;overscroll-behavior:contain;padding:0 calc(32 * var(--r)) calc(24 * var(--r))}.copy{font-size:16px;color:var(--muted);line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;margin:calc(16 * var(--r)) 0 calc(24 * var(--r))}.copy:first-child{margin-top:0}.label{display:block;font-size:14px;line-height:1.6;font-weight:600;margin:calc(24 * var(--r)) 0 calc(12 * var(--r))}.source{font-size:14px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}.actions{flex:none;padding:0 calc(32 * var(--r)) calc(24 * var(--r));border-top:1px solid var(--line)}.primary{display:block;width:100%;min-height:44px;margin-top:calc(16 * var(--r));padding:calc(20 * var(--r)) calc(24 * var(--r));border-radius:calc(12 * var(--r));background:var(--green);color:var(--paper);font-size:15px;font-weight:500;line-height:1.5}.row{display:flex;gap:8px;margin-top:8px}.secondary{width:0;flex:1;min-width:44px;border:1px solid var(--strong);border-radius:calc(12 * var(--r));background:var(--sunken);color:var(--green);font-size:14px;font-weight:400;line-height:1.5}.defer{display:block;width:100%;margin-top:8px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}.edit-head{align-items:center;padding:calc(16 * var(--r)) calc(32 * var(--r));border-bottom:1px solid var(--line)}.edit-head h2{font-size:16px;font-weight:600}.edit-body{padding-top:calc(24 * var(--r))}.field-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:calc(24 * var(--r)) 0 calc(12 * var(--r))}.field-row .label{margin:0}.counter{flex:none;color:var(--muted);font-size:14px;font-weight:400}.counter.invalid,.field-error{color:var(--danger)}input,textarea{display:block;width:100%;border:1px solid var(--strong);border-radius:calc(12 * var(--r));background:#FFF;padding:calc(20 * var(--r));font-size:16px;line-height:1.6}input{height:48px;min-height:48px}textarea{height:180px;resize:none}input[aria-invalid=true]{border-color:var(--danger)}.field-error{font-size:14px;line-height:1.6;margin-top:6px}.request-error{font-size:14px;line-height:1.6;color:var(--danger);background:#F7ECE6;padding:calc(20 * var(--r));border-radius:calc(12 * var(--r));margin-bottom:12px}.legacy-scroll{height:30dvh;overflow-y:auto}.toast{font-size:14px;color:var(--green);margin-top:12px}button:hover:not(:disabled){filter:brightness(.96)}
</style>
<div class="app" id="app"></div><div id="modal-root"></div>
<script>
'use strict';
const states=['proposal','proposal-max','card-max','edit','edit-max','edit-over','edit-empty','edit-legacy','edit-error','edit-saving','legacy'];
const shortTitle='用积木表示两组数相加';
const maxTitle='用积木表示加法并说说两组数量合起来的变化';
const legacyTitle='用小物件练习已经学过的加法'.repeat(10).slice(0,120);
const instructions='把两组积木合在一起，用一个加法算式表示。再改变一组积木的数量，说说算式有什么变化。';
let state=new URLSearchParams(location.search).get('state')||'proposal';
let title=shortTitle,editedTitle='',editedBody=instructions,editedMinutes='12',fieldError='',requestError='',saved=false;
const calls=[];
const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const count=value=>Array.from(value.trim()).length;
function titleError(value){const trimmed=value.trim();return !trimmed?'请填写学习标题。':count(value)>20?'标题最多20字，请精简。':/[\r\n\u2028\u2029]/.test(trimmed)?'标题请写成一行。':'';}
function show(next){state=next;title=next==='proposal-max'||next==='card-max'?maxTitle:next==='legacy'||next==='edit-legacy'?legacyTitle:shortTitle;editedTitle=next==='edit-max'?maxTitle:next==='edit-over'?maxTitle+'呀':next==='edit-empty'?'':next==='edit-legacy'?legacyTitle:shortTitle;fieldError=['edit-over','edit-empty','edit-legacy'].includes(next)?titleError(editedTitle):'';requestError=next==='edit-error'?'暂时没能保存，请重试。':'';saved=false;render();}
function closeIcon(){return '<button class="close" data-action="close" aria-label="关闭学习建议"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>';}
function updateFeedback(){const error=titleError(editedTitle);fieldError=error;const counter=document.getElementById('title-counter');counter.textContent=count(editedTitle)+'/20';counter.classList.toggle('invalid',!!error);const input=document.getElementById('edit-title');input.setAttribute('aria-invalid',String(!!error));const feedback=document.getElementById('title-error');feedback.textContent=error;feedback.hidden=!error;}
function render(){
 const cardTitle=title;
 document.getElementById('app').innerHTML='<div class="brand">知芽</div><div class="child">小朋友 一年级</div><section class="hero"><div class="meta">今天的复习安排</div><h1>今天安排 1 项，约 3 分钟</h1><p>按自己的节奏，做一点就好。</p></section><section class="sec"><h2>今日学习</h2><article class="card"><p class="card-title">'+escapeText(cardTitle)+'</p><p class="meta">数学 · 预计 12 分钟 · AI 建议</p><button class="capsule" data-action="view">查看学习建议</button>'+(saved?'<p class="toast" role="status">修改已保存</p>':'')+'</article></section><section class="sec"><h2>复习安排</h2><article class="card"><p class="card-title">十以内加法</p><p class="meta">约 3 分钟</p></article></section>';
 let modal='';const editing=state.startsWith('edit');
 if(editing){modal='<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="编辑学习建议"><header class="head edit-head"><h2 class="heading">编辑学习建议</h2>'+closeIcon()+'</header><div class="body edit-body">'+(requestError?'<p class="request-error" role="alert">'+requestError+'</p>':'')+'<div class="field-row"><label class="label" for="edit-title">学习标题</label><span class="counter" id="title-counter" aria-live="polite">'+count(editedTitle)+'/20</span></div><input id="edit-title" maxlength="120" value="'+escapeText(editedTitle)+'" aria-describedby="title-counter title-error" aria-invalid="'+Boolean(fieldError)+'"><p class="field-error" id="title-error" role="alert"'+(fieldError?'':' hidden')+'>'+fieldError+'</p><label class="label" for="edit-content">具体学习内容</label><textarea id="edit-content" maxlength="1000">'+escapeText(editedBody)+'</textarea><label class="label" for="edit-minutes">参考时长（分钟，可留空）</label><input id="edit-minutes" inputmode="numeric" value="'+escapeText(editedMinutes)+'"></div><footer class="actions"><button class="primary" data-action="save">'+(state==='edit-saving'?'正在保存…':'保存修改')+'</button></footer></section></div>';}
 else if(['proposal','proposal-max','legacy'].includes(state)){
  const heading='<h2 class="title">'+escapeText(title)+'</h2><div class="meta"><span>数学 · 预计 12 分钟</span><span>AI 建议</span></div>';
  modal='<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+escapeText(title)+'"><header class="head"><div class="heading">'+(state==='legacy'?'<div class="legacy-scroll">'+heading+'</div>':heading)+'</div>'+closeIcon()+'</header><div class="body"><p class="copy">'+instructions+'</p><p class="label">为什么建议这一项</p><p class="copy">参考已经确认的十以内加法，尝试换一种表示方法。</p><p class="source">来自已确认内容：十以内加法</p><p class="copy">只参考最近的记录，请家长核对是否适合。</p><p class="meta">仅为可调整的建议，不代表已学、掌握或成绩判断。</p></div><footer class="actions"><button class="primary" data-action="approve">确认加入今日学习</button><div class="row"><button class="secondary" data-action="edit">编辑内容</button><button class="secondary" data-action="replace">换一项</button></div><button class="defer" data-action="close">今天先不学</button></footer></section></div>';
 }
 document.getElementById('modal-root').innerHTML=modal;document.getElementById('app').inert=Boolean(modal);
 if(editing){const input=document.getElementById('edit-title');input.addEventListener('input',()=>{editedTitle=input.value;updateFeedback();});document.getElementById('edit-content').addEventListener('input',e=>{editedBody=e.target.value;});document.getElementById('edit-minutes').addEventListener('input',e=>{editedMinutes=e.target.value;});document.getElementById('title-counter').classList.toggle('invalid',!!fieldError);}
 document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{
  const action=el.dataset.action;
  if(action==='save'){updateFeedback();if(fieldError){document.getElementById('edit-title').focus();return;}calls.push({operation:'edit',title:editedTitle.trim()});if(state==='edit-error')return;title=editedTitle.trim();state='proposal';saved=true;render();}
  else if(action==='edit'){editedTitle=title;fieldError=titleError(title);requestError='';state=title.length>20?'edit-legacy':'edit';render();}
  else if(action==='view'){state=title===legacyTitle?'legacy':'proposal';render();}
  else if(action==='replace'){title='换一组积木表示加法';state='proposal';render();}
  else if(action==='approve'){calls.push({operation:'approve',title});state='card-max';render();}
  else{state='card-max';render();}
 }));
 if(state==='edit-saving'){document.querySelectorAll('.sheet button,.sheet input,.sheet textarea').forEach(el=>{el.disabled=true;});document.querySelector('.sheet .primary').setAttribute('aria-busy','true');}
 const dialog=document.querySelector('[role=dialog]');if(dialog){dialog.tabIndex=-1;dialog.focus({preventScroll:true});}
 document.body.dataset.state=state;document.body.dataset.ready='true';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state!=='edit-saving'){state='card-max';render();}if(e.key==='Tab'){const dialog=document.querySelector('[role=dialog]');if(!dialog)return;const elements=Array.from(dialog.querySelectorAll('button,input,textarea')).filter(el=>!el.disabled);if(!elements.length){e.preventDefault();dialog.focus();}else if(e.shiftKey&&document.activeElement===elements[0]){e.preventDefault();elements.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===elements.at(-1)){e.preventDefault();elements[0].focus();}}});
window.designStates=states;window.designShow=show;window.designCount=count;window.designTitleError=titleError;window.designCalls=calls;show(state);
</script>
</html>
