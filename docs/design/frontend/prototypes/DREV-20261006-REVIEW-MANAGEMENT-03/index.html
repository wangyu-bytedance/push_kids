<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知芽 · 复习条目 · 待审批设计</title>
<style>
:root{--canvas:#FAF7F0;--surface:#FFFDF8;--ink:#22261F;--muted:#464E43;--line:#EBE5D7;--pine:#1F5B45;--tint:#E4EDE6;--danger:#A85742;--sunken:#F3EFE4;--serif:"Songti SC",STSong,serif}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button{font:inherit;color:inherit;min-height:44px;min-width:44px;padding:10px 12px;cursor:pointer;border:0;background:transparent;white-space:normal;overflow-wrap:anywhere}button:focus-visible{outline:2px solid var(--pine);outline-offset:2px}button:disabled{color:var(--muted);cursor:default}button[disabled] small{opacity:1}[hidden]{display:none!important}h1,h2,h3,p{margin:0}h1{font:26px/1.4 var(--serif)}h2{font:22px/1.4 var(--serif)}h3{font-size:16px;font-weight:600}.muted{color:var(--muted)}.brand{height:52px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--pine);font:20px var(--serif)}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.page{max-width:480px;margin:auto;padding:0 18px 40px}.nav{display:flex;align-items:center;margin:0 -10px 16px;gap:6px}.back{display:grid;place-items:center}.nav span{font-weight:500}.heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.child{border-radius:999px;background:var(--tint);color:var(--pine);padding:8px 12px;flex:none;font-size:14px}.intro{margin-top:6px;color:var(--muted)}.segments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--sunken);padding:4px;border-radius:12px;margin-top:24px;gap:2px}.segments button{padding:8px 4px;border-radius:8px}.segments .on{background:var(--surface);color:var(--pine);font-weight:600;box-shadow:0 1px 4px #22261f12}.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.dates button{border-bottom:2px solid var(--line);text-align:left;padding:8px 4px}.dates .on{border-color:var(--pine);color:var(--pine)}.dates strong{display:block;font-size:16px}.dates span{display:block;font-size:14px;margin-top:2px}.dates.subjects,.dates.counts{grid-template-columns:repeat(3,minmax(0,1fr))}.counts button{min-height:48px}.counts .custom-count{font-weight:500}input{font:inherit;min-height:44px;min-width:0;width:100%;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}input:focus-visible{outline:2px solid var(--pine);outline-offset:2px}.exact-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:12px}.exact-row button{background:var(--pine);color:var(--surface);border-radius:8px}.filter-error{color:var(--danger);margin-top:8px}.action#delete{color:var(--danger)}.action#delete:disabled{color:var(--muted)}.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 8px}.summary strong{font-size:16px}.helper{color:var(--muted);margin-bottom:16px}.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}.item{padding:16px 0}.item+.item{border-top:1px solid var(--line)}.item-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.subject{color:var(--muted)}.count{color:var(--pine);font-variant-numeric:tabular-nums;white-space:nowrap}.item h3{line-height:1.55;overflow-wrap:anywhere}.meta{color:var(--muted);margin-top:8px}.item-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}.item-bottom span{color:var(--muted)}.edit{color:var(--pine);border-radius:8px;background:var(--tint)}.group-name{padding:12px 0 4px;color:var(--pine);font-weight:600}.notice{padding:12px 14px;border-radius:8px;background:var(--tint);margin:16px 0}.notice.error{background:#F7E8E2}.notice.budget{background:#F8EFDC}.empty{text-align:center;padding:36px 12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.empty p{margin-top:8px;color:var(--muted)}.empty button,.primary{background:var(--pine);color:var(--surface);border-radius:999px;margin-top:20px}.page-note{font-size:13px;margin-top:24px;color:var(--muted)}.entry{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;padding:20px 16px;margin-top:24px}.entry strong{display:block;font:21px var(--serif);margin-bottom:6px}.entry small{font-size:14px;color:var(--muted)}.section{margin-top:24px}.placeholder{padding:20px;background:var(--surface);border-radius:16px;margin-top:16px;border:1px solid var(--line)}.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);margin-top:32px;padding-top:8px}.tabbar button{padding:8px 2px}.tabbar .on{color:var(--pine);font-weight:600}.pager{display:flex;justify-content:center;margin-top:16px;gap:16px}.pager button{border:1px solid var(--line);border-radius:8px}.pager span{align-self:center}.dialog{width:calc(100% - 24px);max-width:456px;max-height:85vh;margin:auto auto 0;padding:20px 20px max(24px,env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);overflow-y:auto}.dialog::backdrop{background:#181c147a}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.close{display:grid;place-items:center;flex:none}.sheet-name{margin-top:8px;line-height:1.6}.facts{background:var(--sunken);border-radius:8px;margin-top:16px;padding:12px}.action{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}.action strong{display:block;font-weight:500;font-size:16px}.action small{display:block;color:var(--muted);font-size:14px;margin-top:4px}.action:first-of-type{color:var(--pine)}.delete-copy{margin-top:16px;line-height:1.75}.button-row{display:flex;gap:12px;margin-top:20px}.button-row button{flex:1;background:var(--sunken);border-radius:999px}.button-row .danger{background:var(--danger);color:white}.processing{padding:16px 0;color:var(--pine)}
@media(max-width:350px){.page{padding:0 12px 28px}.list{padding:0 12px}.dialog{padding:16px}.segments{margin-top:16px}h1{font-size:24px}.dates{gap:8px}.item-bottom{align-items:flex-end}}
</style></head>
<body>
<svg hidden aria-hidden="true"><defs><symbol id="leaf" viewBox="0 0 24 24"><path d="M12 21v-9M12 15C4 16 3 10 3 6c6 0 9 3 9 9ZM12 12C12 5 16 3 21 3c0 6-3 9-9 9Z"/></symbol><symbol id="left" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol><symbol id="right" viewBox="0 0 24 24"><path d="m10 5 7 7-7 7"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol></defs></svg>
<div class="brand"><svg><use href="#leaf"/></svg>知芽</div>
<main class="page" id="page"></main>
<dialog id="sheet" class="dialog" aria-labelledby="sheet-title"></dialog>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=new URLSearchParams(location.search).get('state')||'time';
let mode=initial.startsWith('count')?'count':initial==='subject'?'subject':'time',day=initial==='after'?2:1,subject='语文',countChoice=initial==='count-exact'?'1':initial==='count-empty'?'2':'all',exactCount=initial==='count-exact'?1:initial==='count-empty'?2:null,countDraft=initial==='count-custom'?'6':'',filterError='',message='',selected=null;
let records=[{id:1,subject:'数学',name:'用画图的方法理解两步应用题',count:0,last:null,due:1},{id:2,subject:'语文',name:'区分形近字，并放到词语中辨认',count:1,last:'10月4日',due:1},{id:3,subject:'英语',name:'看图说出常见动物的英文名称',count:3,last:'10月3日',due:2},{id:4,subject:'数学',name:'用竖式检查两位数加减法',count:6,last:'9月28日',due:null}];
if(initial==='long')records[0].name='读懂有多组条件的两步应用题，用线段图表达数量关系，并向家长解释先求什么、再求什么';
if(initial==='budget')records.push(...['读词语并辨认多音字','比较分数的大小','用英文介绍自己的物品','按顺序复述故事的内容'].map((name,i)=>({id:5+i,subject:['语文','数学','英语','语文'][i],name,count:0,last:null,due:1})));
const readonly=initial==='readonly';
const icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;
function shell(content){$('page').innerHTML=content;}
function renderEntry(today=false){shell(`<div class="heading"><div><h1>${today?'今天，也慢慢来':'一点一滴，看得见'}</h1><p class="intro">${today?'10月6日 · 星期二':'只统计已确认的学习'}</p></div><span class="child">小禾</span></div>${today?'<section class="section"><h2>复习安排</h2><div class="placeholder"><h3>今天没有待复习内容</h3></div></section><section class="section"><h2>今天的学习</h2><p class="intro">记录已学内容，慢慢积累。</p></section><section class="section"><h2>课外活动</h2><p class="intro">今天没有活动安排</p></section>':`<button class="entry" id="open-inventory"><span><strong>复习条目</strong><small>看看复习了几次，<br>调整接下来的安排</small></span>${icon('right')}</button><div class="segments"><button class="on">近7天</button><button>近30天</button><button>近100天</button></div><div class="placeholder"><h2>学习与复习的足迹</h2><p class="intro">原有统计与趋势在下方继续展示。</p></div>`}<nav class="tabbar" aria-label="主导航"><button id="today-tab" class="${today?'on':''}">今日</button><button disabled>日程</button><button disabled>记录</button><button id="report-tab" class="${today?'':'on'}">报表</button><button disabled>设置</button></nav><p class="page-note">待审批设计 · 示例内容，无真实数据操作<br>DREV-20261006-REVIEW-MANAGEMENT-03</p>`);if($('open-inventory'))$('open-inventory').onclick=()=>render();$('today-tab').onclick=()=>renderEntry(true);$('report-tab').onclick=()=>renderEntry();}
function row(r){return `<article class="item"><div class="item-top"><span class="subject">${esc(r.subject)}</span><span class="count">已复习 ${r.count} 次</span></div><h3>${esc(r.name)}</h3><p class="meta">${r.last?'最近复习 · '+r.last:'还未复习'}</p><div class="item-bottom"><span>${r.due===null?'本轮已结束':`下次 · ${r.due===1?'明天 10月7日':'后天 10月8日'}`}</span>${readonly?'':`<button class="edit" data-edit="${r.id}" aria-label="调整${esc(r.name)}">调整</button>`}</div></article>`;}
function render(){let rows=records.filter(r=>mode==='time'?r.due===day:mode==='subject'?r.subject===subject:exactCount===null||r.count===exactCount).sort((a,b)=>mode==='subject'?(a.subject.localeCompare(b.subject,'zh-CN')||a.count-b.count||a.id-b.id):a.count-b.count||a.id-b.id);if(initial==='empty')rows=[];
const controls=mode==='time'?`<div class="dates"><button data-day="1" class="${day===1?'on':''}" aria-pressed="${day===1}"><strong>明天</strong><span>10月7日 周三</span></button><button data-day="2" class="${day===2?'on':''}" aria-pressed="${day===2}"><strong>后天</strong><span>10月8日 周四</span></button></div>`:mode==='subject'?`<div class="dates subjects" aria-label="选择科目">${['语文','数学','英语','科学'].map(s=>`<button data-subject="${s}" class="${subject===s?'on':''}" aria-pressed="${subject===s}"><strong>${s}</strong><span>${records.filter(r=>r.subject===s).length} 个条目</span></button>`).join('')}</div>`:`<div class="dates counts" aria-label="按已复习次数筛选">${[['all','全部'],['0','0次'],['1','1次'],['2','2次'],['3','3次'],['custom',countChoice==='custom'?exactCount+'次':'指定次数']].map(([value,label])=>`<button data-count="${value}" class="${countChoice===value?'on':''}" aria-pressed="${countChoice===value}" ${value==='custom'?'aria-haspopup="dialog"':''}><strong>${label}</strong></button>`).join('')}</div>`;

shell(`<nav class="nav"><button class="back" id="back" aria-label="返回报表">${icon('left')}</button><span>报表</span></nav><div class="heading"><div><h1>复习条目</h1><p class="intro">每一次复习，心里有数</p></div><span class="child">小禾</span></div><div class="segments" aria-label="查看方式">${[['time','按时间'],['subject','按科目'],['count','按次数']].map(([id,label])=>`<button data-mode="${id}" class="${mode===id?'on':''}" aria-pressed="${mode===id}">${label}</button>`).join('')}</div>${controls}${readonly?'<div class="notice">当前为只读，可查看复习安排。</div>':''}${message?`<div class="notice" role="status">${esc(message)}</div>`:''}${initial==='budget'?'<div class="notice budget">已含手动安排 · 共20分钟<br>超过日常预算5分钟</div>':''}<div class="summary"><strong>${mode==='time'?`计划 ${rows.length} 项`:`${rows.length} 个知识条目`}</strong>${mode==='time'?`<span class="muted">约 ${rows.length*3} 分钟</span>`:''}</div><p class="helper">${mode==='time'?'按当前安排预览，实际复习后会更新。':mode==='subject'?`${esc(subject)} · 按复习次数从少到多排列。`:exactCount===null?'按复习次数从少到多排列。':`已复习 ${exactCount} 次`}</p>${initial==='error'?'<div class="notice error" role="alert">条目这次没读到，请重试。<br><button id="retry">重新加载</button></div>':rows.length?`<div class="list">${rows.map(row).join('')}</div>`:`<div class="empty"><h3>${mode==='time'?'这一天还没有复习安排':mode==='count'&&exactCount!==null?`没有复习 ${exactCount} 次的条目`:'还没有知识条目'}</h3><p>${mode==='time'?'可以在科目或次数视图中调整。':mode==='count'&&exactCount!==null?'换个次数，或查看全部次数。':'确认学过的内容后，就能在这里查看。'}</p><button id="empty-action">${mode==='time'?'按次数看看':mode==='count'?'查看全部次数':'返回报表'}</button></div>`}<p class="page-note">待审批设计 · 示例内容，无真实数据操作</p>`);

document.querySelectorAll('[data-count]').forEach(button=>button.onclick=()=>chooseCount(button.dataset.count));

const budgetNotice=document.querySelector('.notice.budget');if(budgetNotice){budgetNotice.hidden=mode!=='time'||day!==1;budgetNotice.textContent='已含手动安排 · 共18分钟，超过日常预算3分钟';}
$('back').onclick=()=>renderEntry();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=Number(b.dataset.day);render();});document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{subject=b.dataset.subject;render();});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openSheet(Number(b.dataset.edit)));if($('empty-action'))$('empty-action').onclick=()=>{if(mode==='subject'){renderEntry();return;}mode='count';countChoice='all';exactCount=null;filterError='';render();};if($('retry'))$('retry').onclick=()=>{message='设计预览：点击重试后重新请求，已有内容保留';render();};}
function chooseCount(choice){if(choice==='custom'){openCountSheet();return;}countChoice=choice;exactCount=choice==='all'?null:Number(choice);filterError='';render();const active=document.querySelector('[data-count="'+choice+'"]');if(active)active.focus();}
function openCountSheet(){countDraft=exactCount===null?(initial==='count-custom'?'6':''):String(exactCount);filterError='';$('sheet').innerHTML=`<div class="sheet-head"><h2 id="sheet-title">筛选复习次数</h2><button class="close" id="close-count" aria-label="关闭次数筛选">${icon('close')}</button></div><p class="intro">只看已复习指定次数的条目。</p><form id="exact-form" novalidate><label for="exact-count" class="intro">复习次数</label><div class="exact-row"><input id="exact-count" type="number" inputmode="numeric" min="0" max="2147483647" step="1" required value="${esc(countDraft)}" aria-describedby="filter-error" placeholder="例如：8" autofocus><button type="submit">确定</button></div><p id="filter-error" class="filter-error" role="alert" hidden></p><button type="button" id="cancel-count">取消</button></form>`;$('close-count').onclick=$('cancel-count').onclick=()=>$('sheet').close();$('exact-count').oninput=e=>{countDraft=e.target.value;};$('exact-form').onsubmit=e=>{e.preventDefault();const raw=$('exact-count').value.trim();countDraft=raw;if(!/^[0-9]+$/.test(raw)||Number(raw)>2147483647){$('filter-error').textContent='请输入0或更大的整数次数';$('filter-error').hidden=false;return;}exactCount=Number(raw);countChoice=exactCount<=3?String(exactCount):'custom';$('sheet').close();render();const active=document.querySelector('[data-count="'+countChoice+'"]');if(active)active.focus();};if(!$('sheet').open)$('sheet').showModal();$('exact-count').focus();}
function openSheet(id,kind='actions'){selected=records.find(r=>r.id===id)||records[0];const r=selected;if(!r)return;const del=kind==='delete',pending=kind==='pending',conflict=kind==='conflict';$('sheet').innerHTML=`<div class="sheet-head"><h2 id="sheet-title">${del?'删除这个条目？':'调整复习安排'}</h2><button class="close" id="close" aria-label="关闭">${icon('close')}</button></div><h3 class="sheet-name">${esc(r.name)}</h3>${del?`<p class="delete-copy">这个知识点及其复习记录、后续安排会被删除。</p><p class="delete-copy">同次上传的其他知识和原始材料保留。此操作无法撤销。</p><div class="button-row"><button id="cancel">保留条目</button><button class="danger" id="confirm-delete">确认删除</button></div>`:`<div class="facts">已复习 ${r.count} 次 · ${r.due===null?'本轮已结束':`下次 ${r.due===1?'明天':'后天'}`}<br>调整日期不会增加复习次数。</div>${conflict?'<div class="notice error" role="alert">这条安排已发生变化。请查看最新内容后重新操作。<button id="refresh">查看最新安排</button></div>':''}${pending?'<p class="processing" role="status">正在保存安排，请稍候…</p>':''}<button class="action" id="tomorrow" ${pending||r.due===1?'disabled':''}><strong>提高优先级 · 加入明天</strong><small>${r.due===1?'已安排在明天':r.due===null?'10月7日 · 开启新一轮，保留历史次数':'10月7日 · 手动安排优先加入计划'}</small></button><button class="action" id="after" ${pending||r.due!==1?'disabled':''}><strong>降低优先级 · 改到后天</strong><small>${r.due===1?'10月8日 · 从明天计划中移除':'仅明天的安排可延后'}</small></button><button class="action" id="delete" ${pending?'disabled':''}><strong>删除条目</strong><small>用于重复或生成错误的知识</small></button>`}`;
$('close').onclick=()=>$('sheet').close();if(del){$('cancel').onclick=()=>$('sheet').close();$('confirm-delete').onclick=()=>{records=records.filter(x=>x.id!==id);$('sheet').close();message='已删除条目及复习关联（仅预览）';render();};}else{if($('refresh'))$('refresh').onclick=()=>openSheet(id);$('tomorrow').onclick=()=>save(1);$('after').onclick=()=>save(2);$('delete').onclick=()=>openSheet(id,'delete');}if(!$('sheet').open)$('sheet').showModal();}
function save(target){selected.due=target;$('sheet').close();message=`已加入${target===1?'明天':'后天'}的复习安排 · 次数不变（仅预览）`;render();}
if(initial==='entry'||initial==='today')renderEntry(initial==='today');else{render();if(initial==='count-custom')openCountSheet();if(['actions','delete','pending','conflict'].includes(initial))openSheet(1,initial);}
</script></body></html>
