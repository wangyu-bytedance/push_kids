<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知芽 · 旅行日记</title>
<style>
:root{--paper:#FAF7F0;--surface:#FFFDF8;--ink:#22261F;--muted:#59624F;--green:#1F5B45;--wash:#E4EDE6;--line:#E2DCCC;--sunken:#F3EFE4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer;border:0;min-width:44px;min-height:44px;background:none;border-radius:12px;padding:8px 12px}button:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:3px}.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.brand{display:flex;align-items:center;justify-content:center;gap:8px;height:72px;color:var(--green);font-size:18px;font-weight:650}.brand span{color:var(--ink)}main{max-width:480px;margin:auto;padding:8px 16px 124px}.heading{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px}.title{display:flex;align-items:center;gap:8px;padding:0;font:22px/1.5 'Songti SC','Noto Serif SC',serif}.title .icon{width:16px;color:var(--muted)}.child{position:relative;display:flex;align-items:center;gap:8px;min-height:44px;max-width:100%;margin-left:auto;padding:6px 12px 6px 6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-weight:600}.avatar{display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:50%;background:var(--wash);color:var(--green)}.child-name{min-width:0;overflow-wrap:anywhere;word-break:break-all}.child .icon{width:16px;color:var(--muted)}.child select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.summary-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}.stats{display:flex;flex:1;min-width:0;flex-wrap:wrap;column-gap:14px;row-gap:2px;color:var(--muted)}.more{display:grid;place-items:center;width:44px;height:44px;flex:none;padding:10px;color:var(--muted)}.segments{display:flex;gap:4px;padding:4px;background:var(--sunken);border-radius:12px;margin-bottom:8px}.segments button{flex:1;min-width:0;padding:8px 4px;white-space:nowrap}.segments .selected{background:var(--green);color:white}.drafts{display:block;color:var(--green);margin:4px auto 12px}.visit{padding:12px 0 0 12px;border-left:1px solid #C7D8CB;margin-top:12px}.date{color:var(--green);margin-bottom:8px}.card{background:var(--surface);padding:12px;border:1px solid var(--line);border-radius:12px}.place{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}.place strong{font-weight:600}.place span{color:var(--muted)}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.landscape{display:block;width:100%;height:100px;border-radius:8px;background:#DCE8E5}.landscape:nth-child(2){background:#EEE4D3}.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;background:var(--green);color:#fff;font-weight:600}.primary .icon{width:20px;height:20px}.import{margin-top:20px}.empty{display:flex;min-height:180px;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted)}.empty .icon{width:32px;height:32px;color:var(--green)}.empty p{margin:0}.link{color:var(--green)}.status{margin-bottom:12px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;min-height:88px;padding:8px 8px 24px;background:var(--surface);border-top:1px solid var(--line)}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;max-width:96px;color:var(--muted);padding:6px 0}.nav .active{color:var(--green);font-weight:600}.backdrop{position:fixed;inset:0;background:#22261f66;display:flex;align-items:flex-end;z-index:10}.sheet{width:100%;max-height:88vh;background:var(--surface);border-radius:20px 20px 0 0;overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--line)}.sheet-head h2{font:600 16px/1.6 -apple-system,sans-serif;margin:0}.close{width:48px;height:48px;display:grid;place-items:center;padding:0}.sheet-body{padding:12px 16px}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}.switch{width:48px;height:28px;min-width:48px;min-height:28px;border-radius:999px;background:#DFDFDB;padding:3px;position:relative;pointer-events:none}.switch::before{content:'';display:block;background:#fff;width:22px;height:22px;border-radius:50%;box-shadow:0 1px 3px #2222}.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0;text-align:left;min-height:48px}.toggle[aria-checked=true] .switch{background:var(--green)}.toggle[aria-checked=true] .switch::before{transform:translateX(20px)}.sheet-footer{padding:12px 16px 28px;border-top:1px solid var(--line)}.action-sheet{padding:8px 12px 24px;border-radius:20px 20px 0 0}.action-sheet button{display:block;width:100%;min-height:52px;text-align:center}.action-sheet .cancel{border-top:1px solid var(--line);color:var(--muted);margin-top:4px;padding-top:12px}.action-sheet .child-choice{text-align:left}.action-sheet .child-choice span{color:var(--muted);margin-left:8px}.error{color:#A85742;padding:8px 0}.map{display:flex;align-items:center;justify-content:center;height:240px;background:var(--wash);border-radius:12px;color:var(--green)}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<div id="app"></div>
<script>
const paths={sprout:'M12 21v-9M12 15C6 15 3 12 3 6c6 0 9 3 9 9Zm0-3c0-5 3-8 9-8 0 6-3 9-9 9',down:'m6 9 6 6 6-6',camera:'M4 6h4l2-3h4l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2ZM16 13a4 4 0 1 1-8 0 4 4 0 0 1 8 0',calendar:'M4 5h16v16H4zM8 3v4m8-4v4M4 10h16',chart:'M5 20V10m7 10V4m7 16v-7M2 21h20',settings:'M3 6h18M3 12h18M3 18h18M8 4v4m8 2v4M8 16v4',more:'M5 12h.01M12 12h.01M19 12h.01',close:'m6 6 12 12M18 6 6 18',pin:'M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0ZM15 10a3 3 0 1 1-6 0 3 3 0 0 1 6 0'};
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]}"></path></svg>`;
const state=new URLSearchParams(location.search).get('state')||'overview';
const model={sheet:['actions','settings','archived'].includes(state)?state:'',archived:false,viewer:state==='viewer',empty:state==='empty',long:state==='long',standalone:state==='standalone',mode:0,name:'小禾',ai:false,savedAi:false,failSave:false};
let opener='more';
const scene=(second=false)=>`<svg class="landscape" viewBox="0 0 160 100" aria-hidden="true"><circle cx="${second?125:122}" cy="23" r="10" fill="${second?'#D5B979':'#E7D9AE'}"/><path d="M0 83 48 27 105 100H0Z" fill="${second?'#9B9F7B':'#759A8D'}"/><path d="m61 100 51-64 48 47v17Z" fill="${second?'#C0B792':'#ABC2B4'}"/></svg>`;
function render(){
 const name=model.long?'小禾的超长名字用于换行验证':model.name;
 const label=name+(model.archived?'（已归档）':'');
 const chip=`<div class="child"><span class="avatar" aria-hidden="true">${name.charAt(0)}</span><span class="child-name">${label}</span>${icon('down')}<select aria-label="切换孩子"><option>${label}</option><option>小林</option></select></div>`;
 const visit=`<div class="visit"><div class="date">2026年10月3日</div><div class="card"><div class="place"><strong>杭州 · 西湖</strong><span>4 张</span></div><div class="photos">${scene()}${scene(true)}</div></div></div>`;
 const content=model.empty?`<div class="empty">${icon('pin')}<p>还没有足迹</p><button class="link" id="manual">手动记录</button></div>`:model.mode===0?visit:`<div class="map">${icon('pin')}</div>`;
 let sheet='';
 if(model.sheet==='settings')sheet=`<section class="sheet settings-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">足迹设置</h2><button class="close" id="close" aria-label="关闭">${icon('close')}</button></div><div class="sheet-body"><button class="toggle" id="ai" role="switch" aria-checked="${model.ai}"><span>AI 地点候选</span><span class="switch" aria-hidden="true"></span></button>${model.failSave?'<div class="error" role="alert">保存失败，请重试</div>':''}</div><div class="sheet-footer"><button class="primary" id="save">保存设置</button></div></section>`;
 if(model.sheet==='actions')sheet=`<section class="sheet action-sheet" role="dialog" aria-modal="true" aria-label="更多操作">${model.viewer?'':'<button id="settings">足迹设置</button>'}<button id="archives">已归档孩子</button><button class="cancel" id="close">取消</button></section>`;
 if(model.sheet==='archived')sheet=`<section class="sheet action-sheet" role="dialog" aria-modal="true" aria-label="已归档孩子"><button class="child-choice" id="choose-archive">小满<span>已归档</span></button><button class="cancel" id="close">取消</button></section>`;
 document.querySelector('#app').innerHTML=`<div class="background" ${model.sheet?'inert aria-hidden="true"':''}><div class="brand">${icon('sprout')}<span>知芽</span></div><main><div class="heading">${model.standalone?'':`<button class="title" aria-label="记录类型，旅行日记"><span>旅行日记</span>${icon('down')}</button>`}${chip}</div>${model.archived?'<div class="status">已归档</div>':''}${model.viewer?'<div class="status">只读</div>':''}<div class="summary-row"><div class="stats"><span>${model.empty?'0':'8'} 个地点</span><span>${model.empty?'0':'5'} 座城市</span><span>${model.empty?'0':'3'} 个国家</span><span>${model.empty?'0':'24'} 张照片</span></div><button class="more" id="more" aria-label="更多操作">${icon('more')}</button></div><div class="segments" aria-label="足迹视图">${['时间线','轨迹回放','地图点亮'].map((label,i)=>`<button data-mode="${i}" class="${model.mode===i?'selected':''}" aria-pressed="${model.mode===i}">${label}</button>`).join('')}</div>${model.viewer?'':'<button class="drafts" id="drafts">3 张待核对</button>'}${content}${model.viewer||model.archived?'':`<button class="primary import" id="import">${icon('camera')}<span>导入照片</span></button>`}</main>${model.standalone?'':`<nav class="nav" aria-label="主导航">${[['sprout','今日'],['calendar','日程'],['camera','记录'],['chart','报表'],['settings','设置']].map(([i,label])=>`<button class="${label==='记录'?'active':''}">${icon(i)}<span>${label}</span></button>`).join('')}</nav>`}</div>${sheet?`<div class="backdrop">${sheet}</div>`:''}`;
 document.querySelector('#more').onclick=()=>open(model.viewer?'archived':'actions');
 const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
 bind('close',close);bind('settings',()=>open('settings'));bind('archives',()=>open('archived'));
 bind('ai',()=>{model.ai=!model.ai;render();document.getElementById('ai').focus();});
 bind('save',()=>{model.savedAi=model.ai;model.failSave=false;close();});
 bind('choose-archive',()=>{model.name='小满';model.archived=true;model.long=false;close();});
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{model.mode=Number(b.dataset.mode);render();});
 const backdrop=document.querySelector('.backdrop');if(backdrop)backdrop.onclick=e=>{if(e.target===backdrop)close();};
 const select=document.querySelector('select');select.onchange=()=>{model.name=select.value;model.long=false;model.archived=false;render();};
}
function open(sheet){model.sheet=sheet;render();document.querySelector('[role=dialog] button').focus();}
function close(){if(model.sheet==='settings')model.ai=model.savedAi;model.sheet='';render();document.getElementById(opener)?.focus({preventScroll:true});}
document.addEventListener('keydown',e=>{if(!model.sheet)return;if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const list=[...document.querySelectorAll('[role=dialog] button')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script>
</html>
