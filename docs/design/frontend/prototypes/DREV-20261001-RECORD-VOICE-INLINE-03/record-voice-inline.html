<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>输入框内嵌语音</title>
  <style>
    :root{--canvas:#faf7f0;--surface:#fffdf8;--sunken:#f3efe4;--ink:#202a25;--ink2:#4f5853;--ink3:#777d79;--line:#ebe5d7;--pine:#1f5b45;--pine-soft:#dce9e1;--sprout:#7fa65c;--serif:"Songti SC","Noto Serif SC",STSong,serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--canvas);color:var(--ink);font-family:var(--sans)}button{font:inherit}.app{position:relative;width:100vw;height:100vh;min-height:568px;overflow:hidden}.page{width:min(480px,100%);height:100%;margin:auto;padding:18px 16px 146px;overflow-y:auto}.brand{height:40px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--pine);font-family:var(--serif);font-size:18px;font-weight:700}.leaf{width:18px;height:18px;border-radius:12px 2px 12px 2px;background:var(--sprout);transform:rotate(-35deg)}.head{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-family:var(--serif);font-size:27px;font-weight:700}.child{height:44px;padding:0 14px;border:0;border-radius:999px;background:var(--pine-soft);color:var(--pine);font-weight:700}.time-card{margin-top:18px;padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.cap{color:var(--ink3);font-size:12px}.time{margin-top:3px;font-size:15px;font-weight:650}.small{height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--sunken);color:var(--ink2);font-size:13px;font-weight:700}.label{margin-top:22px;font-size:15px;font-weight:700}.photo{margin-top:10px;height:82px;border:1px dashed #cfc7b8;border-radius:16px;background:rgba(255,253,248,.72);display:grid;place-items:center;color:var(--ink3);font-size:13px}.input-shell{position:relative;margin-top:10px;height:92px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}.text{padding:13px 58px 31px 14px;font-size:15px;line-height:1.55}.placeholder{color:#969c98}.counter{position:absolute;left:14px;bottom:10px;color:var(--ink3);font-size:12px}.mic-button{position:absolute;right:5px;bottom:3px;width:44px;height:44px;border:0;background:transparent;color:var(--pine);display:grid;place-items:center}.mic-face{width:36px;height:36px;border-radius:50%;background:var(--pine-soft);display:grid;place-items:center}.mic{position:relative;width:15px;height:19px}.mic:before{content:"";position:absolute;left:4px;top:0;width:7px;height:12px;border:2px solid currentColor;border-radius:8px}.mic:after{content:"";position:absolute;left:1px;top:7px;width:13px;height:8px;border:2px solid currentColor;border-top:0;border-radius:0 0 9px 9px}.hold-state{position:absolute;inset:0;background:#e8f0eb;color:var(--pine);display:grid;place-items:center;text-align:center}.hold-state strong{display:block;font-size:16px}.hold-state span{display:block;margin-top:6px;font-size:12px}.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);padding:10px 15px;border-radius:999px;background:rgba(31,91,69,.94);color:#fff;font-size:13px;font-weight:700;z-index:8;white-space:nowrap}.history{margin-top:22px;height:56px;padding:0 15px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;align-items:center;font-weight:700}.history span{margin-left:auto;color:var(--ink3)}.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(17px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(250,247,240,0),var(--canvas) 18%,var(--canvas));z-index:4}.cta-in{width:min(480px,100%);margin:auto}.primary{width:100%;height:48px;border:0;border-radius:16px;background:var(--pine);color:white;font-size:16px;font-weight:750}.primary.disabled{background:#aeb8b2}.help{margin-top:6px;color:var(--ink3);font-size:11px;text-align:center}
    [data-state="idle"] .hold-state,[data-state="idle"] .toast,[data-state="idle"] .typed{display:none}[data-state="holding"] .text,[data-state="holding"] .counter,[data-state="holding"] .mic-button,[data-state="holding"] .toast{display:none}[data-state="holding"] .primary{background:#aeb8b2}[data-state="appended"] .hold-state,[data-state="appended"] .placeholder{display:none}
    @media(max-width:350px){.page{padding:12px 12px 140px}.brand{height:32px}.head{margin-top:8px}.title{font-size:24px}.time-card{margin-top:13px;padding:12px}.label,.history{margin-top:15px}.photo{height:62px}.input-shell{height:84px}.text{padding-top:11px}.cta{padding-left:12px;padding-right:12px}}
  </style>
</head>
<body>
  <main class="app" data-state="idle">
    <section class="page">
      <div class="brand"><span class="leaf"></span>知芽</div>
      <header class="head"><div class="title">一笔一画，都算数</div><button class="child">芽芽⌄</button></header>
      <section class="time-card"><div class="row"><div class="grow"><div class="cap">实际学习时间</div><div class="time">2026-10-01 · 20:18</div></div><button class="small">修改</button></div></section>
      <div class="label">学习照片</div><div class="photo">添加学习照片 · 拍摄或从相册选择</div>
      <div class="label">学习内容</div>
      <section class="input-shell">
        <div class="text"><span class="placeholder">写下今天学了什么…</span><span class="typed">今天练习了乘法分配律。<br>还复习了简便计算。</span></div>
        <span class="counter"><span class="zero">0</span><span class="count">25</span> / 4000</span>
        <button class="mic-button" aria-label="按住录音，松开转成文字，上滑取消"><span class="mic-face"><span class="mic"></span></span></button>
        <div class="hold-state"><div><strong>松开，转成文字</strong><span>上滑取消本次</span></div></div>
      </section>
      <div class="history">历史记录 <span>⌄</span></div>
    </section>
    <div class="toast">✓ 已转成文字，请检查</div>
    <footer class="cta"><div class="cta-in"><button class="primary disabled">添加照片或文字后继续</button><div class="help">提交后会先生成待确认的草稿</div></div></footer>
  </main>
  <script>
    const allowed = new Set(["idle", "holding", "appended"]);
    const state = new URLSearchParams(location.search).get("state") || "idle";
    const app = document.querySelector(".app");
    app.dataset.state = allowed.has(state) ? state : "idle";
    if (state === "appended") {
      document.querySelector(".zero").style.display = "none";
      document.querySelector(".primary").classList.remove("disabled");
      document.querySelector(".primary").textContent = "提交整理";
    } else {
      document.querySelector(".count").style.display = "none";
    }
  </script>
</body>
</html>
