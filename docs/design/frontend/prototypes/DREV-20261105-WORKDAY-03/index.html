<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作日备注减法 · DREV03</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FAF7F0;color:#22261F;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:14px;background:#F3EFE4;padding:9px 12px}button:focus-visible,input:focus-visible{outline:2px solid #1F5B45;outline-offset:2px}.page{padding:24px 16px}.muted,.eyebrow{color:#79826F;font-size:14px}h1{font-size:26px;margin:6px 0 22px}h2{font-size:18px;margin:0}.card{background:#FFFDF8;border:1px solid #EBE5D7;border-radius:22px;padding:18px;margin:16px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.label{font-size:14px;color:#464E43;margin-bottom:8px}.summary{font-size:14px;color:#1F5B45}.mask{position:fixed;inset:0;background:#22261F66;display:flex;align-items:flex-end}.sheet{width:100%;max-height:85vh;background:#FFFDF8;border-radius:26px 26px 0 0;display:flex;flex-direction:column}.handle{width:36px;height:4px;border-radius:9px;background:#DDD6C4;margin:10px auto}.head{padding:0 20px 12px}.close{min-width:44px;background:transparent;font-size:24px}.body{overflow:auto;padding:0 20px 16px;min-height:0}.foot{border-top:1px solid #EBE5D7;padding:12px 20px max(16px,env(safe-area-inset-bottom));background:#FFFDF8}.primary{width:100%;background:#1F5B45;color:white}.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;background:#22261F0D;padding:4px;border-radius:18px;margin:0 0 18px}.seg button{font-size:14px;padding:8px 2px;background:transparent;border-radius:14px;white-space:normal}.seg .selected{background:#FFF;color:#14402F;box-shadow:0 1px 4px #22261F0A;font-weight:600}.times{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.field{border:1px solid #DDD6C4;border-radius:14px;padding:10px 12px;min-height:48px;display:block;width:100%;background:white;font-size:16px}.notice{background:#F3EFE4;border-radius:14px;padding:12px;font-size:14px;color:#464E43;margin:12px 0}.warning{background:#F8EFDC;color:#825B20}.subtitle{font-size:14px;color:#79826F;margin-top:4px}.delete{width:100%;background:transparent;color:#A85742;margin-top:4px}.day{display:flex;gap:8px;margin-bottom:20px}.day span{flex:1;text-align:center;border-radius:15px;background:#F3EFE4;padding:10px 0;font-size:14px}.day .today{background:#1F5B45;color:white}.sec{margin-top:24px}.sec-bar{display:flex;align-items:center;gap:8px;min-height:44px}.sec-title{font-size:18px;font-weight:600}.sec-meta{flex:1;text-align:right;font-size:14px;color:#79826F}.sec-rule{height:1px;background:#EBE5D7}.timeline{display:flex;align-items:flex-start;gap:12px;margin-top:16px}.timeline time{padding-top:18px;font-size:14px;color:#79826F}.timeline .card{flex:1;margin:0;min-width:0}.chev{color:#79826F;font-size:14px}.hero{background:#E4EDE6;border-color:#D6E2D7}.status{font-size:14px;color:#825B20}
</style>
<div id="app"></div>
<script>
// Synthetic design data. Today exports focus the affected activity region; no section reordering is proposed.
const states=['settings-workday','settings-coverage','calendar-create','calendar-edit','calendar-coverage','calendar-partial-coverage','today-coverage','today-partial-coverage'];
window.designStates=states;let state=states[0];let draft={start:'18:00',end:'19:00'};
const warning='<div class="notice warning" role="status">工作日安排待更新</div>';
function times(){return `<div class="times"><label><div class="label">开始时间</div><input aria-label="开始时间" class="field" value="${draft.start}" onchange="draft.start=this.value"></label><label><div class="label">结束时间</div><input aria-label="结束时间" class="field" value="${draft.end}" onchange="draft.end=this.value"></label></div>`}
function segment(labels,selected,host){return `<div class="seg" role="group" aria-label="${host==='settings'?'安排方式':'重复规则'}">${labels.map((x,i)=>`<button class="${i===selected?'selected':''}" aria-pressed="${i===selected}" onclick="selectMode('${host}',${i})">${x}</button>`).join('')}</div>`}
function selectMode(host,index){const el=document.querySelector('.body .seg');el.querySelectorAll('button').forEach((button,i)=>{button.classList.toggle('selected',i===index);button.setAttribute('aria-pressed',String(i===index))});}
window.designShow=function(next){state=next;render()};
function render(){const settings=state.startsWith('settings'),today=state.startsWith('today'),coverage=state.includes('coverage'),partial=state.includes('partial'),list=!settings&&coverage;
let page;
if(today){page=`<div class="eyebrow">合成孩子 · 1月4日</div><h1>今天，也慢慢来</h1><div class="card hero"><div class="muted">今天的复习安排</div><h2>今天没有安排复习</h2><button style="margin-top:16px" onclick="void 0">记录学习</button></div><section class="sec"><div class="sec-bar"><span class="sec-title">课外活动</span><span class="sec-meta status" role="status">工作日安排待更新</span><span class="chev">⌃</span></div><div class="sec-rule"></div>${partial?'<div class="timeline"><time>16:00</time><div class="card"><h2>游泳</h2><div class="summary">16:00–17:00 · 活动</div><button style="margin-top:12px">记录活动</button></div></div>':''}</section>`;
}else if(settings){page='<div class="eyebrow">设置 / 课外活动</div><h1>合成孩子的活动</h1><div class="card"><div class="row"><h2>英语辅导课</h2><button onclick="designShow(\'settings-workday\')">安排</button></div><div class="summary">工作日 · 18:00–19:00</div></div>';
}else{page=`<div class="eyebrow">合成孩子</div><h1>日程</h1><div class="day">${['一','二','三','四','五','六','日'].map((x,i)=>`<span class="${i===0?'today':''}">${x}</span>`).join('')}</div><div class="row"><h2>${coverage?'2027年1月4日':'2026年11月5日'}</h2><button onclick="designShow('calendar-create')">加日程</button></div>${coverage?warning:''}${!coverage||partial?'<div class="card"><h2>游泳</h2><p class="summary">16:00–17:00 · 不重复</p><button onclick="designShow(\'calendar-edit\')">编辑日程</button></div>':''}`;}
document.getElementById('app').innerHTML=`<main class="page" id="background">${page}</main>`;
if(list||today)return;
let content=settings?segment(['指定星期','工作日','时间不固定'],1,'settings')+times()+'<div class="notice">工作日 · 18:00–19:00</div>':`<label><div class="label">日程名称</div><input aria-label="日程名称" class="field" value="阅读时间"></label><div class="label" style="margin-top:16px">重复</div>`+segment(['不重复','每周','工作日'],2,'calendar')+'<div class="label">类型</div><div class="seg"><button aria-pressed="false">辅导课</button><button aria-pressed="false">活动</button><button class="selected" aria-pressed="true">其他</button></div><label><div class="label">起始日期</div><input aria-label="起始日期" class="field" value="2026-11-05"></label>'+times();
document.getElementById('background').inert=true;
document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="mask"><section class="sheet" role="dialog" aria-modal="true" aria-label="${settings?'活动安排':'日程编辑'}"><div class="handle"></div><div class="head row"><div><h2>${settings?'英语辅导课 · 安排':state==='calendar-edit'?'编辑日程':'加日程'}</h2>${state==='calendar-edit'?'<div class="subtitle">修改会作用于整个工作日系列</div>':''}</div><button class="close" aria-label="关闭" onclick="closeSheet()">×</button></div><div class="body">${content}</div><div class="foot"><button class="primary">保存</button>${settings||state==='calendar-edit'?'<button class="delete">移除'+(settings?'安排':'日程')+'</button>':''}</div></section></div>`);
}
function closeSheet(){document.querySelector('.mask')?.remove();document.getElementById('background').inert=false;document.querySelector('main button')?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});render();
</script>
</html>
