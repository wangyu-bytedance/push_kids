<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知芽 · 设置页顶部切换风格</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:var(--canvas)}
button{font:inherit;cursor:pointer;min-height:44px;min-width:44px;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{cursor:default;opacity:.6}button,h1,h2,p{margin:0}button{border:0;background:none}
[hidden]{display:none!important}.phone{min-height:100dvh;background:var(--canvas)}
.status{height:32px;padding:7px 22px 0;font-size:12px;display:flex;justify-content:space-between;background:var(--nav);color:var(--header-ink)}
.nav{height:48px;background:var(--nav);color:var(--header-ink);display:flex;align-items:center;justify-content:center;position:relative;font-weight:650;letter-spacing:2px}
.capsule{position:absolute;right:16px;letter-spacing:1px;border:1px solid #87928b44;border-radius:20px;padding:3px 12px;font-size:14px}
.content{padding:0 18px 120px}.hero{position:relative;min-height:176px;margin:0 -18px 18px;padding:28px 18px 20px;isolation:isolate;color:var(--header-ink)}
.hero img{position:absolute;inset:0;z-index:-1;width:100%;height:100%;object-fit:cover}.hero h1{font-size:26px;line-height:1.35;max-width:66%;font-weight:750;letter-spacing:-.5px}
.eyebrow{font-size:13px;margin-bottom:6px;color:var(--header-muted)}.child{display:inline-flex;align-items:center;gap:8px;margin-top:13px;padding:5px 11px 5px 5px;background:var(--surface);border:1px solid var(--line);border-radius:24px;color:var(--ink);font-size:13px;min-height:36px}
.avatar,.mark{background:var(--tint);color:var(--accent);display:grid;place-items:center;flex:none}.avatar{width:26px;height:26px;border-radius:50%}.mark{width:42px;height:42px;border-radius:12px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;background:var(--surface)}
.theme-entry{width:100%;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;min-height:78px}.entry-text{flex:1;min-width:0}.entry-title{display:block;font-weight:650;font-size:16px}.entry-meta{display:block;font-size:13px;color:var(--secondary);margin-top:3px}
.chev{color:var(--secondary);font-size:23px}.entry-preview{width:48px;height:44px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}.original .entry-preview{object-fit:contain}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.card h2{font-size:18px}.tag{font-size:12px;color:var(--secondary)}.sub{color:var(--secondary);font-size:14px}.row{display:flex;align-items:center;gap:12px;min-height:76px;border-bottom:1px solid var(--line)}.row:last-of-type{border:0}.row-text{flex:1;min-width:0}.row strong{font-size:16px;font-weight:550}
.add{width:100%;min-height:48px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;margin-top:12px;display:flex;justify-content:center;align-items:center;gap:8px}
.tabbar{position:fixed;z-index:5;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:var(--surface);display:flex;padding:10px 4px 22px;align-items:center;justify-content:space-around}
.tab{color:var(--secondary);text-align:center;flex:1;font-size:12px}.tab.active{color:var(--accent);font-weight:650}.tab .symbol{display:grid;place-items:center;height:30px;margin-bottom:2px}.tab.record .symbol{height:46px;width:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);margin:-15px auto 1px}
.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shade{position:fixed;inset:0;z-index:10;background:#0b1b2b88}
.sheet{position:fixed;z-index:11;bottom:0;left:0;right:0;max-height:calc(100dvh - 36px);border:1px solid var(--line);border-radius:24px 24px 0 0;background:var(--surface);padding:8px 18px 20px;display:flex;flex-direction:column;color:var(--ink)}
.handle{width:36px;height:4px;border-radius:8px;background:var(--line);margin:0 auto 8px}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet h2{font-size:20px}.close{font-size:24px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow-y:auto;padding:4px 3px;margin:7px -3px 12px;min-height:0}
.choice{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;text-align:left;background:var(--surface);min-width:0}
.choice[aria-checked=true]{border:2px solid var(--accent)}.choice img{display:block;width:100%;height:70px;object-fit:cover}.choice.original img{object-fit:contain;background:#faf7f0}
.choice-text{padding:8px 10px;display:block}.choice-name{display:block;font-size:14px;font-weight:650;padding-right:18px}.choice-state{display:block;font-size:12px;color:var(--secondary);margin-top:1px;min-height:18px}.check{position:absolute;bottom:25px;right:9px;background:var(--accent);color:var(--on-accent);width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px;font-size:12px}
.apply{width:100%;flex:none;min-height:48px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:650}.notice{font-size:14px;background:var(--tint);color:var(--ink);border:1px solid var(--line);padding:12px 14px;border-radius:12px;margin:12px 0}.toast{position:fixed;z-index:20;bottom:114px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:11px 18px;border-radius:12px;white-space:nowrap}
.tabbar{padding-bottom:max(22px,env(safe-area-inset-bottom))}.sheet{padding-bottom:max(20px,env(safe-area-inset-bottom))}
.original .hero{min-height:130px}.original .hero img{display:none}.original h1,.original .card h2{font-family:"Songti SC",serif}
.garden .card{border-radius:23px 23px 23px 7px}.garden .hero:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:12px;border-radius:50% 50% 0 0;background:var(--canvas)}
.tech .card{border-radius:8px 20px 8px 8px}.tech .card-head{border-left:3px solid var(--accent);padding-left:10px}
.ocean .hero:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:14px;border-radius:55% 45% 0 0;background:var(--canvas)}
@media(max-height:650px){.choice img{height:43px}.choice-text{padding:6px 9px}.sheet{padding-bottom:12px}.grid{gap:8px}.sheet h2{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body><div class="phone" id="app"></div>
<script>
const ART=__THEME_ART__;
const THEMES=[
 {id:"original",name:"原始风格",symbol:"book",fallback:"书本",canvas:"#faf7f0",surface:"#fffdf8",tint:"#e4ede6",accent:"#1f5b45",ink:"#22261f",secondary:"#646e5c",line:"#e5dfd2",nav:"#faf7f0",headerInk:"#22261f",headerMuted:"#646e5c",onAccent:"#fffdf8",radius:"20px"},
 {id:"garden",name:"成长花园",symbol:"sprout",fallback:"嫩芽",canvas:"#eef2dc",surface:"#fffbee",tint:"#e2ecc3",accent:"#527a21",ink:"#293f29",secondary:"#5d6c4b",line:"#dce2c3",nav:"#f9f7e9",headerInk:"#233d29",headerMuted:"#445f3f",onAccent:"#ffffff",radius:"22px"},
 {id:"space",name:"星际探索",symbol:"planet",fallback:"小星球",canvas:"#dfe8fb",surface:"#f7faff",tint:"#e2e8ff",accent:"#405dd0",ink:"#20355d",secondary:"#52658c",line:"#d4dff4",nav:"#192953",headerInk:"#ffffff",headerMuted:"#e3eaff",onAccent:"#ffffff",radius:"22px"},
 {id:"midnight",name:"深海夜色",symbol:"compass",fallback:"罗盘星",canvas:"#10262e",surface:"#1b343c",tint:"#344a49",accent:"#e8c592",ink:"#edf4f4",secondary:"#b3c6ca",line:"#3a535a",nav:"#10262e",headerInk:"#f5f5ec",headerMuted:"#b3c8ce",onAccent:"#21343a",radius:"14px"},
 {id:"ocean",name:"海洋风格",symbol:"shell",fallback:"贝壳",canvas:"#e2f5f8",surface:"#fafdff",tint:"#d5f0f6",accent:"#087e9c",ink:"#204454",secondary:"#526e7b",line:"#d3e9ef",nav:"#f2fbfd",headerInk:"#164554",headerMuted:"#275e6d",onAccent:"#ffffff",radius:"24px"},
 {id:"tech",name:"科技风格",symbol:"chip",fallback:"芯片",canvas:"#eaf2f6",surface:"#ffffff",tint:"#d9f4f3",accent:"#007d84",ink:"#193b49",secondary:"#506d79",line:"#d4e7ed",nav:"#f5fafc",headerInk:"#173c49",headerMuted:"#456977",onAccent:"#ffffff",radius:"12px"}
];
const paths={
 book:"M4 4h6c2 0 2 1 2 2 0-1 0-2 2-2h6v16h-6c-2 0-2 1-2 1s0-1-2-1H4V4Zm8 2v15",
 sprout:"M12 21V11M12 12C5 13 3 9 3 5c7 0 9 4 9 7Zm0-1c0-6 3-8 9-8 0 6-3 8-9 8Z",
 planet:"M18 12a6 6 0 1 1-12 0 6 6 0 0 1 12 0ZM5 10c-3 1-4 3-3 4s6 1 12-1 9-4 8-5-3-1-5 0",
 compass:"m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2ZM12 9v6m-3-3h6",
 shell:"M6 18 3 11C0 1 24 1 21 11l-3 7H6ZM8 18 6 7m6 11V5m4 13 2-11M8 18v3h8v-3",
 chip:"M6 6h12v12H6V6Zm3 3h6v6H9V9ZM9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4",
 calendar:"M4 5h16v16H4V5Zm0 5h16M8 3v4m8-4v4",
 camera:"M3 6h5l2-3h4l2 3h5v15H3V6Zm13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z",
 chart:"M4 20h17M7 16v-5m5 5V5m5 11V8",
 sliders:"M3 6h18M3 18h18M8 3v6m8 6v6",
 clock:"M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-5v5l3 2",
 plus:"M12 4v16M4 12h16"
};
function icon(name){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[name]+'"/></svg>'}
const query=new URLSearchParams(location.search);
const descriptions={original:"纸面与松绿",garden:"纸雕花园与嫩芽",space:"星空与观测站",midnight:"静谧深海与金线",ocean:"阳光浅海与鲸鱼",tech:"未来实验室与机器人"};
let current=THEMES.find(t=>t.id===query.get("theme"))||THEMES[0], selected=current.id, open=query.get("state")==="picker", failed=query.get("state")==="storage-error";
let focusReturn=null;
function applyVariables(){
 document.body.className=current.id;
 const keys={canvas:"canvas",surface:"surface",tint:"tint",accent:"accent",ink:"ink",secondary:"secondary",line:"line",nav:"nav",headerInk:"header-ink",headerMuted:"header-muted",onAccent:"on-accent",radius:"radius"};
 Object.entries(keys).forEach(([key,variable])=>document.body.style.setProperty("--"+variable,current[key]));
}
function render(){
 applyVariables();
 document.getElementById("app").innerHTML=
 '<div id="page" '+(open?'inert aria-hidden="true"':'')+'><div class="status"><span>9:41</span><span>●●●  ▰</span></div><div class="nav">'+icon("sprout")+' 知芽<span class="capsule">••• ⊙</span></div>'+
 '<main class="content"><header class="hero"><img src="'+ART[current.id]+'" alt=""><p class="eyebrow">设置</p><h1>按你们的节奏来</h1><div class="child"><span class="avatar">小</span><span>小禾</span><span>⌄</span></div></header>'+
 '<button id="open-picker" class="card theme-entry" aria-haspopup="dialog"><img class="entry-preview" src="'+ART[current.id]+'" alt=""><span class="entry-text"><span class="entry-title">界面风格</span><span class="entry-meta">'+current.name+'</span></span><span class="chev" aria-hidden="true">›</span></button>'+
 (failed?'<p class="notice" role="status">当前风格已应用，本次未能记住，下次打开可能恢复原始风格。</p>':'')+
 '<section class="card"><div class="card-head"><h2>在学科目</h2><span class="tag">3 个科目</span></div>'+
 ["语文","数学","英语"].map(name=>'<div class="row"><span class="mark">'+icon("book")+'</span><div class="row-text"><strong>'+name+'</strong><div class="sub">已加入</div></div><span class="chev">›</span></div>').join("")+
 '<button class="add">'+icon("plus")+'添加其他科目</button></section><section class="card"><div class="card-head"><h2>课外活动</h2></div><div class="row"><span class="mark">'+icon(current.symbol)+'</span><div class="row-text"><strong>自然观察</strong><div class="sub">时间不固定</div></div><span class="chev">›</span></div><button class="add">'+icon("plus")+'添加课外活动</button></section></main>'+
 '<nav class="tabbar" aria-label="主导航">'+[["今日","sprout"],["日程","calendar"],["记录","camera"],["报表","chart"],["设置","sliders"]].map(([name,symbol],i)=>'<button class="tab '+(i===2?'record':i===4?'active':'')+'"><span class="symbol">'+icon(symbol)+'</span>'+name+'</button>').join("")+'</nav></div>'+
 (open?'<div class="shade" id="shade"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="handle"></div><header class="sheet-head"><h2 id="sheet-title">选择界面风格</h2><button id="close-picker" class="close" aria-label="关闭风格选择">×</button></header><div class="grid" role="radiogroup" aria-label="六种界面风格">'+
 THEMES.map(t=>'<button class="choice '+t.id+'" role="radio" aria-checked="'+(t.id===selected)+'" data-theme="'+t.id+'"><img src="'+ART[t.id]+'" alt=""><span class="choice-text"><span class="choice-name">'+t.name+'</span><span class="choice-state">'+(t.id===current.id?'当前使用':descriptions[t.id])+'</span></span>'+(t.id===selected?'<span class="check" aria-hidden="true">✓</span>':'')+'</button>').join("")+
 '</div><button class="apply" id="apply-theme" '+(selected===current.id?'disabled':'')+'>'+(selected===current.id?'正在使用':'使用这个风格')+'</button></section>':'');
 document.getElementById("open-picker").onclick=()=>{focusReturn="open-picker";open=true;selected=current.id;render();document.getElementById("close-picker").focus()};
 if(open){
  document.getElementById("shade").onclick=close;
  document.getElementById("close-picker").onclick=close;
  document.querySelectorAll("[data-theme]").forEach(button=>button.onclick=()=>{selected=button.dataset.theme;render();document.querySelector('[data-theme="'+selected+'"]').focus()});
  document.getElementById("apply-theme").onclick=()=>{current=THEMES.find(t=>t.id===selected);open=false;render();document.getElementById("open-picker").focus();const toast=document.createElement("div");toast.className="toast";toast.setAttribute("role","status");toast.textContent="已切换为"+current.name;document.body.append(toast);setTimeout(()=>toast.remove(),1500)};
 }
 window.DESIGN_READY=true;
}
function close(){open=false;selected=current.id;render();document.getElementById(focusReturn||"open-picker").focus()}
document.addEventListener("keydown",e=>{
 if(!open)return;
 if(e.key==="Escape"){e.preventDefault();close()}
 if(e.key==="Tab"){const nodes=[...document.querySelectorAll(".sheet button:not(:disabled)")],first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
window.DESIGN_THEMES=THEMES.map(t=>({id:t.id,name:t.name}));
window.DESIGN_STATE=()=>({current:current.id,selected,open});
render();
</script></body></html>
