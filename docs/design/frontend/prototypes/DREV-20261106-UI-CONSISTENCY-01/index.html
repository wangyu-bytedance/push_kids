<script>
'use strict';
const paths={sprout:'M12 21v-9M12 13C5 13 3 8 3 4c5 0 9 3 9 8M12 11c0-5 4-8 9-8 0 5-4 9-9 9',calendar:'M7 3v4m10-4v4M4 10h16M5 5h14a2 2 0 0 1 2 2v13H3V7a2 2 0 0 1 2-2Z',camera:'M8 6l1-3h6l1 3h4a1 1 0 0 1 1 1v13H3V7a1 1 0 0 1 1-1h4ZM16 13a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z',chart:'M4 21h17M6 16V9m6 7V3m6 13V7',settings:'M3 6h8m4 0h6M3 18h4m4 0h10M11 3v6M7 15v6M3 12h14m4 0h0M17 9v6',chevron:'m9 5 7 7-7 7',down:'m6 9 6 6 6-6',left:'m15 5-7 7 7 7',plus:'M12 5v14M5 12h14',close:'m6 6 12 12M6 18 18 6',check:'m5 12 4 4L19 6',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM12 7v6l4 2',book:'M12 6c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v15',board:'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM9 3v18m6-18v18M3 9h18M3 15h18',swim:'m3 20 3-1 3 1 3-1 3 1 3-1 3 1M5 15l6-4 5 4m-5-4L8 7m6-1a2 2 0 1 1 4 0 2 2 0 0 1-4 0ZM3 16l6-3',map:'m9 4-6 2v15l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v15m6-13v15',pin:'M19 9c0 5-7 12-7 12S5 14 5 9a7 7 0 1 1 14 0ZM14 9a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z',family:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2M20 4a3 3 0 0 1 0 6m2 11v-2a6 6 0 0 0-3-5',bell:'M18 8a6 6 0 0 0-12 0c0 9-3 9-3 10h18c0-1-3-1-3-10ZM10 21h4',archive:'M3 3h18v5H3V3Zm2 5v13h14V8M9 12h6',info:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM12 11v6m0-10h.01',alert:'m12 3 10 18H2L12 3Zm0 6v5m0 3h.01',history:'M3 12a9 9 0 1 0 3-7L3 8m0-6v6h6m3-1v6l4 2',mic:'M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0V5Zm-3 6v1a6 6 0 0 0 12 0v-1m-6 7v4m-4 0h8',image:'M3 3h18v18H3V3Zm0 14 6-6 5 5 3-3 4 4M15 7h.01',edit:'m15 4 5 5M3 21l5-1L21 7l-5-5L3 15v6Z',cloud:'M7 18a5 5 0 0 1-1-10 6 6 0 0 1 12-1 5 5 0 0 1 0 10m-8-4 2-2 2 2m-2-2v10',refresh:'M20 8a8 8 0 1 0 1 6M20 3v5h-5',lock:'M5 10h14v12H5V10Zm3 0V6a4 4 0 0 1 8 0v4m-4 5v3',signal:'M3 18v3m5-7v7m5-12v12m5-17v17',wifi:'M3 9a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0m-9 4a4 4 0 0 1 6 0m-3 4h.01',trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7',search:'M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Zm-2 5 6 6',arrow:'M4 12h16m-6-6 6 6-6 6',shield:'M12 3 3 6v6c0 5 9 10 9 10s9-5 9-10V6l-9-3Zm-4 9 3 3 5-6'};
const icon=(name,cls='')=>`<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.info}"/></svg>`;
const nav=(scene)=>`data-nav="${scene}"`;
const btn=(text,scene='',cls='')=>`<button type="button" class="button ${cls}" ${scene?nav(scene):'data-demo="保存"'}>${text}</button>`;
const tag=(text,cls='')=>`<span class="tag ${cls}">${text}</span>`;
const child=()=>`<button type="button" class="child-chip" ${nav('child-switch')} aria-label="切换或管理孩子"><span class="avatar">禾</span>小禾${icon('down')}</button>`;
const head=(title,eyebrow='',withChild=true)=>`<header class="page-head"><div>${eyebrow?`<p class="eyebrow">${eyebrow}</p>`:''}<h1>${title}</h1></div>${withChild?child():''}</header>`;
const row=(title,sub,ico='book',scene='',tail='')=>`<button type="button" class="row row-btn" ${scene?nav(scene):`data-demo="${title}"`}><span class="mark">${icon(ico)}</span><span class="grow"><span class="title">${title}</span>${sub?`<span class="sub">${sub}</span>`:''}</span>${tail||icon('chevron','chevron')}</button>`;
const add=(text,scene)=>`<button type="button" class="add-entry" ${nav(scene)}>${icon('plus')}${text}</button>`;
const notice=(text,kind='')=>`<div class="notice ${kind}">${icon(kind==='error'?'alert':kind==='warning'?'info':'info')}<p>${text}</p></div>`;
const field=(label,value='',type='text',note='',invalid=false)=>`<label class="field"><span class="field-label">${label}</span><input class="input ${invalid?'invalid':''}" value="${value}" type="${type}" ${invalid?'aria-invalid="true"':''}>${note?`<span class="${invalid?'field-error':'field-note'}">${invalid?icon('alert'):''}${note}</span>`:''}</label>`;
const select=(label,value,scene='')=>`<div class="field"><span class="field-label">${label}</span><button type="button" class="field-select" ${scene?nav(scene):`data-demo="选择${label}"`}>${value}${icon('down','sm')}</button></div>`;
const area=(label,value='',note='')=>`<label class="field"><span class="field-label">${label}</span><textarea class="input area">${value}</textarea>${note?`<span class="field-note">${note}</span>`:''}</label>`;
const quick=(values,active)=>`<div class="quick">${values.map(v=>`<button type="button" class="${v===active?'active':''}" data-select>${v}</button>`).join('')}</div>`;
const footer=(main,scene='',sub='',secondary='')=>({footer:`${sub?`<p class="meta center">${sub}</p>`:''}<div class="actions">${secondary?btn(secondary,'cancel-edit','outline'):''}${btn(main,scene)}</div>`});
const defaultFooter=()=>footer('保存','saved','','取消');
const scenic=(variant=0)=>`<svg viewBox="0 0 200 130" role="img" aria-label="合成风景占位图"><rect width="200" height="130" fill="${variant?'#E8E6DA':'#E2E9DF'}"/><circle cx="153" cy="31" r="15" fill="#D1BC79"/><path d="M0 100 45 42 105 111 151 61 200 102V130H0Z" fill="#8DA58B"/><path d="M0 119 75 73 140 124 200 86V130H0Z" fill="#5F7F69"/><path d="M75 73 108 111 95 130H70L85 102Z" fill="#C9D5BF"/></svg>`;
const sceneDefs=[
 ['settings','设置 · 总览','主页面','统一分组与添加入口，压缩插画和留白。'],
 ['settings-routines','设置 · 任务与出行','主页面','三个添加按钮保持相同透明背景、边框与高度。'],
 ['today','今日','主页面','先看到今天要做的事，学习、复习和每日任务各自清楚。'],
 ['calendar','日程','主页面','周历前置，回到今天和新增安排触手可及。'],
 ['records','记录 · 学习','主页面','学习 / 旅行切换可见，照片与手动输入都容易找到。'],
 ['travel','记录 · 旅行','主页面','历史照片与待确认草稿分开，日期和地点容易核对。'],
 ['reports','报表','主页面','统计行为事实，范围、单位和复习分布口径明确。'],

 ['record-detail','记录详情','学习与安排','原始材料、已确认内容与复习反馈有清晰层级。'],

 ['activity-schedule','课外活动安排','学习与安排','先选择指定星期、工作日或时间不固定，再设置时间。'],
 ['manual-confirm','手动记录确认','学习与安排','保留不经过 AI 整理的手动路径，由家长确认。'],
 ['daily-form','每日任务表单','学习与安排','名称、目标时长和保存操作统一。'],
 ['travel-plan','出行安排表单','学习与安排','一次 / 重复安排同一套表单，说明仅在日程展示。'],
 ['travel-review','旅行草稿核对','学习与安排','照片、日期和地点对应，缺项就地修正后确认。'],
 ['child','孩子档案','家庭与设置','档案表单统一，归档单独分区，保存位置稳定。'],
 ['child-switch','切换孩子','家庭与设置','主页面共用半屏选择器，切换和管理分开。'],
 ['grade','年级确认','家庭与设置','保留单一选择器与两个明确操作。'],
 ['family-onboarding','家庭入口','家庭与设置','创建与加入路径明确，无无依据的审核时长承诺。'],
 ['family-create','创建家庭','家庭与设置','只要求建立家庭所需信息，先解释可见范围。'],
 ['family-join','加入家庭','家庭与设置','邀请码与申请核验码分开呈现。'],
 ['family-preview','核对受邀家庭','家庭与设置','先核对家庭，再填写与孩子的关系后提交申请。'],

 ['family-members','家庭与成员','家庭与设置','权限紧邻成员，邀请码只有一个有效期说明。'],
 ['family-requests','加入申请','家庭与设置','申请者、核验码和处理后果同时可见。'],

window.DESIGN_SCENES=sceneDefs;
const settings=()=>({tab:'settings',body:`${head('设置','按你们的节奏来')}<div class="card"><div class="between mb"><h2>在学科目</h2><button class="text-btn" data-demo="管理在学科目" type="button">管理</button></div><div class="subject-list"><button type="button" data-demo="语文">语文</button><button type="button" data-demo="数学">数学</button><button type="button" data-demo="英语">英语</button><button type="button" class="subject-add" data-demo="添加科目" aria-label="添加科目">${icon('plus','sm')}</button></div></div><section class="card"><h2>课外活动</h2>${row('围棋','每周日 14:00–16:00','board','activity-schedule')}${row('游泳','每周日 17:00–18:00','swim','activity-schedule')}${add('添加课外活动','activity-schedule')}</section><section class="card"><div class="card-top"><h2>每日任务</h2><span class="meta">每天重复</span></div>${row('阅读','每天 20 分钟','book','daily-form')}${row('围棋','每天 30 分钟','board','daily-form')}${add('添加每日任务','daily-form')}</section><section class="card"><h2>出行安排</h2><p class="page-desc">只显示在日程，不生成待办</p>${row('城市公园','11月8日 周日 · 10:00–12:00','map','travel-plan')}${add('添加出行安排','travel-plan')}</section><section class="card">${row('孩子档案','小禾 · 二年级','sprout','child')}${row('家庭与成员','小禾的家 · 3 位成员','family','family-members')}${row('提醒设置','微信提醒已开启','bell','notifications')}${row('数据管理','归档档案或清理资料','archive','delete-settings')}</section><p class="small center mt">知芽 · 一点一滴，慢慢生长</p>`});
const today=()=>({tab:'today',body:`${head('今日','11月6日 周五')}<section class="card"><button type="button" class="section-toggle" data-collapse><span class="section-name">复习</span><span class="flex"><span class="meta">待复习 2 项</span>${icon('down','sm')}</span></button><div class="collapsible mt8"><div class="flex mb">${tag('数学','math')}<span class="meta">建议完成 · 约 5 分钟</span></div><p class="task-title">用乘法口诀解决生活问题</p><p class="small mt8">来自 11月3日的学习记录</p><div class="task-actions">${btn('记录复习反馈','record-detail','secondary')}${btn('查看内容','review-inventory','outline')}</div><div class="task-divider"></div><div class="flex mb">${tag('语文','cn')}<span class="meta">有余力再做 · 约 5 分钟</span></div><p class="task-title">区分形近字「晴、睛」</p><div class="task-actions">${btn('记录复习反馈','record-detail','outline')}</div></div></section><section class="card"><button type="button" class="section-toggle" data-collapse><span class="section-name">每日任务</span><span class="flex"><span class="meta">完成 1 / 2</span>${icon('down','sm')}</span></button><div class="collapsible">${row('阅读','目标 20 分钟','book','activity',`<span class="check" aria-hidden="true"></span>`)}<div class="row"><span class="mark">${icon('board')}</span><span class="grow"><span class="title">围棋</span><span class="sub">已记录 30 分钟</span></span><span class="check checked">${icon('check')}</span></div></div></section><section class="card"><button type="button" class="section-toggle" data-collapse><span class="section-name">今日学习</span><span class="flex"><span class="meta">1 项</span>${icon('down','sm')}</span></button><div class="collapsible">${row('认识长度单位','家长已加入 · 待记录实际学习','book','records')}</div></section><button type="button" class="text-btn" ${nav('calendar')}>查看今天的全部安排 ${icon('arrow','sm')}</button>`});

function renderGallery(){document.body.className='gallery-view';document.getElementById('app').innerHTML=`<div class="review-shell"><header class="review-top"><div class="review-kicker">ZHIYA / DESIGN REVIEW / 2026.11.06</div><h1>让记录更轻，让操作更一致。</h1><p>全界面优化 · 第一轮待评审稿。${sceneDefs.length} 个界面与状态，覆盖现有 17 条路由。使用合成示例，所有操作只演示布局，不调用业务接口。</p></header><div class="review-layout"><aside class="review-sidebar">${['主页面','学习与安排','家庭与设置','关键状态'].map(g=>`<section class="review-group"><h2>${g}</h2><div class="review-scenes">${sceneDefs.filter(v=>v.group===g).map(s=>`<a href="?scene=${s.id}" data-review="${s.id}" class="${s.id===selectedReviewScene?'active':''}"><span class="scene-num">${s.number}</span>${s.title}</a>`).join('')}</div></section>`).join('')}</aside><div class="review-preview"><div class="review-viewport">${[[320,568],[390,844],[430,932]].map(([w,h])=>`<button type="button" data-width="${w}" data-height="${h}" class="${w===reviewWidth?'active':''}">${w} × ${h}</button>`).join('')}</div><div class="review-device"><iframe title="知芽交互评审稿" src="?scene=${selectedReviewScene}" width="${reviewWidth}" height="${reviewHeight}"></iframe></div></div><aside class="review-notes"><div class="review-kicker">REVIEW NOTES</div><h2 id="review-title"></h2><p id="review-note"></p><div class="review-note"><strong>01 · 按钮与层级</strong><p>暖白纸面、松绿操作色。主操作用实心，次操作用浅色或描边，添加入口统一透明底。</p></div><div class="review-note"><strong>02 · 文字与触控</strong><p>主要说明 14–16px；按钮触控区域至少 44px。卡片减少装饰，让内容先被看到。</p></div><div class="review-note"><strong>03 · 操作有结果</strong><p>报错靠近字段、修改有退出确认、草稿持续标记。表单和状态可在左侧单独评审。</p></div><a class="review-open" id="review-open" target="_blank" href="?scene=settings">单独打开当前效果图 ↗</a><p class="small">底部导航、折叠、时长选择和部分状态可点击。照片、日期、成员等只显示固定示例。</p></aside></div><footer class="review-foot">Spec: DESIGN-002 / Spec01 · Design: DREV-20261106-UI-CONSISTENCY-01 · PENDING REVIEW<br>本稿为 HTML 设计效果，尚未修改小程序；不是原生节点、真机、微信授权或发布验收证据。</footer></div>`;
 document.querySelectorAll('[data-review]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();setReviewScene(a.dataset.review);}));document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{reviewWidth=Number(b.dataset.width);reviewHeight=Number(b.dataset.height);const f=document.querySelector('iframe');f.width=reviewWidth;f.height=reviewHeight;document.querySelectorAll('[data-width]').forEach(v=>v.classList.toggle('active',v===b));}));setReviewScene(selectedReviewScene,false);window.addEventListener('message',e=>{if(e.source!==document.querySelector('iframe').contentWindow)return;if(e.data?.type==='design-scene')setReviewScene(e.data.scene,false);});window.DESIGN_READY=true;}
function setReviewScene(id,navigate=true){selectedReviewScene=id;const s=sceneDefs.find(v=>v.id===id);document.querySelectorAll('[data-review]').forEach(v=>v.classList.toggle('active',v.dataset.review===id));document.getElementById('review-title').textContent=s?.title||'交互演示';document.getElementById('review-note').textContent=s?.note||'仅演示流程，不提交任何数据。';document.getElementById('review-open').href='?scene='+id;if(navigate)document.querySelector('iframe').src='?scene='+id;}
if(currentScene)renderPhone(currentScene);else renderGallery();
</script>
