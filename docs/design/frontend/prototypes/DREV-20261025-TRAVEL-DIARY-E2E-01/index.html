<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行日记 · 全链路修复评审稿</title>
<style>
:root{--paper:#FAF7F0;--surface:#FFFDF8;--ink:#22261F;--muted:#59624F;--green:#1F5B45;--wash:#E4EDE6;--line:#E2DCCC;--sunken:#F3EFE4;--error:#A85742;--warning:#F7E8E2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input{font:inherit;color:inherit}button{border:0;background:none;min-width:44px;min-height:44px;padding:8px 12px;border-radius:999px;cursor:pointer}button:disabled{color:var(--muted);background:var(--sunken);cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}svg.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.brand{height:64px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;gap:8px}.brand svg{color:var(--green)}main{max-width:480px;margin:auto;padding:8px 16px 124px}.heading,.row{display:flex;align-items:center;gap:8px}.heading{justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.title{display:flex;align-items:center;gap:8px;font:22px/1.5 'Songti SC',serif;padding:0}.title svg{width:16px}.child{margin-left:auto;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:6px 12px 6px 6px}.avatar{display:grid;place-items:center;width:28px;height:28px;background:var(--wash);color:var(--green);border-radius:50%}.stats{display:flex;flex:1;min-width:0;flex-wrap:wrap;gap:2px 12px;color:var(--muted)}.more{width:44px;flex:none;padding:10px}.segments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:3px;background:#22261f0d;border-radius:999px;margin-top:12px}.segments button{min-width:0;padding:8px 2px;color:var(--muted)}.segments .on{color:var(--green);background:var(--surface);box-shadow:0 1px 3px #22261f12}.muted{color:var(--muted)}.link{color:var(--green);font-weight:500}.full{width:100%}.primary{width:100%;min-height:48px;background:var(--green);color:white;font-size:16px;font-weight:500;padding:10px 18px}.import{margin-top:20px;display:flex;justify-content:center;align-items:center;gap:8px}.empty{display:flex;min-height:220px;align-items:center;justify-content:center;flex-direction:column;color:var(--muted)}.empty svg{width:56px;height:56px;color:var(--green);margin:20px}.empty h2{font:22px/1.5 'Songti SC',serif;margin:0}.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 8px 24px;min-height:88px;z-index:1}.tabs button{flex:1;display:flex;flex-direction:column;gap:2px;align-items:center;padding:6px 0;color:var(--muted)}.tabs .active{color:var(--green)}.overlay{position:fixed;inset:0;background:#22261f66;display:flex;align-items:flex-end;z-index:10}.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden}.sheet-head{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);flex:none}.sheet-head h2{font-size:16px;line-height:1.6;margin:0;font-weight:600}.close{padding:0;width:48px;height:48px;display:grid;place-items:center;flex:none}.sheet-body{padding:12px 16px;overflow:auto;min-height:0;overscroll-behavior:contain}.sheet-body p{margin:0 0 12px}.sheet-footer{border-top:1px solid var(--line);padding:12px 16px 28px;flex:none}.check,.switch{display:flex;align-items:center;min-height:48px;gap:12px;padding:4px 0}.check input{width:24px;height:24px;accent-color:var(--green);flex:none}.switch{justify-content:space-between}.switch input{width:44px;height:28px;accent-color:var(--green)}.notice,.error{padding:12px;border-radius:12px;margin:8px 0 12px;background:var(--sunken)}.error{color:var(--error);background:var(--warning)}.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}.tools button{padding:6px 0}.draft{border-bottom:1px solid var(--line);padding:12px 0}.draft:last-child{border-bottom:0}.draft-top{display:flex;align-items:center;gap:10px}.select{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:50%;flex:none;color:var(--green);font-size:20px}.select[aria-pressed=true]{background:var(--wash);border-color:var(--green)}.picture{width:56px;height:68px;border-radius:8px;flex:none;overflow:hidden;background:var(--wash)}.picture svg,.hero svg{width:100%;height:100%}.draft-text{flex:1;min-width:0}.draft-text strong{font-weight:500;display:block;overflow-wrap:anywhere}.draft-actions{display:flex;gap:8px;margin-left:44px;flex-wrap:wrap}.draft-actions button{padding:6px 10px}.status{margin:6px 0 0!important;color:var(--muted)}.count{color:var(--muted);margin-bottom:8px}.field{display:block;margin-bottom:14px}.field span{display:block;margin-bottom:6px}.field input{width:100%;min-width:0;height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field-error{color:var(--error);font-size:14px;margin:4px 0 0!important}.hero{width:100%;height:160px;background:var(--wash);border-radius:12px;overflow:hidden;margin-bottom:12px}.hero.large{height:240px}.progress{height:8px;border-radius:8px;background:var(--sunken);margin:12px 0 16px;overflow:hidden}.progress span{display:block;width:67%;height:100%;background:var(--green)}.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}.visit{border-left:1px solid #C7D8CB;padding:16px 0 0 12px}.date{color:var(--green);margin-bottom:8px}.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}.card-title{display:flex;justify-content:space-between;gap:8px}.card-title strong{font-size:16px;overflow-wrap:anywhere;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.thumb{padding:0;border-radius:12px;text-align:left;min-width:0}.thumb .hero{height:100px;margin-bottom:4px}.thumb span{display:block;color:var(--muted)}.success{padding:8px 0;color:var(--green)}.keyboard{height:210px;position:fixed;bottom:0;left:0;right:0;background:#D6D8DD;border-top:1px solid #BABFC4;z-index:11;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:10px 5px 28px}.keyboard span{background:#fff;display:grid;place-items:center;border-radius:4px;box-shadow:0 1px 0 #999;font-size:16px}.with-keyboard{bottom:210px}.with-keyboard .sheet{max-height:calc(100dvh - 250px)}.with-keyboard .sheet-head{padding-top:0;padding-bottom:0}.with-keyboard .sheet-footer{padding-top:8px;padding-bottom:8px}.with-keyboard .sheet-body{padding-top:8px}.reviewbar{display:none}.small-note{color:var(--muted);margin-top:8px}@media(max-width:340px){main,.sheet-body{padding-left:12px;padding-right:12px}.brand{height:56px}.heading{margin-bottom:12px}.hero{height:120px}.hero.large{height:180px}.draft-top{gap:8px}.picture{width:48px}.draft-actions{margin-left:0}.sheet-footer{padding-bottom:20px}.with-keyboard .sheet-head h2{font-size:14px}}@media(min-width:700px){main{padding-top:40px}.overlay{left:calc(50% - 240px);right:calc(50% - 240px)}.reviewbar{display:flex;flex-wrap:wrap;gap:8px;max-width:900px;margin:20px auto;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.reviewbar a{color:var(--green);padding:8px}.reviewbar p{width:100%;margin:0;color:var(--muted)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style><div id="app"></div>
<script>
// Local design proposal: synthetic scenes, no child images, network or storage.
const states=['consent','uploading','review-missing','batch-date','edit','review-ready','upload-error','processing-error','conflict','confirm','saved','gallery-focused','readonly','edit-keyboard'];
let current=new URLSearchParams(location.search).get('state')||'review-missing',checked=true,focus=2;
const paths={sprout:'M12 21v-9M12 15C6 15 3 12 3 6c6 0 9 3 9 9Zm0-3c0-5 3-8 9-8 0 6-3 9-9 9',down:'m6 9 6 6 6-6',camera:'M4 6h4l2-3h4l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2ZM16 13a4 4 0 1 1-8 0 4 4 0 0 1 8 0',close:'m6 6 12 12M18 6 6 18',more:'M5 12h.01M12 12h.01M19 12h.01',calendar:'M4 5h16v16H4zM8 3v4m8-4v4M4 10h16',chart:'M5 20V10m7 10V4m7 16v-7M2 21h20',settings:'M3 6h18M3 12h18M3 18h18M8 4v4m8 2v4M8 16v4'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]}"></path></svg>`;
const scene=(i=0)=>`<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="合成测试场景${i+1}"><rect width="160" height="120" fill="${['#DBE8E4','#EEE4D3','#DDE3EA'][i%3]}"/><circle cx="122" cy="24" r="12" fill="#E7D9AE"/><path d="M0 120 50 28 115 120" fill="${['#759A8D','#969C77','#7892A1'][i%3]}"/><path d="m60 120 54-68 46 52v16" fill="#ADC3B5"/><path d="M0 105q70-20 160 0v15H0" fill="#ADC9CA"/><text x="12" y="21" font-size="14" fill="#334E42">${i+1}</text></svg>`;
const button=(label,go,primary=false,disabled=false)=>`<button class="${primary?'primary':'link full'}" data-go="${go}" ${disabled?'disabled':''}>${label}</button>`;
function shell(){const saved=['saved','gallery-focused'].includes(current);return `<div class="brand">${icon('sprout')}<span>知芽</span></div><main><div class="heading"><button class="title">旅行日记${icon('down')}</button><button class="child"><span class="avatar">六</span><span>六六</span>${icon('down')}</button></div><div class="row"><div class="stats"><span>${saved?'1':'0'} 个地点</span><span>${saved?'1':'0'} 座城市</span><span>${saved?'1':'0'} 个国家</span><span>${saved?'3':'0'} 张照片</span></div><button class="more" aria-label="更多足迹操作">${icon('more')}</button></div><div class="segments"><button class="on">时间线</button><button>轨迹回放</button><button>地图点亮</button></div>${saved?`<div class="success" role="status">已入档 · 3 张照片</div><article class="visit"><div class="date">2026 / 10 / 01</div><div class="card"><div class="card-title"><strong>合成测试地点</strong><span class="muted">3 张</span></div><div class="grid">${[0,1,2].map(i=>`<button class="thumb" data-photo="${i}" aria-label="查看第${i+1}张照片"><div class="hero">${scene(i)}</div><span>时刻未知</span></button>`).join('')}</div>${button('查看照片','gallery-focused')}</div></article>`:`${current==='readonly'?'<p class="muted">只读</p>':button('查看待整理照片','review-missing')}<div class="empty">${icon('camera')}<h2>还没有足迹</h2>${current!=='readonly'?button('手动记录','edit'):''}</div>`}${current!=='readonly'?`<button class="primary import" data-go="consent">${icon('camera')}导入照片</button>`:''}</main><nav class="tabs" aria-label="主导航">${['今日','日程','记录','报表','设置'].map((x,i)=>`<button class="${i===2?'active':''}">${icon(['sprout','calendar','camera','chart','settings'][i])}${x}</button>`).join('')}</nav>`}
function draft(i,ready=false,failed=false){return `<article class="draft"><div class="draft-top"><button class="select" aria-label="${checked?'取消选择':'选择'}第${i+1}张照片" aria-pressed="${checked}" data-select="true">${checked?'✓':'○'}</button><div class="picture">${scene(i)}</div><div class="draft-text"><strong>${ready?'2026-10-01':'待补日期'} · 时刻未知</strong><span class="muted">待补地点</span></div></div><p class="status">${failed?'处理失败':ready?'待核对':'待补拍摄日期'}</p><div class="draft-actions"><button class="link" data-go="edit">核对照片</button>${failed?'<button class="link" data-go="review-missing">重试处理</button>':''}</div></article>`}
function form(batch){return `${batch?'<p class="muted">仅补充选中且缺日期的照片。</p>':`<div class="hero">${scene(2)}</div>`}<label class="field"><span>拍摄日期${batch?'':'（入档必填）'}</span><input type="date" aria-label="拍摄日期"><span class="field-error">${batch?'2 张照片待补日期':'请选择实际拍摄日期'}</span></label>${batch?'':`<label class="field"><span>当地时刻（可选）</span><input type="time" aria-label="当地时刻"></label><label class="field"><span>地点（可留空）</span><input placeholder="地点名称，或在地图选点" value="${current==='edit-keyboard'?'合成测试地点':''}" aria-label="地点名称" maxlength="120"></label><div class="two"><label class="field"><span>城市</span><input placeholder="未知可留空" aria-label="城市"></label><label class="field"><span>国家</span><input placeholder="未知可留空" aria-label="国家"></label></div><div class="row"><button class="link">查找地点</button><button class="link">地图选点</button></div>`}`}
function sheet(){let title='',body='',footer='';const keyboard=current==='edit-keyboard';
if(current==='consent'){title='导入照片';body=`<p>读取照片时间和地点，由你核对后入档。</p><p class="muted">仅保存浏览版照片，不提供原图备份。</p><div class="notice">上传7天后，未确认照片自动清理。</div><label class="check"><input id="consent" type="checkbox"><span>同意处理所选照片的时间和位置信息</span></label><label class="switch"><span>AI 辅助补地点（可选）</span><input type="checkbox" aria-label="AI辅助补地点"></label><p class="muted">仅将缺地点的照片交由火山方舟识别，可在设置中关闭。</p>`;footer=button('同意并选择照片','uploading',true,true)+button('手动记录','edit');}
else if(current==='uploading'){title='正在导入照片';body='<p role="status">正在上传 · 2 / 3 张</p><div class="progress" role="progressbar" aria-valuenow="67" aria-valuemin="0" aria-valuemax="100"><span></span></div><p class="muted">上传后整理照片时间和地点。</p>';footer=button('正在上传 67%','review-missing',true,true);}
else if(['review-missing','review-ready','processing-error','conflict'].includes(current)){title='核对照片';const ready=current==='review-ready';body=`${current==='conflict'?'<div class="error" role="alert">照片已更新，已保留你的选择与填写内容。请刷新后继续核对。</div>':''}<div class="tools"><button class="link" data-select="true">${checked?'取消选择':'全选本页'}</button><button class="link" data-go="batch-date">批量修改</button></div><p class="count">已选 ${checked?'3':'0'} 张${ready?'':' · 2 张待补日期'}</p>${draft(0,ready)}${draft(1,ready)}${draft(2,true,current==='processing-error')}<p class="small-note">上传后7天内确认入档。</p>`;footer=button(current==='conflict'?'刷新并继续核对':ready?'确认选中的 3 张':'补拍摄日期',current==='conflict'?'review-missing':ready?'confirm':'batch-date',true,!checked);}
else if(['edit','edit-keyboard','batch-date'].includes(current)){const batch=current==='batch-date';title=batch?'补充拍摄日期':'修改时间与地点';body=form(batch);footer=button('保存修改','review-ready',true,true);}
else if(current==='upload-error'){title='导入照片';body='<div class="error" role="alert">第3张照片上传失败，请检查网络后重试。</div><p>已上传 2 / 3 张</p><p class="muted">已上传的照片保留，重试继续上传剩余照片。</p>';footer=button('重试未完成上传','uploading',true)+button('核对已上传照片','review-missing');}
else if(current==='confirm'){title='确认到访';body='<p>3 张照片 · 六六</p><div class="notice">3 张待补地点，入档后可在时间线查看。</div><p>确认孩子在这些日期实际到访过所选地点。</p>';footer=button('确认入档','saved',true)+button('返回核对','review-ready');}
else if(current==='gallery-focused'){title='照片与到访详情';body=`<div class="hero large">${scene(focus)}</div><div class="pager"><button class="link" data-delta="-1" ${focus===0?'disabled':''}>上一张</button><span>${focus+1} / 3</span><button class="link" data-delta="1" ${focus===2?'disabled':''}>下一张</button></div><p>2026-10-01 · 合成测试地点</p><p class="muted">家长填写 · 时刻未知</p>`;footer=button('修改日期和地点','edit',true);}
else return '';
return `<div class="overlay ${keyboard?'with-keyboard':''}"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><header class="sheet-head"><h2>${title}</h2><button class="close" aria-label="关闭面板" data-close="true" ${current==='uploading'?'disabled':''}>${icon('close')}</button></header><div class="sheet-body">${body}</div><footer class="sheet-footer">${footer}</footer></section></div>${keyboard?`<div class="keyboard" aria-label="键盘占位示意">${'QWERTYUIOPASDFGHJKLZXCVBNM'.split('').map(x=>'<span>'+x+'</span>').join('')}<span style="grid-column:span 4">空格</span></div>`:''}`;}
function render(){const panel=sheet();document.getElementById('app').innerHTML=`<div ${panel?'inert aria-hidden="true"':''}>${shell()}</div>${panel}<nav class="reviewbar"><p>设计评审稿：照片为合成插画；日期与地点仅是界面测试值，不代表真实出游信息。</p>${states.map(s=>`<a href="?state=${s}">${s}</a>`).join('')}</nav>`;if(current==='edit-keyboard')document.querySelector('.sheet-body').scrollTop=220;}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.close){if(['edit','edit-keyboard','batch-date'].includes(current)&&!confirm('放弃未保存的修改？'))return;current=['edit','edit-keyboard','batch-date'].includes(current)?'review-missing':current==='gallery-focused'?'saved':'empty';render()}else if(el.dataset.go){current=el.dataset.go;render()}else if(el.dataset.photo){focus=Number(el.dataset.photo);current='gallery-focused';render()}else if(el.dataset.delta){focus=Math.max(0,Math.min(2,focus+Number(el.dataset.delta)));render()}else if(el.dataset.select){checked=!checked;render()}});
document.addEventListener('change',e=>{if(e.target.id==='consent')document.querySelector('[data-go="uploading"]').disabled=!e.target.checked;if(e.target.type==='date')document.querySelector('.sheet-footer .primary').disabled=!e.target.value});
document.addEventListener('keydown',e=>{const dialog=document.querySelector('[role=dialog]');if(!dialog)return;if(e.key==='Escape'&&current!=='uploading'){current='review-missing';render()}if(e.key==='Tab'){const nodes=[...dialog.querySelectorAll('button:not([disabled]),input')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();window.designReady=true;
</script></html>
