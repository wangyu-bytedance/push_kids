<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公平复习 · 设计增量</title>
<style>
:root{--canvas:#faf7f0;--paper:#fffdf8;--ink:#263b30;--muted:#626b60;--green:#1f5b45;--line:#dddccf;--soft:#f3efe4}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:480px;margin:auto;padding:20px 20px 40px}header{font-size:14px;color:var(--muted);padding:0 0 20px;border-bottom:1px solid var(--line)}h1,h2{font-family:"Songti SC",serif;line-height:1.35;font-weight:600}h1{font-size:28px;margin:24px 0 8px}h2{font-size:22px;margin:8px 0 16px}p{margin:8px 0}.muted{color:var(--muted);font-size:14px}.hero{margin:20px 0 24px;padding:20px;background:var(--paper);border-radius:16px}.hero .lead{font-size:21px;line-height:1.6;margin:8px 0 16px}.num{font-size:28px;color:var(--green);font-variant-numeric:tabular-nums}.note{padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}.section{padding:16px 0;border-bottom:1px solid var(--line)}.section h2{font-size:19px;margin:0}.subject{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.title{font-size:19px;line-height:1.6;margin:8px 0 16px;overflow-wrap:anywhere}.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}.date{margin-top:16px;font-size:14px}.status{display:block;margin-top:4px;font-size:15px;color:var(--green)}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}.bottom p{flex:1}button{font:inherit;min-height:44px;min-width:64px;padding:8px 12px;background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--green)}button:focus-visible{outline:2px solid var(--green);outline-offset:3px}footer{font-size:14px;color:var(--muted);margin-top:28px}.sample{font-size:14px;color:var(--muted);margin-top:24px}.warn{color:#79541f}dialog{max-width:calc(100% - 32px);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}dialog::backdrop{background:#263b3040}@media(max-width:340px){main{padding:16px}.hero{padding:16px}.hero .lead{font-size:20px}}
.unit{display:inline-block;white-space:nowrap}
</style>
<main id="root"></main>
<dialog id="dialog"><p>调整日期沿用现有菜单，本设计不改变该操作。</p><button onclick="this.closest('dialog').close()">返回</button></dialog>
<script>
const state=new URLSearchParams(location.search).get('state')||'today';
const todayStates=['today','completed','limited','clear'];
const root=document.getElementById('root');
const footer='<footer>设计增量预览 · 合成示例<br>DREV-20261007-FAIR-REVIEW-01</footer>';
if(todayStates.includes(state)){
const done=state==='completed',limited=state==='limited';
root.innerHTML='<header>今日 · 复习说明区域</header><h1>每天一点，慢慢积累</h1><div class="hero"><span class="muted">今天的复习安排</span><p class="lead">'+(done?'今天的复习已经完成':limited?'今天安排 <span class="unit"><b class="num">2</b> 项，</span><span class="unit">约 <b class="num">5</b> 分钟</span>':'今天安排 <span class="unit"><b class="num">10</b> 项，</span><span class="unit">约 <b class="num">30</b> 分钟</span>')+'</p>'+(limited?'<p class="muted warn">本次预算未能覆盖所有待复习科目。</p>':'')+'</div><div class="section"><h2>复习安排</h2></div>'+(done?'<p class="muted">今天安排的内容已完成</p>':limited?'<div class="subject"><span>数学</span><span class="muted">1项 · 3分钟</span></div><div class="subject"><span>英语</span><span class="muted">1项 · 2分钟</span></div>':'<div class="subject"><span>语文</span><span class="muted">5项 · 15分钟</span></div><div class="subject"><span>数学</span><span class="muted">2项 · 6分钟</span></div><div class="subject"><span>英语</span><span class="muted">3项 · 9分钟</span></div>')+footer;
}else{
const rows={waiting:['等待安排','10月2日','0','尚未复习'],scheduled:['今日已安排','10月2日','0','尚未复习'],reviewed:['今日已完成','10月10日','1','10月7日'],deferred:['今天已跳过','10月2日','0','尚未复习'],future:['尚未到建议日','10月10日','1','10月7日'],reserved:['已手动安排到明天','10月8日','0','尚未复习'],ungenerated:['等待生成今日安排','10月2日','0','尚未复习'],legacy:['安排状态待更新','10月2日','0','尚未复习'],long:['等待安排','10月2日','0','尚未复习']};
const r=rows[state]||rows.waiting;const readonly=state==='long';const name=readonly?'阅读短文后识别自然段、区分句号与逗号，并用完整的话复述段落内容':'双引号引用他人话语的用法';
root.innerHTML='<header>报表 · 复习条目信息区域</header><h1>复习条目</h1><p class="muted">到了建议复习日后，还需按当天预算安排。</p>'+(readonly?'<p class="muted">当前为只读，可查看条目和安排。</p>':'')+'<div class="section"><span class="muted">语文</span><p class="title">'+name+'</p><div class="facts"><span>已复习 '+r[2]+' 次</span><span>上次复习：'+r[3]+'</span></div><div class="bottom"><div><p class="date">'+(state==='reserved'?'家长安排日期':state==='legacy'?'计划日期':'建议复习日')+'：'+r[1]+'</p><span class="status">'+r[0]+'</span></div>'+(!readonly?'<button onclick="document.getElementById(\'dialog\').showModal()" aria-label="调整复习安排">调整</button>':'')+'</div></div>'+footer;
}
</script>
</html>
