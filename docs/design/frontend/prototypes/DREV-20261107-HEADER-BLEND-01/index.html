<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知芽 · 统一页头</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e8ece8; color: #233329; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  .toolbar { max-width: 1020px; margin: auto; padding: 20px; }
  .toolbar h1 { margin: 0 0 6px; font-size: 22px; }
  .toolbar p { margin: 0 0 12px; }
  label { display: inline-flex; align-items: center; gap: 6px; margin: 0 12px 6px 0; }
  select { min-height: 44px; border: 1px solid #bcc7bd; border-radius: 8px; padding: 4px 8px; background: #fff; color: inherit; font: inherit; }
  #phones { display: flex; flex-wrap: wrap; justify-content: center; align-items: start; gap: 24px; padding: 0 20px 24px; }
  figure { width: min(100%, var(--device-width)); margin: 0; }
  figcaption { margin-bottom: 6px; color: #3e5143; }
  .phone { position: relative; display: flex; flex-direction: column; min-height: var(--device-height); background: var(--pk-page-background); color: var(--pk-ink); }
  .nav { height: 65px; display: grid; place-items: end center; padding: 0 16px 10px; background: var(--pk-nav-bg); color: var(--pk-nav-ink); font-size: 18px; font-weight: 650; }
  .page-header { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1fr); }
  .hero-picture, .heading { grid-area: 1 / 1; }
  .hero-picture { position: relative; align-self: start; pointer-events: none; }
  .hero-picture img { display: block; width: 100%; height: auto; }
  .hero-picture::after { content: ""; position: absolute; inset: 0; background:
    linear-gradient(90deg, var(--pk-canvas), transparent 4%, transparent 96%, var(--pk-canvas)),
    linear-gradient(180deg, var(--pk-canvas), transparent 12%, transparent 66%, var(--pk-canvas)); }
  .heading { z-index: 1; align-self: start; padding: 22px 18px 18px; min-width: 0; }
  .heading h2 { max-width: 70%; margin: 0; color: var(--pk-header-ink); font: 650 24px/1.3 var(--pk-serif); overflow-wrap: anywhere; }
  .heading p { max-width: 65%; margin: 6px 0 0; color: var(--pk-header-muted); font-size: 14px; overflow-wrap: anywhere; }
  .report-heading h2 { max-width: 100%; }
  .plain .heading h2, .plain .record-trigger, .readable .heading h2 { color: var(--pk-ink); }
  .plain .heading p, .readable .heading p { color: var(--pk-text-muted); }
  .readable .heading { grid-area: 1 / 1; }
  .readable .hero-picture { grid-area: 2 / 1; }
  .readable .heading h2, .readable .heading p { max-width: 100%; }
  .large-heading .heading h2 { font-size: 30px; }
  .inline-art { width: 88px; height: 60px; object-fit: contain; }
  .inline-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  button { color: inherit; font: inherit; cursor: pointer; }
  .child { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 7px; padding: 4px 12px 4px 5px; border: 1px solid var(--pk-line); border-radius: 999px; background: var(--pk-surface); color: var(--pk-ink); }
  .child i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--pk-primary-tint); color: var(--pk-primary-strong); font-size: 13px; font-style: normal; }
  .record-anchor { position: relative; width: max-content; max-width: 100%; }
  .record-trigger { display: block; min-height: 44px; border: 0; padding: 0; background: none; color: var(--pk-header-ink); font: 650 22px/1.3 var(--pk-serif); }
  .menu { position: absolute; top: calc(100% + 8px); left: 0; width: 200px; z-index: 2; padding: 4px; border: 1px solid var(--pk-line); border-radius: 12px; background: var(--pk-surface); }
  .menu button { display: block; min-height: 44px; width: 100%; border: 0; border-radius: 8px; text-align: left; padding: 0 12px; background: transparent; }
  .menu button:first-child { background: var(--pk-primary-tint); }
  .body { margin: 8px 18px 24px; padding: 19px; border-radius: var(--pk-r-xl); background: var(--pk-surface); }
  .body h3 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
  .body p { margin: 0; color: var(--pk-text-muted); font-size: 14px; }
  .tabs { display: flex; justify-content: space-evenly; margin-top: auto; padding: 14px 4px 24px; border-top: 1px solid var(--pk-line); background: var(--pk-surface); color: var(--pk-text-muted); font-size: 13px; }
  .tabs b { color: var(--pk-primary-strong); }
  .before:not(.plain) .hero-picture::after { display: none; }
  .before:not(.plain) .page-header { margin-inline: 4px; overflow: hidden; background: var(--pk-nav-bg); }
  .before:not(.plain) .report-heading { border: 1px solid var(--pk-line); border-radius: var(--pk-r-2xl); }
  .single { background: none; }
  .single .toolbar { display: none; }
  .single #phones { display: block; padding: 0; }
  .single figcaption { display: none; }
</style>
<div class="toolbar">
  <h1>知芽 · 统一页头</h1>
  <p>左边是今日，右边是报表。切换风格或页面，查看插画边缘和页面底色如何过渡。</p>
  <label>风格 <select id="theme" aria-label="风格"></select></label>
  <label>页面 <select id="scene" aria-label="页面"></select></label>
  <label>视口 <select id="size" aria-label="视口"></select></label>
</div>
<main id="phones"></main>
