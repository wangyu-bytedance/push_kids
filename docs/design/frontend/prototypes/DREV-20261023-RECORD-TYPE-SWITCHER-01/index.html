<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记录类型 · 标题切换</title>
<style>
:root{--paper:#FAF7F0;--surface:#FFFDF8;--ink:#22261F;--muted:#59624F;--green:#1F5B45;--wash:#E4EDE6;--line:#E2DCCC}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC",sans-serif}button{font:inherit;border:0;background:transparent;color:inherit;min-width:44px;min-height:44px;padding:8px 12px;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}[hidden]{display:none!important}header{height:88px;display:grid;place-items:center;font-weight:600}main{padding:0 16px 100px;max-width:480px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.title{font:22px "Songti SC",serif;padding-left:0;display:flex;align-items:center;gap:8px}.icon{width:20px;height:20px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2}.child{max-width:45%;overflow-wrap:anywhere;background:var(--wash);border-radius:16px;color:var(--green)}.card{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:16px 0}.muted{color:var(--muted)}.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:8px 0;min-width:0;border-bottom:2px solid var(--line)}.tabs button:first-child{border-color:var(--green);color:var(--green)}.primary{width:100%;background:var(--green);color:var(--surface);border-radius:12px}label{display:block;margin:16px 0}textarea{display:block;width:100%;min-height:120px;border:1px solid var(--line);padding:12px;border-radius:12px;background:var(--surface);font:16px/1.6 inherit;color:var(--ink)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);display:flex;border-top:1px solid var(--line);padding:8px 4px 20px}nav button{flex:1;padding:8px 0}nav button:nth-child(3){color:var(--green);font-weight:600}.overlay{position:fixed;inset:0;background:#22261F66;display:flex;align-items:end;z-index:100}.sheet{width:100%;padding:16px 16px 32px;border-radius:16px 16px 0 0;background:var(--surface)}.sheet-head{display:flex;align-items:center;justify-content:space-between;font-size:18px}.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;text-align:left;margin-top:8px;border-radius:12px}.choice span{flex:1}.choice[aria-pressed=true]{color:var(--green);background:var(--wash)}.check{visibility:hidden}.choice[aria-pressed=true] .check{visibility:visible}h2{font:20px "Songti SC",serif}
</style>
<header>知芽</header><main><div class="heading"><button class="title" id="title" aria-haspopup="dialog" aria-expanded="false"><span>学习记录</span><svg class="icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><button class="child" id="child">小满</button></div><section id="learning"><div class="muted">实际学习时间 · 2026-10-23 18:30</div><div class="card">添加学习照片</div><label>学习内容<textarea aria-label="学习内容" placeholder="写下今天学了什么…"></textarea></label><button class="primary">上传并整理</button></section><section id="travel" hidden><div class="muted">12 个地点 · 5 座城市 · 2 个国家</div><div class="tabs"><button>时间线</button><button>轨迹回放</button><button>地图点亮</button></div><div class="card"><span class="muted">2026-10-01</span><h2>故宫博物院</h2><p>北京 · 8 张照片</p><button>查看照片</button></div><button class="primary">导入照片</button></section></main><nav aria-label="底部导航"><button>今日</button><button>日程</button><button>记录</button><button>报表</button><button>设置</button></nav>
<div class="overlay" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-label="记录类型"><div class="sheet-head"><strong>记录类型</strong><button id="close" aria-label="关闭记录类型"><svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><button class="choice" data-type="learning" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v15M3 4l9 1 9-1v15l-9 1-9-1Z"/></svg><span>学习记录</span><svg class="icon check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button><button class="choice" data-type="travel" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z M9 3v15M15 6v15"/></svg><span>旅行日记</span><svg class="icon check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button></section></div>
<script>
const title=document.querySelector('#title'),overlay=document.querySelector('#overlay');let type='learning';function close(){overlay.hidden=true;title.setAttribute('aria-expanded','false');title.focus()}function open(){overlay.hidden=false;title.setAttribute('aria-expanded','true');document.querySelector('.choice[aria-pressed=true]').focus()}function select(value){type=value;document.querySelector('#learning').hidden=type!=='learning';document.querySelector('#travel').hidden=type!=='travel';title.querySelector('span').textContent=type==='learning'?'学习记录':'旅行日记';document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===type)));close()}title.onclick=open;document.querySelector('#close').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>select(b.dataset.type));document.onkeydown=e=>{if(e.key==='Escape')close()};const state=new URLSearchParams(location.search).get('state');if(state==='travel'||state==='picker')select('travel');if(state==='picker')open();if(state==='long')document.querySelector('#child').textContent='小满的长名字用于窄屏验证';
</script></html>
