<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复习条目 · 已替代</title><style>
*{box-sizing:border-box}body{margin:0;background:#F6F4EF;color:#242B28;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{width:100%;max-width:480px;padding:18px;margin:auto}h1{font-size:20px;margin:8px 0 20px}button{min-height:44px;font:inherit;border:0;background:none;color:inherit;padding:8px 12px}.segments{display:flex;background:white;border:1px solid #DEDCD4;border-radius:12px;padding:3px;gap:8px}.segments button{flex:1;border-radius:8px}.on{color:#1F5B45;background:#EAF0E8;font-weight:600}.tabs{display:flex;border-bottom:1px solid #DEDCD4;margin:10px 0 14px}.tabs button{flex:1;min-height:54px}.tabs .selected{border-bottom:3px solid #1F5B45;color:#1F5B45}.filter{background:white;border:1px solid #DEDCD4;border-radius:12px;padding:12px;margin-bottom:18px;min-height:48px}h2{font-size:19px;margin:18px 0 4px}.muted{color:#626F66}.card{margin-top:12px;background:white;border:1px solid #DEDCD4;border-radius:20px;padding:15px}.subject{font-size:16px;font-weight:600;margin-bottom:12px}.row{display:flex;align-items:flex-start;gap:8px}.text{flex:1;min-width:0;overflow-wrap:anywhere}.name{font-size:15px;font-weight:600}.meta{color:#626F66;margin-top:3px}.coverage{color:#626F66;margin-top:6px}.more{width:44px;flex:none;font-size:22px}.history{color:#1F5B45;padding-left:0}.menu{margin-left:auto;width:180px;border:1px solid #DEDCD4;border-radius:12px;box-shadow:0 8px 24px #242B2818;background:white}.menu button{display:block;width:100%;text-align:left}.danger{color:#A04335}.empty{padding:50px 0;text-align:center}.readonly{margin-top:12px}
</style><main><h1>复习条目</h1><div class="segments"><button id="normal">参与复习</button><button id="superseded">已替代</button></div><div class="tabs" id="tabs"></div><div class="filter" id="filter"></div><div id="content"></div></main><script>
document.body.style.width=(new URLSearchParams(location.search).get("width")||innerWidth)+"px";
const state=new URLSearchParams(location.search).get("state")||"superseded";const normal=state==="normal";
document.getElementById(normal?"normal":"superseded").className="on";
document.getElementById("tabs").innerHTML=(normal?["按时间","按科目","按次数"]:["按科目","按次数"]).map(x=>'<button class="'+(x===(normal?"按时间":"按次数")?"selected":"")+'">'+x+"</button>").join("");
document.getElementById("filter").textContent=normal?"明天                     后天":"次数                         全部次数⌄";
const long=state==="long";const name=long?"10以内加减法：在生活情境中理解加减含义并进行完整的口算练习":"10以内加减法";
const target=long?"20以内加减法：理解加减含义，在多种生活情境中进行口算与应用":"20以内加减法";
document.getElementById("content").innerHTML=state==="empty"?'<div class="empty muted">暂无已替代词条</div>':
'<h2>'+(normal?"预计 1 项":"1 个知识条目")+'</h2>'+(state==="viewer"?'<div class="readonly muted">当前为只读，可查看条目和安排。</div>':"")+
'<section class="card"><div class="subject">数学 <span class="muted">1项</span></div><div class="row"><div class="text"><div class="name">'+(normal?"20以内加减法":name)+'</div><div class="meta">已复习3次 · 上次10月18日</div><div class="coverage">'+(normal?"10月21日 · 等待复习":(state==="deleted"?"原承接词条已删除":"由「"+target+"」承接"))+'</div></div>'+(state==="viewer"?"":'<button class="more" aria-label="更多操作">···</button>')+'</div><button class="history">查看原学习记录</button>'+(state==="menu"?'<div class="menu"><button class="danger">删除条目</button></div>':"")+'</section>';
</script></html>
