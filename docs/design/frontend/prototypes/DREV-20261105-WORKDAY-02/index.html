<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国工作日日程 · DREV02</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FAF7F0;color:#22261F;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:14px;background:#F3EFE4;padding:9px 12px}button:focus-visible,input:focus-visible{outline:2px solid #1F5B45;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.page{padding:24px 16px}.eyebrow,.muted{color:#79826F;font-size:14px}h1{font-size:26px;margin:6px 0 22px}h2{font-size:18px;margin:0}.card{background:#FFFDF8;border:1px solid #EBE5D7;border-radius:22px;padding:18px;margin:16px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.label{font-size:14px;color:#464E43;margin-bottom:8px}.summary{font-size:14px;color:#1F5B45}.mask{position:fixed;inset:0;background:#22261F66;display:flex;align-items:flex-end}.sheet{width:100%;max-height:85vh;background:#FFFDF8;border-radius:26px 26px 0 0;display:flex;flex-direction:column}.handle{width:36px;height:4px;border-radius:9px;background:#DDD6C4;margin:10px auto}.head{padding:0 20px 12px}.close{min-width:44px;background:transparent;font-size:24px}.body{overflow:auto;padding:0 20px 16px;min-height:0}.foot{border-top:1px solid #EBE5D7;padding:12px 20px max(16px,env(safe-area-inset-bottom));background:#FFFDF8}.primary{width:100%;background:#1F5B45;color:white}.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;background:#22261F0D;padding:4px;border-radius:18px;margin:0 0 18px}.seg button{font-size:14px;padding:8px 2px;background:transparent;border-radius:14px;white-space:normal}.seg .selected{background:#FFF;color:#14402F;box-shadow:0 1px 4px #22261F0A;font-weight:600}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:12px}.week span{border-radius:12px;text-align:center;padding:9px 0;font-size:14px;background:#F3EFE4}.week .on{background:#E4EDE6;color:#14402F}.times{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.field{border:1px solid #DDD6C4;border-radius:14px;padding:10px 12px;min-height:48px;display:block;width:100%;background:white;font-size:16px}.notice{background:#F3EFE4;border-radius:14px;padding:12px;font-size:14px;color:#464E43;margin:12px 0}.warning{background:#F8EFDC;color:#825B20}.error{color:#A85742;font-size:14px;margin:0 0 10px}.toggle{width:100%;background:transparent;text-align:left;padding-left:0;color:#1F5B45}.perday{border-bottom:1px solid #EBE5D7;padding:10px 0;font-size:14px}.delete{width:100%;background:transparent;color:#A85742;margin-top:4px}.dialog{position:fixed;inset:0;background:#22261F66;display:grid;place-items:center;padding:24px}.dialog article{background:#FFFDF8;padding:24px;border-radius:22px;width:100%;max-width:360px}.dialog p{font-size:14px}.dialog .row button{flex:1}.dialog .primary{width:auto}.tag{font-size:14px;border-radius:10px;background:#E4EDE6;color:#14402F;padding:4px 8px}.empty{padding:24px 0;text-align:center;font-size:14px}.subtitle{font-size:14px;color:#79826F;margin-top:4px}.demo{color:#79826F;font-size:14px;margin-top:24px}.day{display:flex;gap:8px;margin-bottom:20px}.day span{flex:1;text-align:center;border-radius:15px;background:#F3EFE4;padding:10px 0;font-size:14px}.day .today{background:#1F5B45;color:white}
</style>
<div id="app"></div><script>
const states=['settings-weekly','settings-perday','settings-workday','settings-flexible','settings-readonly','settings-saving','settings-error','settings-convert','settings-coverage','calendar-create','calendar-edit','calendar-once','calendar-weekly','calendar-readonly','calendar-saving','calendar-error','calendar-items','calendar-holiday','calendar-adjusted','calendar-coverage'];
window.designStates=states;let state=states[2];let draft={name:'英语辅导课',start:'18:00',end:'19:00'};
const rule='<div class="notice">按中国大陆法定安排，放假跳过，调休照常</div>';
const warning='<div class="notice warning" role="status">工作日数据待更新：当前仅覆盖至 2026 年。超出范围的工作日安排暂不显示，也不会发送提醒。</div>';
function seg(labels,selected,host,disabled){return `<div class="seg" role="group" aria-label="${host==='settings'?'安排方式':'重复规则'}">${labels.map((x,i)=>`<button ${disabled?'disabled':''} class="${i===selected?'selected':''}" aria-pressed="${i===selected}" onclick="choose('${host}',${i})">${x}</button>`).join('')}</div>`}
function times(disabled){return `<div class="times"><label><div class="label">开始时间</div><input aria-label="开始时间" class="field" value="${draft.start}" ${disabled?'disabled':''} onchange="draft.start=this.value"></label><label><div class="label">结束时间</div><input aria-label="结束时间" class="field" value="${draft.end}" ${disabled?'disabled':''} onchange="draft.end=this.value"></label></div>`}
window.designShow=function(next){state=next;render()};
function choose(host,i){window.designShow(host==='settings'?['settings-weekly','settings-workday','settings-flexible'][i]:['calendar-once','calendar-weekly','calendar-create'][i])}
function render(){const settings=state.startsWith('settings'),readonly=state.includes('readonly'),saving=state.includes('saving'),error=state.includes('error'),coverage=state.includes('coverage');const list=!settings&&['calendar-items','calendar-holiday','calendar-adjusted','calendar-coverage'].includes(state);const flexible=state==='settings-flexible',weekly=state==='settings-weekly'||state==='settings-perday',perday=state==='settings-perday';
let page=settings?`<div class="eyebrow">设置 / 课外活动</div><h1>合成孩子的活动</h1><div class="card"><div class="row"><h2>英语辅导课</h2><button onclick="designShow('settings-workday')">安排</button></div><div class="summary">工作日 · 18:00–19:00</div></div>`:`<div class="eyebrow">合成孩子</div><h1>日程</h1><div class="day">${['一','二','三','四','五','六','日'].map((x,i)=>`<span class="${i===6?'today':''}">${x}</span>`).join('')}</div><div class="row"><h2>${state==='calendar-holiday'?'1月1日 周四 · 元旦':state==='calendar-adjusted'?'1月4日 周日 · 调休上班':'1月4日 周日'}</h2><button onclick="designShow('calendar-create')">加日程</button></div>${coverage?warning:''}${state==='calendar-holiday'||coverage?'<div class="empty">'+(coverage?'本日的工作日安排暂不可用':'本日暂无安排')+'</div>':'<div class="card"><div class="row"><h2>英语辅导课</h2><span class="tag">工作日</span></div><p class="summary">18:00–19:00 · 工作日</p><div class="muted">来自课外活动</div><button onclick="designShow(\'settings-workday\')">查看活动安排</button></div><div class="card"><h2>阅读时间</h2><p class="summary">19:30–20:00 · 工作日</p><button onclick="designShow(\'calendar-edit\')">编辑日程</button></div>'}`;
document.getElementById('app').innerHTML=`<main class="page" id="background">${page}<div class="demo">设计示例 · 合成数据</div></main>`;
if(list)return;
let selected=settings?(weekly?0:flexible?2:1):(state==='calendar-once'?0:state==='calendar-weekly'?1:2);let content=seg(settings?['指定星期','工作日','时间不固定']:['不重复','每周','工作日'],selected,settings?'settings':'calendar',readonly||saving);
if(settings){content+=coverage?warning:'';if(flexible)content+='<div class="notice"><strong>按实际参与情况记录</strong><div>不生成固定日程，参加后随时记录。</div></div>';else if(weekly)content+='<div class="label">每周哪几天</div><div class="week">'+['一','二','三','四','五','六','日'].map((x,i)=>`<span class="${i===1||i===3?'on':''}">${x}</span>`).join('')+'</div>'+(perday?'<div class="perday row"><span>周二</span><span>18:00–19:00</span></div><div class="perday row"><span>周四</span><span>18:30–19:30</span></div>':times(readonly||saving))+`<button class="toggle" ${readonly||saving?'disabled':''} onclick="designShow('${perday?'settings-weekly':'settings-perday'}')">${perday?'改为同一时间':'为不同星期设置时间'}</button><div class="notice">${perday?'周二 18:00–19:00；周四 18:30–19:30':'周二、周四 · 18:00–19:00'}</div>`;else content+=rule+times(readonly||saving)+'<div class="notice">工作日 · 18:00–19:00</div>';
}else content=`<label><div class="label">日程名称</div><input class="field" value="阅读时间" ${readonly||saving?'disabled':''}></label><div class="label" style="margin-top:16px">重复</div>`+content+(selected===2?rule:'')+'<div class="label">类型</div>'+seg(['辅导课','活动','其他'],2,'kind',true)+`<label><div class="label">${selected===2?'起始日期':'日期'}</div><input class="field" value="2026-01-01" ${readonly||saving?'disabled':''}></label>`+times(readonly||saving)+(coverage?warning:'');
document.getElementById('background').inert=true;document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="mask"><section class="sheet" role="dialog" aria-modal="true" aria-label="${settings?'活动安排':'日程编辑'}"><div class="handle"></div><div class="head row"><div><h2>${settings?'英语辅导课 · 安排':state==='calendar-edit'?'编辑日程':'加日程'}</h2>${state==='calendar-edit'?'<div class="subtitle">修改会作用于整个工作日系列</div>':''}${readonly?'<div class="subtitle">仅可查看，请联系家庭管理员修改</div>':''}</div><button class="close" aria-label="关闭" onclick="closeSheet()" ${saving?'disabled':''}>×</button></div><div class="body">${content}</div><div class="foot">${error?'<p class="error" role="alert">保存失败，请稍后重试。已保留你的输入。</p>':''}<button class="primary" ${readonly||saving?'disabled':''} onclick="designShow('${settings?'settings-saving':'calendar-saving'}')">${readonly?'仅可查看':saving?'保存中…':'保存'}</button>${settings||state==='calendar-edit'?`<button class="delete" ${readonly||saving?'disabled':''}>移除${settings?'安排':'日程'}</button>`:''}</div></section></div>`);
if(state==='settings-convert')document.getElementById('app').insertAdjacentHTML('beforeend','<div class="dialog" role="alertdialog" aria-modal="true" aria-label="替换安排规则"><article><h2>替换原来的安排？</h2><p>原安排中不同星期的时间将被替换为统一的工作日时间。保存后不能恢复原规则。</p><div class="row"><button id="cancel" onclick="designShow(\'settings-workday\')">取消</button><button class="primary" onclick="designShow(\'settings-saving\')">确认替换</button></div></article></div>');
}
function closeSheet(){document.querySelector('.mask')?.remove();document.querySelector('.dialog')?.remove();document.getElementById('background').inert=false;document.querySelector('main button')?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state.includes('saving'))closeSheet()});render();
</script></html>
