<!doctype html>
<html lang="zh-CN">

<style>
:root{--canvas:#FAF7F0;--surface:#FFFDF8;--primary:#1F5B45;--tint:#E4EDE6;--ink:#22261F;--secondary:#464E43;--line:#EBE5D7;--danger:#A85742;--info:#4A6A7C}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit;color:inherit}button{border:0;background:transparent;min-height:44px;padding:10px 12px;cursor:pointer;white-space:normal;overflow-wrap:anywhere}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--info);outline-offset:2px}button:disabled{cursor:default;color:var(--secondary);background:#F3EFE4}h1,h2,h3,p{margin:0}h1{font-size:22px;line-height:1.4}h2{font-size:19px;line-height:1.45}h3{font-size:17px;line-height:1.5}p{margin-top:8px}.secondary{color:var(--secondary)}.small{font-size:14px}.label{font-size:14px;color:var(--primary);font-weight:600}.app{height:100dvh;max-width:480px;margin:auto;display:flex;flex-direction:column}.brand{flex:none;height:56px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:19px;font-weight:600}.brand svg{width:24px;height:24px;stroke:var(--primary);fill:none;stroke-width:2}.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px}.child{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}.child strong{font-size:17px}.child button{padding-right:0;color:var(--primary)}.hero{background:var(--tint);border:1px solid #D2E1D6;border-radius:16px;padding:18px}.hero h1{margin-top:7px}.hero p{font-size:14px}.primary,.neutral,.outline{width:100%;border-radius:12px;min-height:48px;text-align:center;font-weight:500}.primary{background:var(--primary);color:#FFFDF8}.neutral{background:#F3EFE4}.outline{border:1px solid var(--line);background:var(--surface)}.hero .primary{margin-top:16px}.section-title{display:flex;align-items:center;justify-content:space-between;padding:22px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}.section-title h2{font-size:17px}.section-title span{font-size:14px;color:var(--secondary)}.card{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow-wrap:anywhere}.card+.card{margin-top:12px}.card h3{margin-top:5px}.card p{font-size:14px}.pill{display:inline-block;font-size:14px;line-height:1.5;padding:3px 8px;border-radius:8px;background:var(--tint);color:var(--primary)}.meta{font-size:14px;color:var(--secondary);margin-top:6px}.original{border-left:3px solid #C3D8CA;padding:0 0 0 10px;margin:12px 0;color:var(--secondary);font-size:14px}.row{display:flex;gap:8px;margin-top:14px}.row>*{flex:1;min-width:0}.text-action{color:var(--primary);width:100%;text-align:left;padding-left:0}.muted-block{padding:24px 0;color:var(--secondary);font-size:15px}.nav{flex:none;border-top:1px solid var(--line);background:var(--surface);display:flex;padding:0 8px 8px}.nav button{flex:1;min-width:0;min-height:56px;padding:10px 0;font-size:14px;color:var(--secondary)}.nav .active{color:var(--primary);font-weight:600}.overlay{position:fixed;inset:0;background:#22261F55;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:480px;max-height:85dvh;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:max(12px,env(safe-area-inset-bottom));box-shadow:0 -8px 32px #22261F10}.sheet-head{display:flex;align-items:flex-start;gap:8px;padding:18px 16px 10px;flex:none}.sheet-head .heading{flex:1;min-width:0}.sheet-head h2{margin-top:4px}.close{width:44px;height:44px;flex:none;display:flex;justify-content:center;align-items:center;padding:10px;margin-top:-8px;border-radius:12px}.close svg{width:20px;height:20px;stroke:var(--secondary);stroke-width:2}.sheet-body{padding:0 16px 16px;overflow-y:auto;min-height:0;overscroll-behavior:contain}.sheet-body h3{margin-top:10px}.section-label{font-weight:600;font-size:14px;margin-top:18px}.detail{margin-top:6px;padding:12px;background:#F3EFE4;border-radius:12px;font-size:14px}.sheet-actions{padding:12px 16px 0;flex:none;border-top:1px solid var(--line)}.sheet-actions .row{margin-top:8px}.sheet-actions .row button{background:transparent;color:var(--primary);font-weight:400;min-height:44px}.notice{border-left:3px solid #C3D8CA;padding-left:10px;font-size:14px;color:var(--secondary);margin-top:16px}.field{display:block;font-size:14px;font-weight:600;margin-top:14px}.field input,.field textarea{width:100%;margin-top:6px;border:1px solid #DDD6C4;border-radius:12px;padding:12px;line-height:1.6;background:white;font-weight:400;resize:vertical}.field textarea{min-height:118px}.error{color:var(--danger);font-size:14px;margin-top:8px}.empty{padding:14px 0}.danger{color:var(--danger)}.keyboard{height:210px;background:#DDDCD8;border-top:1px solid #BBB;display:flex;align-items:center;justify-content:center;color:var(--secondary);font-size:14px}.keyboard-mode .sheet{position:fixed;bottom:210px;max-height:calc(100dvh - 240px)}.keyboard-mode .keyboard{position:fixed;bottom:0;left:0;right:0}.status{padding:12px;background:var(--tint);border-radius:12px;font-size:14px}.form-note{font-size:14px;color:var(--secondary)}
.proposal-head{padding:16px 16px 12px}.proposal-head h2{margin:0;font-size:20px;line-height:1.45;overflow-wrap:anywhere}.proposal-head .meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:8px}.ai-mark{font-size:14px;color:var(--secondary)}.proposal-head .close{margin-top:0}.proposal-body>p:first-child{margin-top:0}.proposal-actions .row{gap:8px}.proposal-actions .row button{background:#F3EFE4;border:1px solid #DDD6C4;border-radius:12px;color:var(--primary);min-height:44px;padding:8px 12px}.proposal-actions .defer-action{display:block;width:100%;min-height:44px;margin:8px 0 0;padding:8px 12px;border-radius:12px;color:var(--secondary);text-align:center}.proposal-actions button,.proposal-head button{transition:background-color 150ms,box-shadow 150ms}.proposal-actions .primary:hover:not(:disabled){background:#184B38}.proposal-actions .row button:hover:not(:disabled),.proposal-actions .defer-action:hover:not(:disabled),.proposal-head .close:hover:not(:disabled){background:var(--tint)}.proposal-actions button:active:not(:disabled),.proposal-head button:active:not(:disabled){box-shadow:inset 0 0 0 2px #1F5B4540;background:var(--tint);color:var(--primary)}.proposal-actions button:disabled,.proposal-head button:disabled{background:#F3EFE4;color:var(--secondary);opacity:.65}.proposal-actions button[aria-busy=true]{opacity:1}.approval-error{margin:0 0 12px;padding:12px;border-radius:12px;background:#F7ECE6;color:var(--danger);font-size:14px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
</style>
<div class="app">
  <header class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-9 4-13 14-14 0 10-4 14-14 14Z M5 19 15 9"/></svg>知芽</header>
  <main class="scroll" id="main"></main>
  <nav class="nav" aria-label="主导航"><button class="active">今日</button><button>日程</button><button>记录</button><button>报表</button><button>设置</button></nav>
</div>
<div id="modal-root"></div>
<script>
'use strict';
const states=['review-due','review-early','review-empty','review-handled','review-inventory','review-viewer','review-source','review-long','review-error','suggestion','suggestion-edit','suggestion-deferred','suggestion-planned','suggestion-partial','suggestion-delete','suggestion-record','suggestion-no-history','suggestion-missing-grade','suggestion-loading','suggestion-error','suggestion-viewer','suggestion-stale','suggestion-long','suggestion-keyboard','suggestion-saved','suggestion-offline','suggestion-saving','suggestion-approve-error'];
let state=new URLSearchParams(location.search).get('state')||'suggestion';
let title='用凑十法试算 8 + 7';
const longTitle='用小物件把 8 + 7、9 + 6 和 7 + 5 拆成十与几，再说说为什么两种摆法的总数一样';
let taskContent='取 8 个和 7 个小物件。从 7 个里拿出 2 个与 8 个凑成 10，再数剩下的 5 个。换一种摆法试一试。';
let approvalTimer;
function escapeText(value){return value.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function button(text,action,cls){return '<button class="'+(cls||'neutral')+'" data-action="'+action+'">'+text+'</button>';}
function show(next){clearTimeout(approvalTimer);state=next;render();}
function reviewCard(early,long,viewer){return '<article class="card"><span class="pill">数学 · '+(early?'提前安排':'今天到期')+'</span><h3>'+(long?'20 以内加减法：结合购物与整理物品的生活情境，完整说出计算过程':'20 以内加减法')+'</h3><p>试着说说：8 + 7 可以怎样计算？</p>'+(early?'<div class="original">原计划 10 月 26 日复习<br>今天提前安排，约 3 分钟</div>':'<div class="meta">约 3 分钟</div>')+(viewer?'<p class="notice">当前为只读，可查看今日安排和原学习内容。</p>':'<div class="row">'+button('完成','review-handled','primary')+button('稍后','review-handled','outline')+'</div>')+'<button class="text-action" data-action="review-source">查看原学习内容</button></article>';}
function taskCard(partial,viewer){return '<article class="card"><span class="pill">'+(partial?'已记录部分 · 继续待学':'家长已确认 · 待学')+'</span><h3>'+title+'</h3><div class="meta">数学 · 预计 12 分钟</div><p>'+taskContent+'</p>'+(partial?'<div class="original">上次实际记录：用小物件摆出了 8 + 2 = 10。<br>这项内容继续保留，可以接着学。</div>':'<p class="secondary">有时间再学，明天也会保留。</p>')+(viewer?'<p class="notice">当前为只读，可查看家长已确认的待学内容。</p>':'<div class="row">'+button('记录实际学习','suggestion-record','primary')+'</div><div class="row">'+button('删除并换一项','suggestion-delete','text-action')+'</div>')+'</article>';}
function sheet(heading,body,actions,label,proposal){return '<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+heading+'"><header class="sheet-head'+(proposal?' proposal-head':'')+'"><div class="heading">'+(proposal?'<h2>'+heading+'</h2><div class="meta"><span>数学 · 预计 12 分钟</span><span class="ai-mark">AI 建议</span></div>':'<div class="label">'+(label||'AI 建议 · 待家长确认')+'</div><h2>'+heading+'</h2>')+'</div><button class="close" aria-label="关闭面板" data-action="suggestion-deferred"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div class="sheet-body'+(proposal?' proposal-body':'')+'">'+body+'</div><footer class="sheet-actions'+(proposal?' proposal-actions':'')+'">'+actions+'</footer></section></div>';}
function render(){
 document.body.classList.toggle('keyboard-mode',state==='suggestion-keyboard');
 const review=state.startsWith('review-');
 const empty=state==='review-empty';const handled=state==='review-handled';
 let html='<div class="child"><strong>小朋友 <span class="small secondary">一年级</span></strong><button aria-label="切换孩子">切换孩子</button></div>';
 html+='<section class="hero"><div class="label">今天的复习安排</div><h1>'+(handled?'今天的复习已经完成':empty?'今天没有安排复习':'今天安排 1 项，约 3 分钟')+'</h1><p class="secondary">'+(empty?'暂时没有适合复习的内容，有新学习可以随时记录。':handled?'有新的学习内容，也可以随手记下来。':'按自己的节奏，做一点就好。')+'</p>'+button('记录学习','suggestion-record','primary')+'</section>';
 let reviewHtml='<div class="section-title"><h2>复习安排</h2><span>'+(handled?'已完成':empty?'暂无安排':'1 项')+'</span></div>';
 if(state==='review-error'){reviewHtml+='<div class="card"><h3>复习安排暂时没加载出来</h3><p>请稍后重试，已有记录会保留。</p>'+button('重新加载','review-early','outline')+'</div>';}
 else if(empty||handled){reviewHtml+='<div class="muted-block">'+(handled?'今天安排的内容已完成':'今天没有合适的复习内容')+'</div>';}
 else{reviewHtml+=reviewCard(state!=='review-due',state==='review-long',state==='review-viewer');}
 if(!review){
 html+='<div class="section-title"><h2>今日学习</h2><span>'+(state==='suggestion-partial'?'已记录部分':state==='suggestion-saved'?'已记录':'')+'</span></div>';
 if(['suggestion-planned','suggestion-partial','suggestion-delete','suggestion-record','suggestion-keyboard','suggestion-viewer'].includes(state)){html+=taskCard(state==='suggestion-partial',state==='suggestion-viewer');}
 else if(state==='suggestion-saved'){html+='<article class="card"><span class="pill">已确认学习</span><h3>用小物件练习凑十法</h3><p>实际学过的内容已记下，复习日期会按规则安排。</p></article>';}
 else if(state==='suggestion-no-history'){html+='<div class="card"><h3>先记下已经学过的内容</h3><p>有了学习基础，就能据此提供延展建议。</p>'+button('记录已学内容','suggestion-record','outline')+'</div>';}
 else if(state==='suggestion-missing-grade'){html+='<div class="card"><h3>完善年级后再看建议</h3><p>建议会参考现有年级和已学内容。</p><button class="outline">查看孩子档案</button></div>';}
 else{html+='<article class="card"><div class="label">可以考虑</div><h3>沿着已学内容，再试一小步</h3><p>你可以先看看建议，再决定今天是否安排。</p>'+button(state==='suggestion-deferred'?'查看这项建议':'查看学习建议','suggestion','outline')+'</article>';}
 }
 document.getElementById('main').innerHTML=html+reviewHtml;
 let modal='';
 if(['suggestion','suggestion-long','suggestion-stale','suggestion-saving','suggestion-approve-error'].includes(state)){
  const long=state==='suggestion-long';
  const body=(state==='suggestion-stale'?'<div class="status" role="status">学习内容有更新，请重新生成后再确认。</div>':state==='suggestion-approve-error'?'<div class="approval-error" role="alert">暂时没能加入，请重试。建议内容已保留。</div>':'')+'<p>'+taskContent+(long?'也可以请孩子自己提出一个生活中的加法问题，用摆放、画图或说话的方式展示想法。过程以家长观察和孩子实际尝试为准。':'')+'</p><div class="section-label">为什么建议这项</div><div class="detail">已记录过“20 以内加法”。这次可以试着把其中的数凑成 10，换一种具体做法。</div><p class="notice">参考一年级和近期已确认内容生成，你可以编辑。实际学过后再记录。</p>';
  modal=sheet(long?longTitle:title,body,state==='suggestion-stale'?button('重新生成','suggestion-loading','primary'):button(state==='suggestion-saving'?'正在加入…':'确认加入今日学习','suggestion-planned','primary')+'<div class="row">'+button('编辑内容','suggestion-edit')+button('换一项','suggestion-loading')+'</div>'+button('今天先不学','suggestion-deferred','defer-action'),null,true);
 }
 if(state==='suggestion-edit'){
 modal=sheet('调整这项建议','<label class="field">学习内容<input id="edit-title" value="'+title+'" maxlength="120"></label><label class="field">可以怎么做<textarea id="edit-content" maxlength="1000">'+taskContent+'</textarea></label><p class="form-note">数学 · 预计 12 分钟。可以根据今天的时间自行调整。</p>',button('保存修改','save-edit','primary')+'<div class="row">'+button('返回建议','suggestion')+'</div>');
 }
 if(['suggestion-record','suggestion-keyboard'].includes(state)){
 modal=sheet('记下实际学过的内容','<p class="form-note">只记录这次真实学过的部分，可以直接填写文字。</p><label class="field">学习内容<textarea maxlength="2000">用小物件摆出了 8 + 2 = 10。</textarea></label><label class="field">实际学习时间<input value="今天 16:30" aria-label="实际学习时间"></label><p class="form-note">只学了部分，可以先记录，待学内容继续保留。</p>',button('完成并记录','suggestion-saved','primary')+'<div class="row">'+button('记录部分，继续待学','suggestion-partial')+'</div>','家长确认 · 实际学习');
 if(state==='suggestion-keyboard')modal+='<div class="keyboard" aria-hidden="true">键盘占位 · 仅用于设计空间检查</div>';
 }
 if(state==='suggestion-delete'){
 modal=sheet('删除这项待学内容？','<p>将移除这项待学内容，并尝试生成另一项建议，新建议需要你重新确认。</p><p class="secondary">已经确认的实际学习记录会保留。</p>',button('删除并换一项','suggestion-loading','primary')+'<div class="row">'+button('继续保留','suggestion-planned')+'</div>','待学内容');
 }
 if(state==='review-inventory'){
 modal=sheet('这项复习的安排','<h3>20 以内加减法</h3><div class="original">今天已提前安排<br>原计划 10 月 26 日复习</div><p>实际复习后，再根据反馈安排下次日期。</p>',button('返回今日复习','review-early','primary'),'复习条目 · 数学');
 }
 if(state==='review-source'){
 modal=sheet('原学习内容','<h3>20 以内加减法</h3><p>原记录：用小物件练习 20 以内的加法，说出每一步的计算过程。</p>',button('返回今日复习','review-early','primary'),'已确认学习记录 · 数学');
 }
 if(['suggestion-loading','suggestion-error','suggestion-offline'].includes(state)){
  const loading=state==='suggestion-loading';const offline=state==='suggestion-offline';
  modal=sheet(loading?'正在准备一项建议':offline?'暂时无法连接':'这次没有生成合适的建议','<p role="status">'+(loading?'会参考年级和已经确认的学习内容。可以先去做其他事情。':offline?'已有待学和学习记录会保留，恢复连接后可以重试。':'可以稍后重试，也可以直接记录实际学过的内容。')+'</p>',loading?button('先返回今日','suggestion-deferred','outline'):button('重试','suggestion-loading','primary')+'<div class="row">'+button('手动记录','suggestion-record')+'</div>');
 }
 document.getElementById('modal-root').innerHTML=modal;
 document.querySelector('.app').inert=Boolean(modal);
 if(state==='suggestion-saving'){document.querySelectorAll('.sheet button').forEach(function(el){el.disabled=true;});document.querySelector('.sheet-actions .primary').setAttribute('aria-busy','true');}
 document.querySelectorAll('[data-action]').forEach(function(el){el.addEventListener('click',function(){if(el.disabled)return;if(el.dataset.action==='save-edit'){title=escapeText(document.getElementById('edit-title').value.trim())||title;taskContent=escapeText(document.getElementById('edit-content').value.trim())||taskContent;show('suggestion');}else if(el.dataset.action==='suggestion-planned'&&['suggestion','suggestion-long','suggestion-approve-error'].includes(state)){show('suggestion-saving');approvalTimer=setTimeout(function(){show('suggestion-planned');},650);}else{show(el.dataset.action);}});});
 const dialog=document.querySelector('[role="dialog"]');if(dialog){dialog.tabIndex=-1;dialog.focus({preventScroll:true});}else{const entry=document.querySelector('[data-action="suggestion"]');if(entry)entry.focus({preventScroll:true});}
 document.body.dataset.state=state;document.body.dataset.ready='true';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state!=='suggestion-saving')show('suggestion-deferred');if(e.key==='Tab'){const dialog=document.querySelector('[role="dialog"]');if(!dialog)return;const els=Array.from(dialog.querySelectorAll('button,input,textarea')).filter(function(el){return !el.disabled;});if(!els.length){e.preventDefault();dialog.focus();}else if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}}});
window.designStates=states;window.designShow=show;render();
</script>
</html>
