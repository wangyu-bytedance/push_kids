<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日任务设计候选</title><style>
*{box-sizing:border-box}body{margin:0;background:#FAF7F0;color:#26382e;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{padding:20px 16px 92px;max-width:430px;margin:auto}h1,h2{font-family:"Songti SC",serif}h1{font-size:27px}h2{font-size:19px;margin:0}p{color:#777b70;line-height:1.6}.card{background:#FFFDF8;border-radius:16px;padding:16px;margin:16px 0;box-shadow:0 5px 24px #38452608}.head,.row{display:flex;align-items:center;gap:12px;min-height:48px}.head{justify-content:space-between}.row{padding:12px 0;border-top:1px solid #eee9de}.grow{flex:1;min-width:0}.sub{font-size:13px;color:#777b70;margin-top:5px}.button,button{min-height:44px;border:0;border-radius:8px;padding:10px 14px;background:#1F5B45;color:white;font:inherit}button.secondary{background:#F3EFE4;color:#1F5B45}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.badge{color:#1F5B45;font-size:13px}.field{margin:12px 0}label{display:block;margin-bottom:8px}input{font:inherit;padding:12px;width:100%;min-height:44px;border:1px solid #c7c9be;border-radius:8px;background:#FFFDF8}.error{color:#A85742;font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#FFFDF8;display:flex;align-items:center;justify-content:space-around;border-top:1px solid #eee9de}.done{color:#777b70}.hidden{display:none}.note{font-size:12px;color:#777b70}
</style><main id="screen"></main><nav><span>今日</span><span>日程</span><span>记录</span><span>报告</span><span>设置</span></nav><script>
const state=new URLSearchParams(location.search).get('state')||'today';
const section=(name,meta,body='')=>`<section class="card"><div class="head"><h2>${name}</h2><span class="sub">${meta} ${body?'⌃':'⌄'}</span></div>${body}</section>`;
const task=(name,time,done=false)=>`<div class="row"><div class="grow"><strong>${name}</strong><div class="sub">每天 ${time} 分钟${done?' · 已完成':''}</div></div><button class="${done?'secondary':''}">${done?'撤销':'完成'}</button></div>`;
let html='';
if(state==='settings'||state==='form-error'){
html='<h1>设置</h1><p>小朋友的学习与生活安排</p>'+section('每日任务','每天重复',`<p>选一个常用任务，或添加自定义任务。</p><div class="chips"><button class="secondary">阅读</button><button class="secondary">跳绳</button><button class="secondary">练字</button><button class="secondary">户外运动</button></div><div class="row"><div class="grow"><strong>阅读</strong><div class="sub">每天 20 分钟</div></div><button class="secondary">编辑</button></div><div class="row"><div class="grow"><strong>跳绳</strong><div class="sub">每天 10 分钟</div></div><button class="secondary">编辑</button></div><div class="field"><label for="name">任务名称</label><input id="name" value="阅读" maxlength="30"></div><div class="field"><label for="minutes">目标时长（分钟）</label><input id="minutes" inputmode="numeric" value="${state==='form-error'?'0':'20'}"></div>${state==='form-error'?'<p class="error">请输入 1～180 的整数分钟</p>':''}<button>保存任务</button> <button class="secondary">取消</button><p class="note">最多 20 项。目标时长不代表实际耗时。</p>`);
}else{
html='<h1>今日</h1><p>10 月 12 日 · 小朋友</p>'+section('复习安排',state==='today'?'还有 2 项':'今天已完成',state==='today'?'<div class="row"><div class="grow">语文 · 古诗复习</div><button class="secondary">去复习</button></div>':'');
html+=section('每日任务',state==='empty'?'还未设置':state==='completed'?'2 / 2 已完成':'1 / 2 已完成',state==='today'?task('阅读',20)+task('跳绳',10,true):'');
html+=section('今天记录的学习','今天 0 条')+section('课外活动','今天 0 项');
if(state==='empty')html+='<p class="note">手动展开每日任务后显示「还没有每日任务」与「去设置」入口。</p>';
}
document.getElementById('screen').innerHTML=html;
</script></html>
