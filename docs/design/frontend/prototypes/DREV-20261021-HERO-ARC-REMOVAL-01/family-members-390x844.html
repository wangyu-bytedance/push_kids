<style>

body { width: 390px; }

button, input, textarea { font: inherit; color: inherit; border: 0; background: none; outline: none; resize: none; }
/* 知芽 Push Kids · PKDS-2.0「纸 · 芽」design tokens
   设计语言：暖白纸面 + 松绿主色 + 嫩芽成长色；低对比大扩散阴影，像纸叠在纸上。
   单位约定：颜色语义 token 无单位；几何量 rpx（= px@375 × 2）；字号 px；发丝线固定 0.520px。 */

.page-root {
  /* ---------------- 纸面 ---------------- */
  --pk-canvas: #FAF7F0;
  --pk-canvas-deep: #F3EFE4;
  --pk-surface: #FFFDF8;
  --pk-surface-raised: #FFFFFF;
  --pk-surface-warm: #FDFBF5;
  --pk-surface-sunken: #F3EFE4;

  /* ---------------- 松绿（确定、可信） ---------------- */
  --pk-primary: #1F5B45;
  --pk-primary-strong: #14402F;
  --pk-primary-pressed: #103527;
  --pk-primary-mid: #38826A;
  --pk-primary-tint: #E4EDE6;
  --pk-primary-tint-2: #D2E1D6;
  --pk-primary-wash: #F0F5F0;
  --pk-primary-hairline: #C3D8CA;

  /* ---------------- 嫩芽（成长、可选项） ---------------- */
  --pk-sprout: #7FA65C;
  --pk-sprout-bg: #EDF2E2;
  --pk-sprout-line: #D8E4C4;

  /* ---------------- 墨色 ---------------- */
  --pk-ink: #22261F;
  --pk-ink-2: #464E43;
  --pk-ink-3: #79826F;
  --pk-ink-4: #A6AD9C;
  --pk-ink-inv: #FFFDF8;

  /* ---------------- 线 ---------------- */
  --pk-line: #EBE5D7;
  --pk-line-soft: #F1ECE0;
  --pk-line-strong: #DDD6C4;

  /* ---------------- 状态色 ---------------- */
  --pk-attention: #A9762A;
  --pk-attention-bg: #F8EFDC;
  --pk-attention-line: #E9D5AE;
  --pk-danger: #A85742;
  --pk-danger-bg: #F7E8E2;
  --pk-danger-line: #E9CDC2;
  --pk-success: #2F7A5B;
  --pk-success-bg: #E4EDE6;
  --pk-info: #4A6A7C;
  --pk-info-bg: #E7EEF2;
  --pk-info-line: #D4E1E8;

  /* 科目色，仅允许出现在 <=37.440px 的小面积上 */
  --pk-sub-chinese: #96671F;
  --pk-sub-chinese-bg: #F5EBDA;
  --pk-sub-math: #3F6379;
  --pk-sub-math-bg: #E6EDF3;
  --pk-sub-english: #565383;
  --pk-sub-english-bg: #EDECF5;
  --pk-sub-activity: #566E33;
  --pk-sub-activity-bg: #E9F1E0;
  --pk-sub-other: #96543F;
  --pk-sub-other-bg: #F3E9E9;

  /* 圆角：每个值只有一个职责，禁止中间值 */
  --pk-r-xs: 5.200px;
  --pk-r-sm: 8.320px;
  --pk-r-md: 12.480px;
  --pk-r-lg: 16.640px;
  --pk-r-xl: 20.800px;
  --pk-r-2xl: 27.040px;
  --pk-r-pill: 519.480px;

  /* 间距：4px 网格 */
  --pk-s1: 4.160px;
  --pk-s2: 8.320px;
  --pk-s3: 12.480px;
  --pk-s4: 16.640px;
  --pk-s5: 20.800px;
  --pk-s6: 24.960px;
  --pk-s7: 33.280px;
  --pk-s8: 41.600px;
  --pk-gutter: 18.720px;

  --pk-border: 0.520px solid rgba(34, 38, 31, .06);
  --pk-border-line: 0.520px solid var(--pk-line);
  --pk-border-soft: 0.520px solid var(--pk-line-soft);
  --pk-border-primary: 0.520px solid var(--pk-primary-hairline);

  /* 阴影：低对比、大扩散 */
  --pk-e0: 0 1.040px 2.080px rgba(34, 38, 31, .04);
  --pk-e1: 0 1.040px 2.080px rgba(34, 38, 31, .04);
  --pk-e2: 0 1.040px 2.080px rgba(34, 38, 31, .04), 0 10.400px 24.960px -14.560px rgba(34, 38, 31, .18);
  --pk-e3: 0 2.080px 6.240px rgba(34, 38, 31, .05), 0 22.880px 45.760px -20.800px rgba(34, 38, 31, .26);
  --pk-e-sheet: 0 -12.480px 41.600px -14.560px rgba(24, 28, 20, .44);
  --pk-e-fab: 0 10.400px 22.880px -8.320px rgba(31, 91, 69, .66);
  --pk-e-btn: 0 6.240px 16.640px -8.320px rgba(31, 91, 69, .7);

  --pk-touch-min: 45.760px;
  --pk-cta-h: 49.920px;
  --pk-btn-md: 45.760px;
  --pk-btn-sm: 37.440px;
  --pk-row-min: 58.240px;
  --pk-tabbar-h: 56.160px;

  /* 字体：标题用衬线体拉出「纸感」，数据用等宽数字 */
  --pk-serif: "Songti SC", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", serif;
  --pk-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  --pk-dur-fast: 140ms;
  --pk-dur-base: 240ms;
  --pk-dur-slow: 420ms;
  --pk-ease: cubic-bezier(.22, .75, .24, 1);
  --pk-ease-spring: cubic-bezier(.34, 1.42, .5, 1);
  --pk-ease-sheet: cubic-bezier(.32, .72, 0, 1);

  /* 兼容层：旧变量名指向 PKDS 值，存量页面无需改动即可继承新色板 */
  --canvas: var(--pk-canvas);
  --surface: var(--pk-surface);
  --surface-soft: var(--pk-primary-tint);
  --primary: var(--pk-primary);
  --primary-dark: var(--pk-primary-strong);
  --ink: var(--pk-ink);
  --muted: var(--pk-ink-3);
  --line: var(--pk-line);
  --warm: var(--pk-attention-bg);
  --warning: var(--pk-attention);
  --danger: var(--pk-danger);
}

/* 知芽 Push Kids · PKDS-2.0「纸 · 芽」原子组件层
   规则：几何量 rpx，字号 px，发丝线 0.520px；类名前缀 pk- 的是新原子，无前缀的是与既有页面共用的通用原子。
   视觉基调：纸面描边 + 极淡阴影；标题走衬线体，数字走等宽；主色只用于「确定/可信」，嫩芽色只用于「可选/成长」。 */

/* ---------------- 字阶 ---------------- */
.t-display { font-family: var(--pk-serif); font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: .2px; }
.t-h1 { font-family: var(--pk-serif); font-size: 23px; line-height: 1.3; font-weight: 600; letter-spacing: .2px; }
.t-h2 { font-family: var(--pk-serif); font-size: 18px; line-height: 1.4; font-weight: 600; }
.t-h3 { font-size: 17px; line-height: 1.45; font-weight: 600; }
.t-body { font-size: 16px; line-height: 1.6; }
.t-body-m { font-size: 16px; line-height: 1.6; font-weight: 500; }
.t-sub { font-size: 14px; line-height: 1.6; }
.t-sub-m { font-size: 14px; line-height: 1.6; font-weight: 500; }
.t-cap { font-size: 13px; line-height: 1.5; }
.t-micro { font-size: 11px; line-height: 1.35; font-weight: 500; letter-spacing: .6px; }
.c-ink { color: var(--pk-ink); }
.c-ink-2 { color: var(--pk-ink-2); }
.c-ink-3 { color: var(--pk-ink-3); }
.c-pri { color: var(--pk-primary); }
.c-att { color: var(--pk-attention); }
.c-dan { color: var(--pk-danger); }
.c-suc { color: var(--pk-success); }
.tnum { font-variant-numeric: tabular-nums; letter-spacing: .2px; }
.block { display: block; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------- 页内头部 ---------------- */
.pg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12.480px; padding: 14.560px 0 12.480px; }
.pg-kicker { display: block; font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 1.040px; color: var(--pk-primary-mid); }
.pg-title { display: block; margin-top: 4.160px; font-family: var(--pk-serif); font-size: 24px; line-height: 1.28; font-weight: 600; letter-spacing: .4px; color: var(--pk-ink); }
.pg-context { display: block; margin-top: 4.160px; font-size: 12px; line-height: 1.5; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }

.child-chip {
  flex: 0 0 auto; height: 37.440px; box-sizing: border-box;
  display: inline-flex; align-items: center; gap: 6.240px;
  margin: 2.080px 0 0; padding: 0 10.400px 0 4.160px; border-radius: var(--pk-r-pill);
  background: var(--pk-surface); border: var(--pk-border-line); box-shadow: var(--pk-e1);
  font-size: 13px; line-height: 1.4; font-weight: 500; color: var(--pk-ink-2);
  transition: transform var(--pk-dur-fast) var(--pk-ease);
}
.child-chip::after { border: 0; }
.child-chip:active { transform: scale(.97); }
.child-chip .ava {
  flex: none; width: 29.120px; height: 29.120px; border-radius: 50%;
  background: linear-gradient(150deg, var(--pk-sprout-bg), var(--pk-primary-tint));
  color: var(--pk-primary-strong); font-family: var(--pk-serif);
  font-size: 13px; font-weight: 600; line-height: 29.120px; text-align: center;
}

.chev { flex: none; width: 7.280px; height: 7.280px; border-right: 1.560px solid var(--pk-ink-4); border-bottom: 1.560px solid var(--pk-ink-4); transform: rotate(45deg) translateY(-2.080px); transition: transform var(--pk-dur-base) var(--pk-ease); }
.chev.up { transform: rotate(225deg) translate(-1.040px, -1.040px); }
.chev.right { transform: translateX(-1.560px) rotate(-45deg); }
.chev.left { transform: translateX(1.560px) rotate(135deg); }
.chev.pri { border-color: var(--pk-primary); }

/* ---------------- 卡片 ---------------- */
.pk-card { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); padding: var(--pk-s4); box-shadow: var(--pk-e0); box-sizing: border-box; }
.pk-card + .pk-card { margin-top: var(--pk-s3); }
.pk-card.flat { background: var(--pk-surface-warm); box-shadow: none; }
.pk-card.tight { padding: 13.520px 14.560px; }
.pk-card.plain { border-radius: var(--pk-r-lg); }

/* Hero：右上角一抹嫩芽光 */
.pk-hero {
  position: relative; overflow: hidden;
  border-radius: var(--pk-r-2xl); padding: 20.800px 18.720px 18.720px; box-sizing: border-box;
  background: radial-gradient(120% 130% at 100% 0%, rgba(127, 166, 92, .16), rgba(127, 166, 92, 0) 58%), linear-gradient(158deg, #FFFEFA 0%, #F7F4EA 100%);
  border: var(--pk-border); box-shadow: var(--pk-e2);
}

.pk-hero .hero-eyebrow { position: relative; display: block; font-size: 11px; line-height: 1.4; font-weight: 500; letter-spacing: 1.560px; color: var(--pk-primary-mid); }
.pk-hero .hero-line { position: relative; display: block; margin-top: 8.320px; font-family: var(--pk-serif); font-size: 19px; line-height: 1.4; font-weight: 600; color: var(--pk-ink); }
.pk-hero .hero-num { font-family: var(--pk-serif); font-size: 27px; font-weight: 600; letter-spacing: 0; color: var(--pk-primary); font-variant-numeric: tabular-nums; }
.pk-hero .hero-note { position: relative; display: block; margin-top: 7.280px; font-size: 13px; line-height: 1.65; color: var(--pk-ink-3); }
.pk-hero .btn-row, .pk-hero .btn { position: relative; }

/* 安排环：只描述今天的复习负荷组成（必做 / 有余力），不是完成率、不是评分 */
.ring { position: relative; flex: none; width: 95.680px; height: 95.680px; border-radius: 50%; }
.ring-plate { position: absolute; left: 15.600px; top: 15.600px; right: 15.600px; bottom: 15.600px; border-radius: 50%; background: rgba(255, 253, 248, .72); border: 0.520px solid rgba(34, 38, 31, .05); }
.ring-mid { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-mid .rv { font-family: var(--pk-serif); font-size: 24px; line-height: 1; font-weight: 600; color: var(--pk-ink); font-variant-numeric: tabular-nums; }
.ring-mid .rv .ru { font-family: var(--pk-sans); font-size: 12px; font-weight: 400; color: var(--pk-ink-4); }
.ring-mid .rl { margin-top: 3.120px; font-size: 10px; line-height: 1.2; letter-spacing: 0.520px; color: var(--pk-ink-3); }
.ring-legend { display: flex; align-items: center; gap: 10.400px; margin-top: 9.360px; }
.ring-legend .rg { display: inline-flex; align-items: center; gap: 4.160px; font-size: 11px; color: var(--pk-ink-3); }
.ring-legend .rg .rgd { width: 7.280px; height: 7.280px; border-radius: 50%; background: var(--pk-primary); }
.ring-legend .rg.opt .rgd { background: var(--pk-sprout); }

/* ---------------- 可折叠分区 ---------------- */
.sec { margin-top: var(--pk-s6); }
.sec-bar { min-height: 41.600px; display: flex; align-items: center; gap: 8.320px; padding: 0 2.080px; }
.sec-bar .s-t { flex: none; font-family: var(--pk-serif); font-size: 17px; line-height: 1.45; font-weight: 600; letter-spacing: .4px; color: var(--pk-ink); }
.sec-bar .s-m { flex: 1; min-width: 0; font-size: 12px; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }
.sec-rule { height: 0.520px; margin: 0 2.080px var(--pk-s3); background: linear-gradient(90deg, var(--pk-line-strong), rgba(235, 229, 215, 0)); }
.sec-body > view + view, .sec-body > .stack + .stack { margin-top: 10.400px; }

/* ---------------- 按钮 ---------------- */
.btn {
  box-sizing: border-box; width: 100%; height: var(--pk-cta-h); min-height: 45.760px;
  margin: 0; padding: 0 18.720px; border: 0; border-radius: var(--pk-r-pill);
  background: var(--pk-primary); color: var(--pk-ink-inv);
  font-size: 16px; line-height: 1.2; font-weight: 500; letter-spacing: .4px;
  display: flex; align-items: center; justify-content: center; gap: 7.280px;
  box-shadow: var(--pk-e-btn);
  transition: transform var(--pk-dur-fast) var(--pk-ease), background var(--pk-dur-fast) var(--pk-ease), box-shadow var(--pk-dur-fast) var(--pk-ease);
}
.btn::after { border: 0; }
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--pk-primary-tint); color: var(--pk-primary-strong); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--pk-primary); border: var(--pk-border-primary); box-shadow: none; }
.btn.neutral { background: var(--pk-surface); color: var(--pk-ink); border: 0.520px solid var(--pk-line-strong); box-shadow: var(--pk-e1); }
.btn.danger { background: var(--pk-danger-bg); color: var(--pk-danger); box-shadow: none; }
.btn.md { height: var(--pk-btn-md); min-height: var(--pk-btn-md); font-size: 15px; }
.btn.sm { height: var(--pk-btn-sm); min-height: var(--pk-btn-sm); width: auto; padding: 0 15.600px; font-size: 14px; box-shadow: none; }
.btn.auto { width: auto; }
.btn.is-disabled, .btn[disabled] { background: var(--pk-surface-sunken); color: var(--pk-ink-4); border-color: transparent; box-shadow: none; }
.btn.is-pressed { background: var(--pk-primary-pressed); }
.btn.secondary.is-pressed { background: var(--pk-primary-tint-2); }
/* 添加入口：虚线描边，不抢主 CTA 的注意力。设置、切换孩子弹层等多处共用。 */
.add-entry { display: flex; align-items: center; justify-content: center; gap: 6.240px; box-sizing: border-box; width: 100%; height: 45.760px; margin-top: 12.480px; border: 0.520px dashed var(--pk-primary-hairline); border-radius: var(--pk-r-md); color: var(--pk-primary); font-size: 15px; font-weight: 600; }

.btn-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10.400px; }
.btn-row.one { grid-template-columns: minmax(0, 1fr); }
.btn-row > .btn { width: 100%; min-width: 0; }

.link-btn { display: inline-flex; align-items: center; gap: 4.160px; min-height: 45.760px; margin: 0; padding: 0; border: 0; background: transparent; color: var(--pk-primary); font-size: 13px; font-weight: 500; }
.link-btn::after { border: 0; }
.link-btn.dan { color: var(--pk-danger); }
.icon-btn { flex: 0 0 37.440px; box-sizing: border-box; width: 37.440px; height: 37.440px; min-height: 37.440px; margin: 0; padding: 0; border: var(--pk-border-line); border-radius: 50%; background: var(--pk-surface); display: flex; align-items: center; justify-content: center; }
.icon-btn::after { border: 0; }

/* ---------------- 标签 / 状态 ---------------- */
.pill { display: inline-flex; align-items: center; gap: 4.160px; height: 22.880px; padding: 0 9.360px; border-radius: var(--pk-r-pill); background: var(--pk-primary-tint); color: var(--pk-primary-strong); font-size: 11px; font-weight: 500; letter-spacing: .2px; white-space: nowrap; }
.pill.att { background: var(--pk-attention-bg); color: var(--pk-attention); }
.pill.dan { background: var(--pk-danger-bg); color: var(--pk-danger); }
.pill.neutral { background: var(--pk-canvas-deep); color: var(--pk-ink-3); }
.pill.info { background: var(--pk-info-bg); color: var(--pk-info); }
.pill.suc { background: var(--pk-success-bg); color: var(--pk-success); }
.pill.solid { background: var(--pk-primary); color: var(--pk-ink-inv); }
.pill.line { background: transparent; border: 0.520px solid var(--pk-line-strong); color: var(--pk-ink-2); }
.pill .dot { width: 5.200px; height: 5.200px; border-radius: 50%; background: currentColor; }
.tagx { display: inline-flex; align-items: center; height: 20.800px; padding: 0 7.280px; border-radius: var(--pk-r-sm); background: var(--pk-canvas-deep); color: var(--pk-ink-3); font-size: 11px; }

.tag-sub { display: inline-flex; align-items: center; height: 22.880px; padding: 0 8.320px; border-radius: var(--pk-r-sm); font-size: 11px; font-weight: 600; }
.sub-mark { flex: 0 0 35.360px; width: 35.360px; height: 35.360px; border-radius: 11.440px; display: flex; align-items: center; justify-content: center; font-family: var(--pk-serif); font-size: 15px; font-weight: 600; }
.tag-sub.s-chinese, .sub-mark.s-chinese { background: var(--pk-sub-chinese-bg); color: var(--pk-sub-chinese); }
.tag-sub.s-math, .sub-mark.s-math { background: var(--pk-sub-math-bg); color: var(--pk-sub-math); }
.tag-sub.s-english, .sub-mark.s-english { background: var(--pk-sub-english-bg); color: var(--pk-sub-english); }
.tag-sub.s-activity, .sub-mark.s-activity { background: var(--pk-sub-activity-bg); color: var(--pk-sub-activity); }
.tag-sub.s-other, .sub-mark.s-other { background: var(--pk-sub-other-bg); color: var(--pk-sub-other); }

/* 识别置信度：三格竖条，只描述「要不要核对」，不是分数 */
.confidence { display: inline-flex; align-items: center; gap: 4.160px; font-size: 11px; font-weight: 500; }
.confidence .bars { display: inline-flex; align-items: flex-end; gap: 1.560px; }
.confidence .bars .b { width: 3.640px; height: 6.240px; border-radius: 1.040px; background: currentColor; opacity: .2; }
.confidence .bars .b:nth-child(2) { height: 9.360px; }
.confidence .bars .b:nth-child(3) { height: 12.480px; }
.confidence .bars .b.on { opacity: 1; }
.confidence.high { color: var(--pk-primary); }
.confidence.medium { color: var(--pk-attention); }
.confidence.low { color: var(--pk-danger); }

/* 草稿印章：AI 产出与正式记录的永久分界 */
.stamp { display: inline-flex; align-items: center; gap: 5.200px; height: 24.960px; padding: 0 9.360px; border: 1.040px dashed rgba(56, 130, 106, .55); border-radius: var(--pk-r-sm); background: rgba(228, 237, 230, .6); color: var(--pk-primary-strong); font-size: 12px; font-weight: 600; letter-spacing: 0.520px; transform: rotate(-1.4deg); }
.stamp.manual { border-color: var(--pk-line-strong); background: var(--pk-canvas-deep); color: var(--pk-ink-3); }

/* ---------------- 提示条 ---------------- */
.pk-notice { display: flex; align-items: center; gap: 9.360px; min-height: 47.840px; padding: 11.440px 13.520px; box-sizing: border-box; border-radius: var(--pk-r-lg); background: var(--pk-attention-bg); border: 0.520px solid var(--pk-attention-line); color: var(--pk-ink-2); font-size: 13px; line-height: 1.6; }
.pk-notice .n-txt { flex: 1; min-width: 0; }
.pk-notice .n-t { display: block; font-size: 14px; line-height: 1.5; font-weight: 500; color: var(--pk-ink); }
.pk-notice .n-c { display: block; margin-top: 2.080px; font-size: 12px; line-height: 1.6; color: var(--pk-ink-3); }
.pk-notice.err { background: var(--pk-danger-bg); border-color: var(--pk-danger-line); }
.pk-notice.info { background: var(--pk-info-bg); border-color: var(--pk-info-line); }
.pk-notice.ai { background: linear-gradient(120deg, rgba(127, 166, 92, .16), rgba(56, 130, 106, .1)); border: 0.520px dashed rgba(56, 130, 106, .4); }

/* ---------------- 分段控件 / chips ---------------- */

.tl-card { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-lg); padding: 12.480px 13.520px; box-shadow: var(--pk-e0); box-sizing: border-box; }

.pk-fab { position: fixed; right: var(--pk-gutter); bottom: calc(var(--pk-s4) + var(--pk-tabbar-h) + 0px); z-index: 12; height: 49.920px; padding: 0 18.720px 0 15.600px; margin: 0; border: 0; border-radius: var(--pk-r-pill); background: linear-gradient(150deg, var(--pk-primary-mid), var(--pk-primary-strong)); color: var(--pk-ink-inv); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 7.280px; box-shadow: var(--pk-e-fab); }
.pk-fab::after { border: 0; }

/* ---------------- 数据展示 ---------------- */
/* 指标是 2×2 的只读小卡：每格自带描边与间距，小屏也不挤。 */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--pk-s2); }
.metric { position: relative; overflow: hidden; box-sizing: border-box; min-width: 0; min-height: 87.360px; padding: 12.480px 12.480px 10.400px; display: flex; flex-direction: column; justify-content: center; background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); box-shadow: var(--pk-e0); }

.bar-row { position: relative; display: flex; align-items: center; gap: 10.400px; min-height: 49.920px; }

.bar-track { flex: 1; min-width: 0; height: 8.320px; border-radius: var(--pk-r-pill); background: rgba(34, 38, 31, .06); overflow: hidden; }
.bar-fill { height: 100%; border-radius: var(--pk-r-pill); background: linear-gradient(90deg, var(--pk-primary-mid), var(--pk-primary)); transition: width var(--pk-dur-slow) var(--pk-ease); }

.udot { width: 35.360px; height: 35.360px; margin: 0 auto; border-radius: 10.400px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }

.hbox { width: 100%; max-width: 35.360px; height: 35.360px; margin: 0 auto; border-radius: 9.360px; }

.hbox.h1 { background: #E2EBE1; }

.cell-label { display: block; margin-top: 4.160px; text-align: center; font-size: 10px; line-height: 1.2; color: var(--pk-ink-4); font-variant-numeric: tabular-nums; }

.pager { display: flex; align-items: center; justify-content: space-between; min-height: 41.600px; }

.pdots { display: flex; align-items: center; justify-content: center; gap: 4.160px; margin-top: 8.320px; }

.upload-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10.400px; }
.up-tile { box-sizing: border-box; height: 112.320px; margin: 0; padding: 0; border-radius: var(--pk-r-xl); border: 1.560px dashed rgba(56, 130, 106, .36); background: linear-gradient(160deg, rgba(228, 237, 230, .7), rgba(255, 253, 248, .7)); color: var(--pk-primary-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8.320px; font-size: 14px; line-height: 1.3; font-weight: 500; transition: transform var(--pk-dur-base) var(--pk-ease), background var(--pk-dur-base) var(--pk-ease); }

/* ---------------- 浮层 ---------------- */
.pk-mask { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 20; background: rgba(24, 28, 20, .42); }
.pk-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 85vh; box-sizing: border-box; background: var(--pk-canvas); border-radius: var(--pk-r-2xl) var(--pk-r-2xl) 0 0; box-shadow: var(--pk-e-sheet); padding: 8.320px var(--pk-gutter) calc(14.560px + var(--pk-tabbar-h) + 0px); display: flex; flex-direction: column; }

.asheet .grp .it { min-height: 58.240px; display: flex; align-items: center; justify-content: center; gap: 8.320px; font-size: 17px; font-weight: 400; color: var(--pk-ink); }

/* ---------------- 空态 / 骨架 ---------------- */

.sk { border-radius: var(--pk-r-xl); background: linear-gradient(100deg, rgba(34, 38, 31, .055) 30%, rgba(34, 38, 31, .02) 50%, rgba(34, 38, 31, .055) 70%); background-size: 300% 100%; animation: pk-sk 1.5s linear infinite; }
.sk.hero-sk { height: 137.280px; border-radius: var(--pk-r-2xl); }

/* ---------------- 布局工具 ---------------- */
.flex { display: flex; align-items: center; gap: 8.320px; }

/* 知芽 Push Kids · PKDS-2.0 线性图标
   由 tools/gen_icon_styles.py 生成，请勿手工编辑。
   用法：<view class="ico ico-camera"></view>；换色加后缀类，例如 ico-camera-pri。
   尺寸：默认 21.840px（21px），.ico.lg 24.960px，.ico.sm 16.640px，.ico.xs 14.560px。 */

.ico { display: block; flex: none; width: 21.840px; height: 21.840px; background-repeat: no-repeat; background-position: center; background-size: 100% 100%; }
.ico.lg { width: 24.960px; height: 24.960px; }
.ico.xl { width: 29.120px; height: 29.120px; }

/* 知芽 Push Kids · PKDS-2.0「纸 · 芽」design tokens
   设计语言：暖白纸面 + 松绿主色 + 嫩芽成长色；低对比大扩散阴影，像纸叠在纸上。
   单位约定：颜色语义 token 无单位；几何量 rpx（= px@375 × 2）；字号 px；发丝线固定 0.520px。 */

.page-root {
  /* ---------------- 纸面 ---------------- */
  --pk-canvas: #FAF7F0;
  --pk-canvas-deep: #F3EFE4;
  --pk-surface: #FFFDF8;
  --pk-surface-raised: #FFFFFF;
  --pk-surface-warm: #FDFBF5;
  --pk-surface-sunken: #F3EFE4;

  /* ---------------- 松绿（确定、可信） ---------------- */
  --pk-primary: #1F5B45;
  --pk-primary-strong: #14402F;
  --pk-primary-pressed: #103527;
  --pk-primary-mid: #38826A;
  --pk-primary-tint: #E4EDE6;
  --pk-primary-tint-2: #D2E1D6;
  --pk-primary-wash: #F0F5F0;
  --pk-primary-hairline: #C3D8CA;

  /* ---------------- 嫩芽（成长、可选项） ---------------- */
  --pk-sprout: #7FA65C;
  --pk-sprout-bg: #EDF2E2;
  --pk-sprout-line: #D8E4C4;

  /* ---------------- 墨色 ---------------- */
  --pk-ink: #22261F;
  --pk-ink-2: #464E43;
  --pk-ink-3: #79826F;
  --pk-ink-4: #A6AD9C;
  --pk-ink-inv: #FFFDF8;

  /* ---------------- 线 ---------------- */
  --pk-line: #EBE5D7;
  --pk-line-soft: #F1ECE0;
  --pk-line-strong: #DDD6C4;

  /* ---------------- 状态色 ---------------- */
  --pk-attention: #A9762A;
  --pk-attention-bg: #F8EFDC;
  --pk-attention-line: #E9D5AE;
  --pk-danger: #A85742;
  --pk-danger-bg: #F7E8E2;
  --pk-danger-line: #E9CDC2;
  --pk-success: #2F7A5B;
  --pk-success-bg: #E4EDE6;
  --pk-info: #4A6A7C;
  --pk-info-bg: #E7EEF2;
  --pk-info-line: #D4E1E8;

  /* 科目色，仅允许出现在 <=37.440px 的小面积上 */
  --pk-sub-chinese: #96671F;
  --pk-sub-chinese-bg: #F5EBDA;
  --pk-sub-math: #3F6379;
  --pk-sub-math-bg: #E6EDF3;
  --pk-sub-english: #565383;
  --pk-sub-english-bg: #EDECF5;
  --pk-sub-activity: #566E33;
  --pk-sub-activity-bg: #E9F1E0;
  --pk-sub-other: #96543F;
  --pk-sub-other-bg: #F3E9E9;

  /* 圆角：每个值只有一个职责，禁止中间值 */
  --pk-r-xs: 5.200px;
  --pk-r-sm: 8.320px;
  --pk-r-md: 12.480px;
  --pk-r-lg: 16.640px;
  --pk-r-xl: 20.800px;
  --pk-r-2xl: 27.040px;
  --pk-r-pill: 519.480px;

  /* 间距：4px 网格 */
  --pk-s1: 4.160px;
  --pk-s2: 8.320px;
  --pk-s3: 12.480px;
  --pk-s4: 16.640px;
  --pk-s5: 20.800px;
  --pk-s6: 24.960px;
  --pk-s7: 33.280px;
  --pk-s8: 41.600px;
  --pk-gutter: 18.720px;

  --pk-border: 0.520px solid rgba(34, 38, 31, .06);
  --pk-border-line: 0.520px solid var(--pk-line);
  --pk-border-soft: 0.520px solid var(--pk-line-soft);
  --pk-border-primary: 0.520px solid var(--pk-primary-hairline);

  /* 阴影：低对比、大扩散 */
  --pk-e0: 0 1.040px 2.080px rgba(34, 38, 31, .04);
  --pk-e1: 0 1.040px 2.080px rgba(34, 38, 31, .04);
  --pk-e2: 0 1.040px 2.080px rgba(34, 38, 31, .04), 0 10.400px 24.960px -14.560px rgba(34, 38, 31, .18);
  --pk-e3: 0 2.080px 6.240px rgba(34, 38, 31, .05), 0 22.880px 45.760px -20.800px rgba(34, 38, 31, .26);
  --pk-e-sheet: 0 -12.480px 41.600px -14.560px rgba(24, 28, 20, .44);
  --pk-e-fab: 0 10.400px 22.880px -8.320px rgba(31, 91, 69, .66);
  --pk-e-btn: 0 6.240px 16.640px -8.320px rgba(31, 91, 69, .7);

  --pk-touch-min: 45.760px;
  --pk-cta-h: 49.920px;
  --pk-btn-md: 45.760px;
  --pk-btn-sm: 37.440px;
  --pk-row-min: 58.240px;
  --pk-tabbar-h: 56.160px;

  /* 字体：标题用衬线体拉出「纸感」，数据用等宽数字 */
  --pk-serif: "Songti SC", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", serif;
  --pk-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  --pk-dur-fast: 140ms;
  --pk-dur-base: 240ms;
  --pk-dur-slow: 420ms;
  --pk-ease: cubic-bezier(.22, .75, .24, 1);
  --pk-ease-spring: cubic-bezier(.34, 1.42, .5, 1);
  --pk-ease-sheet: cubic-bezier(.32, .72, 0, 1);

  /* 兼容层：旧变量名指向 PKDS 值，存量页面无需改动即可继承新色板 */
  --canvas: var(--pk-canvas);
  --surface: var(--pk-surface);
  --surface-soft: var(--pk-primary-tint);
  --primary: var(--pk-primary);
  --primary-dark: var(--pk-primary-strong);
  --ink: var(--pk-ink);
  --muted: var(--pk-ink-3);
  --line: var(--pk-line);
  --warm: var(--pk-attention-bg);
  --warning: var(--pk-attention);
  --danger: var(--pk-danger);
}

/* 知芽 Push Kids · PKDS-2.0「纸 · 芽」原子组件层
   规则：几何量 rpx，字号 px，发丝线 0.520px；类名前缀 pk- 的是新原子，无前缀的是与既有页面共用的通用原子。
   视觉基调：纸面描边 + 极淡阴影；标题走衬线体，数字走等宽；主色只用于「确定/可信」，嫩芽色只用于「可选/成长」。 */

/* ---------------- 字阶 ---------------- */
.t-display { font-family: var(--pk-serif); font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: .2px; }
.t-h1 { font-family: var(--pk-serif); font-size: 23px; line-height: 1.3; font-weight: 600; letter-spacing: .2px; }
.t-h2 { font-family: var(--pk-serif); font-size: 18px; line-height: 1.4; font-weight: 600; }
.t-h3 { font-size: 17px; line-height: 1.45; font-weight: 600; }
.t-body { font-size: 16px; line-height: 1.6; }
.t-body-m { font-size: 16px; line-height: 1.6; font-weight: 500; }
.t-sub { font-size: 14px; line-height: 1.6; }
.t-sub-m { font-size: 14px; line-height: 1.6; font-weight: 500; }
.t-cap { font-size: 13px; line-height: 1.5; }
.t-micro { font-size: 11px; line-height: 1.35; font-weight: 500; letter-spacing: .6px; }
.c-ink { color: var(--pk-ink); }
.c-ink-2 { color: var(--pk-ink-2); }
.c-ink-3 { color: var(--pk-ink-3); }
.c-pri { color: var(--pk-primary); }
.c-att { color: var(--pk-attention); }
.c-dan { color: var(--pk-danger); }
.c-suc { color: var(--pk-success); }
.tnum { font-variant-numeric: tabular-nums; letter-spacing: .2px; }
.block { display: block; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------- 页内头部 ---------------- */
.pg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12.480px; padding: 14.560px 0 12.480px; }
.pg-kicker { display: block; font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 1.040px; color: var(--pk-primary-mid); }
.pg-title { display: block; margin-top: 4.160px; font-family: var(--pk-serif); font-size: 24px; line-height: 1.28; font-weight: 600; letter-spacing: .4px; color: var(--pk-ink); }
.pg-context { display: block; margin-top: 4.160px; font-size: 12px; line-height: 1.5; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }

.child-chip {
  flex: 0 0 auto; height: 37.440px; box-sizing: border-box;
  display: inline-flex; align-items: center; gap: 6.240px;
  margin: 2.080px 0 0; padding: 0 10.400px 0 4.160px; border-radius: var(--pk-r-pill);
  background: var(--pk-surface); border: var(--pk-border-line); box-shadow: var(--pk-e1);
  font-size: 13px; line-height: 1.4; font-weight: 500; color: var(--pk-ink-2);
  transition: transform var(--pk-dur-fast) var(--pk-ease);
}
.child-chip::after { border: 0; }
.child-chip:active { transform: scale(.97); }
.child-chip .ava {
  flex: none; width: 29.120px; height: 29.120px; border-radius: 50%;
  background: linear-gradient(150deg, var(--pk-sprout-bg), var(--pk-primary-tint));
  color: var(--pk-primary-strong); font-family: var(--pk-serif);
  font-size: 13px; font-weight: 600; line-height: 29.120px; text-align: center;
}

.chev { flex: none; width: 7.280px; height: 7.280px; border-right: 1.560px solid var(--pk-ink-4); border-bottom: 1.560px solid var(--pk-ink-4); transform: rotate(45deg) translateY(-2.080px); transition: transform var(--pk-dur-base) var(--pk-ease); }
.chev.up { transform: rotate(225deg) translate(-1.040px, -1.040px); }
.chev.right { transform: translateX(-1.560px) rotate(-45deg); }
.chev.left { transform: translateX(1.560px) rotate(135deg); }
.chev.pri { border-color: var(--pk-primary); }

/* ---------------- 卡片 ---------------- */
.pk-card { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); padding: var(--pk-s4); box-shadow: var(--pk-e0); box-sizing: border-box; }
.pk-card + .pk-card { margin-top: var(--pk-s3); }
.pk-card.flat { background: var(--pk-surface-warm); box-shadow: none; }
.pk-card.tight { padding: 13.520px 14.560px; }
.pk-card.plain { border-radius: var(--pk-r-lg); }

/* Hero：右上角一抹嫩芽光，右下角一道年轮弧线 */
.pk-hero {
  position: relative; overflow: hidden;
  border-radius: var(--pk-r-2xl); padding: 20.800px 18.720px 18.720px; box-sizing: border-box;
  background: radial-gradient(120% 130% at 100% 0%, rgba(127, 166, 92, .16), rgba(127, 166, 92, 0) 58%), linear-gradient(158deg, #FFFEFA 0%, #F7F4EA 100%);
  border: var(--pk-border); box-shadow: var(--pk-e2);
}

.pk-hero .hero-eyebrow { position: relative; display: block; font-size: 11px; line-height: 1.4; font-weight: 500; letter-spacing: 1.560px; color: var(--pk-primary-mid); }
.pk-hero .hero-line { position: relative; display: block; margin-top: 8.320px; font-family: var(--pk-serif); font-size: 19px; line-height: 1.4; font-weight: 600; color: var(--pk-ink); }
.pk-hero .hero-num { font-family: var(--pk-serif); font-size: 27px; font-weight: 600; letter-spacing: 0; color: var(--pk-primary); font-variant-numeric: tabular-nums; }
.pk-hero .hero-note { position: relative; display: block; margin-top: 7.280px; font-size: 13px; line-height: 1.65; color: var(--pk-ink-3); }
.pk-hero .btn-row, .pk-hero .btn { position: relative; }

/* 安排环：只描述今天的复习负荷组成（必做 / 有余力），不是完成率、不是评分 */
.ring { position: relative; flex: none; width: 95.680px; height: 95.680px; border-radius: 50%; }
.ring-plate { position: absolute; left: 15.600px; top: 15.600px; right: 15.600px; bottom: 15.600px; border-radius: 50%; background: rgba(255, 253, 248, .72); border: 0.520px solid rgba(34, 38, 31, .05); }
.ring-mid { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-mid .rv { font-family: var(--pk-serif); font-size: 24px; line-height: 1; font-weight: 600; color: var(--pk-ink); font-variant-numeric: tabular-nums; }
.ring-mid .rv .ru { font-family: var(--pk-sans); font-size: 12px; font-weight: 400; color: var(--pk-ink-4); }
.ring-mid .rl { margin-top: 3.120px; font-size: 10px; line-height: 1.2; letter-spacing: 0.520px; color: var(--pk-ink-3); }
.ring-legend { display: flex; align-items: center; gap: 10.400px; margin-top: 9.360px; }
.ring-legend .rg { display: inline-flex; align-items: center; gap: 4.160px; font-size: 11px; color: var(--pk-ink-3); }
.ring-legend .rg .rgd { width: 7.280px; height: 7.280px; border-radius: 50%; background: var(--pk-primary); }
.ring-legend .rg.opt .rgd { background: var(--pk-sprout); }

/* ---------------- 可折叠分区 ---------------- */
.sec { margin-top: var(--pk-s6); }
.sec-bar { min-height: 41.600px; display: flex; align-items: center; gap: 8.320px; padding: 0 2.080px; }
.sec-bar .s-t { flex: none; font-family: var(--pk-serif); font-size: 17px; line-height: 1.45; font-weight: 600; letter-spacing: .4px; color: var(--pk-ink); }
.sec-bar .s-m { flex: 1; min-width: 0; font-size: 12px; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }
.sec-rule { height: 0.520px; margin: 0 2.080px var(--pk-s3); background: linear-gradient(90deg, var(--pk-line-strong), rgba(235, 229, 215, 0)); }
.sec-body > view + view, .sec-body > .stack + .stack { margin-top: 10.400px; }

/* ---------------- 按钮 ---------------- */
.btn {
  box-sizing: border-box; width: 100%; height: var(--pk-cta-h); min-height: 45.760px;
  margin: 0; padding: 0 18.720px; border: 0; border-radius: var(--pk-r-pill);
  background: var(--pk-primary); color: var(--pk-ink-inv);
  font-size: 16px; line-height: 1.2; font-weight: 500; letter-spacing: .4px;
  display: flex; align-items: center; justify-content: center; gap: 7.280px;
  box-shadow: var(--pk-e-btn);
  transition: transform var(--pk-dur-fast) var(--pk-ease), background var(--pk-dur-fast) var(--pk-ease), box-shadow var(--pk-dur-fast) var(--pk-ease);
}
.btn::after { border: 0; }
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--pk-primary-tint); color: var(--pk-primary-strong); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--pk-primary); border: var(--pk-border-primary); box-shadow: none; }
.btn.neutral { background: var(--pk-surface); color: var(--pk-ink); border: 0.520px solid var(--pk-line-strong); box-shadow: var(--pk-e1); }
.btn.danger { background: var(--pk-danger-bg); color: var(--pk-danger); box-shadow: none; }
.btn.md { height: var(--pk-btn-md); min-height: var(--pk-btn-md); font-size: 15px; }
.btn.sm { height: var(--pk-btn-sm); min-height: var(--pk-btn-sm); width: auto; padding: 0 15.600px; font-size: 14px; box-shadow: none; }
.btn.auto { width: auto; }
.btn.is-disabled, .btn[disabled] { background: var(--pk-surface-sunken); color: var(--pk-ink-4); border-color: transparent; box-shadow: none; }
.btn.is-pressed { background: var(--pk-primary-pressed); }
.btn.secondary.is-pressed { background: var(--pk-primary-tint-2); }
/* 添加入口：虚线描边，不抢主 CTA 的注意力。设置、切换孩子弹层等多处共用。 */
.add-entry { display: flex; align-items: center; justify-content: center; gap: 6.240px; box-sizing: border-box; width: 100%; height: 45.760px; margin-top: 12.480px; border: 0.520px dashed var(--pk-primary-hairline); border-radius: var(--pk-r-md); color: var(--pk-primary); font-size: 15px; font-weight: 600; }

.btn-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10.400px; }
.btn-row.one { grid-template-columns: minmax(0, 1fr); }
.btn-row > .btn { width: 100%; min-width: 0; }

.link-btn { display: inline-flex; align-items: center; gap: 4.160px; min-height: 45.760px; margin: 0; padding: 0; border: 0; background: transparent; color: var(--pk-primary); font-size: 13px; font-weight: 500; }
.link-btn::after { border: 0; }
.link-btn.dan { color: var(--pk-danger); }
.icon-btn { flex: 0 0 37.440px; box-sizing: border-box; width: 37.440px; height: 37.440px; min-height: 37.440px; margin: 0; padding: 0; border: var(--pk-border-line); border-radius: 50%; background: var(--pk-surface); display: flex; align-items: center; justify-content: center; }
.icon-btn::after { border: 0; }

/* ---------------- 标签 / 状态 ---------------- */
.pill { display: inline-flex; align-items: center; gap: 4.160px; height: 22.880px; padding: 0 9.360px; border-radius: var(--pk-r-pill); background: var(--pk-primary-tint); color: var(--pk-primary-strong); font-size: 11px; font-weight: 500; letter-spacing: .2px; white-space: nowrap; }
.pill.att { background: var(--pk-attention-bg); color: var(--pk-attention); }
.pill.dan { background: var(--pk-danger-bg); color: var(--pk-danger); }
.pill.neutral { background: var(--pk-canvas-deep); color: var(--pk-ink-3); }
.pill.info { background: var(--pk-info-bg); color: var(--pk-info); }
.pill.suc { background: var(--pk-success-bg); color: var(--pk-success); }
.pill.solid { background: var(--pk-primary); color: var(--pk-ink-inv); }
.pill.line { background: transparent; border: 0.520px solid var(--pk-line-strong); color: var(--pk-ink-2); }
.pill .dot { width: 5.200px; height: 5.200px; border-radius: 50%; background: currentColor; }
.tagx { display: inline-flex; align-items: center; height: 20.800px; padding: 0 7.280px; border-radius: var(--pk-r-sm); background: var(--pk-canvas-deep); color: var(--pk-ink-3); font-size: 11px; }

.tag-sub { display: inline-flex; align-items: center; height: 22.880px; padding: 0 8.320px; border-radius: var(--pk-r-sm); font-size: 11px; font-weight: 600; }
.sub-mark { flex: 0 0 35.360px; width: 35.360px; height: 35.360px; border-radius: 11.440px; display: flex; align-items: center; justify-content: center; font-family: var(--pk-serif); font-size: 15px; font-weight: 600; }
.tag-sub.s-chinese, .sub-mark.s-chinese { background: var(--pk-sub-chinese-bg); color: var(--pk-sub-chinese); }
.tag-sub.s-math, .sub-mark.s-math { background: var(--pk-sub-math-bg); color: var(--pk-sub-math); }
.tag-sub.s-english, .sub-mark.s-english { background: var(--pk-sub-english-bg); color: var(--pk-sub-english); }
.tag-sub.s-activity, .sub-mark.s-activity { background: var(--pk-sub-activity-bg); color: var(--pk-sub-activity); }
.tag-sub.s-other, .sub-mark.s-other { background: var(--pk-sub-other-bg); color: var(--pk-sub-other); }

/* 识别置信度：三格竖条，只描述「要不要核对」，不是分数 */
.confidence { display: inline-flex; align-items: center; gap: 4.160px; font-size: 11px; font-weight: 500; }
.confidence .bars { display: inline-flex; align-items: flex-end; gap: 1.560px; }
.confidence .bars .b { width: 3.640px; height: 6.240px; border-radius: 1.040px; background: currentColor; opacity: .2; }
.confidence .bars .b:nth-child(2) { height: 9.360px; }
.confidence .bars .b:nth-child(3) { height: 12.480px; }
.confidence .bars .b.on { opacity: 1; }
.confidence.high { color: var(--pk-primary); }
.confidence.medium { color: var(--pk-attention); }
.confidence.low { color: var(--pk-danger); }

/* 草稿印章：AI 产出与正式记录的永久分界 */
.stamp { display: inline-flex; align-items: center; gap: 5.200px; height: 24.960px; padding: 0 9.360px; border: 1.040px dashed rgba(56, 130, 106, .55); border-radius: var(--pk-r-sm); background: rgba(228, 237, 230, .6); color: var(--pk-primary-strong); font-size: 12px; font-weight: 600; letter-spacing: 0.520px; transform: rotate(-1.4deg); }
.stamp.manual { border-color: var(--pk-line-strong); background: var(--pk-canvas-deep); color: var(--pk-ink-3); }

/* ---------------- 提示条 ---------------- */
.pk-notice { display: flex; align-items: center; gap: 9.360px; min-height: 47.840px; padding: 11.440px 13.520px; box-sizing: border-box; border-radius: var(--pk-r-lg); background: var(--pk-attention-bg); border: 0.520px solid var(--pk-attention-line); color: var(--pk-ink-2); font-size: 13px; line-height: 1.6; }
.pk-notice .n-txt { flex: 1; min-width: 0; }
.pk-notice .n-t { display: block; font-size: 14px; line-height: 1.5; font-weight: 500; color: var(--pk-ink); }
.pk-notice .n-c { display: block; margin-top: 2.080px; font-size: 12px; line-height: 1.6; color: var(--pk-ink-3); }
.pk-notice.err { background: var(--pk-danger-bg); border-color: var(--pk-danger-line); }
.pk-notice.info { background: var(--pk-info-bg); border-color: var(--pk-info-line); }
.pk-notice.ai { background: linear-gradient(120deg, rgba(127, 166, 92, .16), rgba(56, 130, 106, .1)); border: 0.520px dashed rgba(56, 130, 106, .4); }
.pk-notice.quiet { background: rgba(243, 239, 228, .8); border-color: var(--pk-line); }
.pk-notice.top { align-items: flex-start; }

/* ---------------- 分段控件 / chips ---------------- */
.seg { display: grid; padding: 3.120px; border-radius: var(--pk-r-pill); background: rgba(34, 38, 31, .05); box-sizing: border-box; }
.seg.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg > button, .seg > view { box-sizing: border-box; width: 100%; min-width: 0; height: 37.440px; margin: 0; padding: 0; border: 0; border-radius: var(--pk-r-pill); background: transparent; color: var(--pk-ink-3); font-size: 14px; line-height: 1.2; font-weight: 400; display: flex; align-items: center; justify-content: center; gap: 5.200px; transition: background var(--pk-dur-base) var(--pk-ease), color var(--pk-dur-base) var(--pk-ease); }
.seg > button::after { border: 0; }
.seg > button.on, .seg > view.on { background: var(--pk-surface-raised); color: var(--pk-primary-strong); font-weight: 500; box-shadow: var(--pk-e1); }

.chips { display: flex; flex-wrap: wrap; gap: 7.280px; }
.chips > view, .chips > button { box-sizing: border-box; height: 35.360px; margin: 0; padding: 0 14.560px; border: 0.520px solid var(--pk-line-strong); border-radius: var(--pk-r-pill); background: var(--pk-surface-raised); color: var(--pk-ink-2); font-size: 13px; line-height: 1.2; font-weight: 400; display: inline-flex; align-items: center; gap: 5.200px; transition: transform var(--pk-dur-base) var(--pk-ease-spring), background var(--pk-dur-base) var(--pk-ease); }
.chips > button::after { border: 0; }
.chips > view.on, .chips > button.on { background: var(--pk-primary); border-color: var(--pk-primary); color: var(--pk-ink-inv); font-weight: 500; box-shadow: var(--pk-e-btn); }
.chips > view:active, .chips > button:active { transform: scale(.96); }
.chips .cnt { font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }

/* ---------------- 表单 ---------------- */
.pk-field + .pk-field { margin-top: 14.560px; }
.pk-field .lbl { display: block; margin-bottom: 6.240px; font-size: 13px; font-weight: 500; color: var(--pk-ink-2); }
.pk-field .lbl .opt { margin-left: 6.240px; font-weight: 400; font-size: 11px; color: var(--pk-ink-4); }
.pk-input, .pk-picker, .pk-textarea { box-sizing: border-box; width: 100%; min-height: 47.840px; padding: 12.480px 14.560px; background: var(--pk-surface-raised); border: 0.520px solid var(--pk-line-strong); border-radius: var(--pk-r-md); font-size: 15px; line-height: 1.5; color: var(--pk-ink); }
.pk-picker { display: flex; align-items: center; justify-content: space-between; gap: 8.320px; }
.pk-textarea { min-height: 108.160px; line-height: 1.7; }
.pk-input.is-error, .pk-textarea.is-error, .pk-picker.is-error { border-color: var(--pk-danger); }
.pk-ph { color: var(--pk-ink-4); }
.help { margin-top: 6.240px; font-size: 12px; line-height: 1.6; color: var(--pk-ink-3); }
.fd-row { display: flex; align-items: flex-start; gap: 10.400px; }
.fd-row .help { flex: 1; min-width: 0; }
.fd-row .lk { flex: none; }
.lk { margin-top: 6.240px; font-size: 12px; line-height: 1.6; color: var(--pk-primary); font-weight: 500; }
.lk:active { opacity: .6; }
.err-text { margin-top: 6.240px; font-size: 12px; line-height: 1.6; color: var(--pk-danger); }
.counter { font-size: 11px; color: var(--pk-ink-4); font-variant-numeric: tabular-nums; }

/* ---------------- 行列表 ---------------- */
.rowlist { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); box-shadow: var(--pk-e0); overflow: hidden; }
.rowitem { position: relative; display: flex; align-items: center; gap: 11.440px; min-height: var(--pk-row-min); padding: 12.480px 14.560px; box-sizing: border-box; transition: background var(--pk-dur-fast) var(--pk-ease); }
.rowitem + .rowitem::before { content: ""; position: absolute; left: 14.560px; right: 0; top: 0; height: 0.520px; background: var(--pk-line); }
.rowitem:active { background: var(--pk-primary-wash); }
.rowitem .r-t { display: block; font-size: 15px; line-height: 1.45; font-weight: 500; }
.rowitem .r-s { display: block; margin-top: 3.120px; font-size: 12px; line-height: 1.55; color: var(--pk-ink-3); }

/* ---------------- 时间线 / 周条 ---------------- */
.tl { position: relative; padding-left: 60.320px; }
.tl::before { content: ""; position: absolute; left: 48.880px; top: 8.320px; bottom: 10.400px; width: 0.520px; background: var(--pk-line-strong); }
.tl-item { position: relative; padding-bottom: 12.480px; }
.tl-time { position: absolute; left: -60.320px; top: 15.600px; width: 41.600px; text-align: right; font-size: 12px; font-weight: 500; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }
.tl-node { position: absolute; left: -14.040px; top: 18.720px; width: 6.240px; height: 6.240px; border-radius: 50%; background: var(--pk-surface); border: 2.600px solid var(--pk-primary-mid); box-sizing: content-box; }
.tl-card { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-lg); padding: 12.480px 13.520px; box-shadow: var(--pk-e0); box-sizing: border-box; }
.tl-card.accent { border-left: 3.120px solid var(--pk-sub-activity); }
.tl-name { display: block; font-size: 15px; line-height: 1.45; font-weight: 500; }
.tl-sub { display: block; margin-top: 3.120px; font-size: 12px; line-height: 1.55; color: var(--pk-ink-3); }
.tl-item.past .tl-node { border-color: var(--pk-line-strong); }
.tl-item.past .tl-time { color: var(--pk-ink-4); }
.tl-item.past .tl-card { background: var(--pk-surface-warm); box-shadow: none; }
.tl-item.past .tl-name { color: var(--pk-ink-3); }
.tl-item.hint .tl-node { border-style: dashed; border-color: var(--pk-attention); }
.tl-item.hint .tl-time { color: var(--pk-attention); }
.tl-item.hint .tl-card { border: 0.520px dashed rgba(169, 118, 42, .34); background: rgba(248, 239, 220, .4); box-shadow: none; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3.120px; }
.wd { height: 64.480px; border-radius: var(--pk-r-md); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4.160px; box-sizing: border-box; transition: background var(--pk-dur-base) var(--pk-ease); }
.wd .w { font-size: 11px; line-height: 1.2; color: var(--pk-ink-4); }
.wd .d { font-size: 16px; line-height: 1.2; font-weight: 500; color: var(--pk-ink-2); font-variant-numeric: tabular-nums; }
.wd .m { width: 4.160px; height: 4.160px; border-radius: 50%; background: var(--pk-primary-mid); }
.wd .m.void { background: transparent; }
.wd.today { background: var(--pk-primary-tint); }
.wd.today .d { color: var(--pk-primary-strong); font-weight: 700; }
.wd.on { background: var(--pk-primary); box-shadow: var(--pk-e-btn); }
.wd.on .w { color: rgba(255, 253, 248, .72); }
.wd.on .d { color: var(--pk-ink-inv); font-weight: 600; }
.wd.on .m { background: rgba(255, 253, 248, .85); }
.wd.dim .d, .wd.dim .w { color: var(--pk-ink-4); opacity: .55; }

/* ---------------- FAB ---------------- */
.pk-fab { position: fixed; right: var(--pk-gutter); bottom: calc(var(--pk-s4) + var(--pk-tabbar-h) + 0px); z-index: 12; height: 49.920px; padding: 0 18.720px 0 15.600px; margin: 0; border: 0; border-radius: var(--pk-r-pill); background: linear-gradient(150deg, var(--pk-primary-mid), var(--pk-primary-strong)); color: var(--pk-ink-inv); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 7.280px; box-shadow: var(--pk-e-fab); }
.pk-fab::after { border: 0; }
.pk-fab:active { transform: scale(.96); }

/* ---------------- 数据展示 ---------------- */
/* 指标是 2×2 的只读小卡：每格自带描边与间距，小屏也不挤。 */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--pk-s2); }
.metric { position: relative; overflow: hidden; box-sizing: border-box; min-width: 0; min-height: 87.360px; padding: 12.480px 12.480px 10.400px; display: flex; flex-direction: column; justify-content: center; background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); box-shadow: var(--pk-e0); }
.metric .mv { position: relative; display: block; font-family: var(--pk-serif); font-size: 27px; line-height: 1.1; font-weight: 600; color: var(--pk-ink); font-variant-numeric: tabular-nums; }
.metric .mv.zero { color: var(--pk-ink-4); }
.metric .ml { display: block; margin-top: 7.280px; font-size: 12px; line-height: 1.3; color: var(--pk-ink-3); }

.bar-row { position: relative; display: flex; align-items: center; gap: 10.400px; min-height: 49.920px; }
.bar-row .bn { flex: 0 0 54.080px; font-size: 14px; font-weight: 400; }
.bar-track { flex: 1; min-width: 0; height: 8.320px; border-radius: var(--pk-r-pill); background: rgba(34, 38, 31, .06); overflow: hidden; }
.bar-fill { height: 100%; border-radius: var(--pk-r-pill); background: linear-gradient(90deg, var(--pk-primary-mid), var(--pk-primary)); transition: width var(--pk-dur-slow) var(--pk-ease); }
.bar-row .bv { flex: none; font-size: 12px; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }

.udot { width: 35.360px; height: 35.360px; margin: 0 auto; border-radius: 10.400px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.udot.l0 { background: var(--pk-canvas-deep); color: var(--pk-ink-4); }
.udot.l1 { background: var(--pk-primary-tint); color: var(--pk-primary-strong); }
.udot.l2 { background: #C9DDCD; color: var(--pk-primary-strong); }
.udot.l3 { background: var(--pk-attention-bg); color: var(--pk-attention); }
.udot.l4 { background: #EFD9AD; color: #7E561A; }
.udot.pass { background: var(--pk-primary); color: var(--pk-ink-inv); }
.hbox { width: 100%; max-width: 35.360px; height: 35.360px; margin: 0 auto; border-radius: 9.360px; }
.hbox.h0 { background: rgba(34, 38, 31, .05); }
.hbox.h1 { background: #E2EBE1; }
.hbox.h2 { background: #C0D6C2; }
.hbox.h3 { background: #86AF92; }
.hbox.h4 { background: var(--pk-primary); }
.cell-label { display: block; margin-top: 4.160px; text-align: center; font-size: 10px; line-height: 1.2; color: var(--pk-ink-4); font-variant-numeric: tabular-nums; }
.legend { display: flex; align-items: center; gap: 4.160px; font-size: 10px; color: var(--pk-ink-4); }
.legend .sw { width: 10.400px; height: 10.400px; border-radius: 3.120px; }

.pager { display: flex; align-items: center; justify-content: space-between; min-height: 41.600px; }
.pager .pbtn { flex: 0 0 31.200px; width: 31.200px; height: 31.200px; min-height: 31.200px; margin: 0; padding: 0; border: 0.520px solid var(--pk-line-strong); border-radius: 50%; background: var(--pk-surface); display: flex; align-items: center; justify-content: center; }
.pager .pbtn::after { border: 0; }
.pager .pbtn.off { opacity: .35; }
.pager .plabel { flex: 1; min-width: 0; text-align: center; font-size: 12px; font-weight: 500; color: var(--pk-ink-2); }
.pager .plabel .psub { display: block; margin-top: 2.080px; font-size: 10px; font-weight: 400; color: var(--pk-ink-4); font-variant-numeric: tabular-nums; }
.pdots { display: flex; align-items: center; justify-content: center; gap: 4.160px; margin-top: 8.320px; }
.pdots .pd { width: 4.160px; height: 4.160px; border-radius: 50%; background: var(--pk-line-strong); transition: width var(--pk-dur-base) var(--pk-ease); }
.pdots .pd.on { width: 14.560px; border-radius: 2.080px; background: var(--pk-primary); }

/* ---------------- 照片上传 ---------------- */
.upload-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10.400px; }
.up-tile { box-sizing: border-box; height: 112.320px; margin: 0; padding: 0; border-radius: var(--pk-r-xl); border: 1.560px dashed rgba(56, 130, 106, .36); background: linear-gradient(160deg, rgba(228, 237, 230, .7), rgba(255, 253, 248, .7)); color: var(--pk-primary-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8.320px; font-size: 14px; line-height: 1.3; font-weight: 500; transition: transform var(--pk-dur-base) var(--pk-ease), background var(--pk-dur-base) var(--pk-ease); }
.up-tile::after { border: 0; }
.up-tile:active { transform: scale(.98); background: var(--pk-primary-tint); }
.up-tile .us { font-size: 11px; font-weight: 400; color: var(--pk-ink-4); }
.up-tile.alt { background: var(--pk-surface); border: 1.560px dashed var(--pk-line-strong); color: var(--pk-ink-2); }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8.320px; }
.pcell { position: relative; width: 100%; height: 0; padding-bottom: 100%; border-radius: var(--pk-r-md); overflow: hidden; background: var(--pk-canvas-deep); border: var(--pk-border-line); box-sizing: border-box; }
.pcell .pimg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.pcell .rm { position: absolute; top: 4.160px; right: 4.160px; width: 22.880px; height: 22.880px; border-radius: 50%; background: rgba(24, 28, 20, .62); color: #fff; display: flex; align-items: center; justify-content: center; }
.pcell .idx { position: absolute; left: 5.200px; bottom: 5.200px; height: 17.680px; padding: 0 6.240px; border-radius: 5.200px; background: rgba(24, 28, 20, .62); color: #fff; font-size: 10px; font-weight: 500; display: flex; align-items: center; font-variant-numeric: tabular-nums; }
.pcell .prog { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(255, 253, 248, .7); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--pk-primary-strong); }
.pcell.add { border: 1.560px dashed var(--pk-line-strong); background: transparent; }
.pcell.add .ph-center { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; color: var(--pk-ink-4); }
.prog-line { height: 5.200px; border-radius: var(--pk-r-pill); background: rgba(34, 38, 31, .08); overflow: hidden; }
.prog-line .pf { display: block; height: 100%; border-radius: var(--pk-r-pill); background: linear-gradient(90deg, var(--pk-primary-mid), var(--pk-sprout)); transition: width var(--pk-dur-base) var(--pk-ease); }

/* AI 整理中：命名进度，不给假百分比 */
.ai-run { padding: 16.640px; box-sizing: border-box; border-radius: var(--pk-r-xl); background: linear-gradient(150deg, rgba(228, 237, 230, .8), rgba(255, 253, 248, .9)); border: 0.520px dashed rgba(56, 130, 106, .38); }
.ai-step { display: flex; align-items: center; gap: 10.400px; min-height: 37.440px; }
.ai-step .sd { flex: none; width: 20.800px; height: 20.800px; border-radius: 50%; border: 1.560px solid var(--pk-line-strong); background: var(--pk-surface); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--pk-ink-4); font-variant-numeric: tabular-nums; }
.ai-step .st { font-size: 13px; color: var(--pk-ink-4); }
.ai-step.done .sd { background: var(--pk-primary); border-color: var(--pk-primary); color: var(--pk-ink-inv); }
.ai-step.done .st { color: var(--pk-ink-2); }
.ai-step.run .sd { border-color: var(--pk-primary); color: var(--pk-primary); }
.ai-step.run .st { color: var(--pk-primary-strong); font-weight: 500; }

/* ---------------- 浮层 ---------------- */
.pk-mask { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 20; background: rgba(24, 28, 20, .42); }
.pk-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 85vh; box-sizing: border-box; background: var(--pk-canvas); border-radius: var(--pk-r-2xl) var(--pk-r-2xl) 0 0; box-shadow: var(--pk-e-sheet); padding: 8.320px var(--pk-gutter) calc(14.560px + var(--pk-tabbar-h) + 0px); display: flex; flex-direction: column; }
/* 原生自定义 TabBar 是独立图层，页面内 fixed 浮层无法遮住它：非 Tab 页可用 .plain 收回这段预留。 */
.pk-sheet.plain { padding-bottom: calc(14.560px + 0px); }
.pk-sheet .handle { flex: none; width: 39.520px; height: 4.160px; border-radius: 2.080px; background: var(--pk-line-strong); margin: 0 auto 10.400px; }
.sheet-head { flex: none; display: flex; align-items: flex-start; gap: 10.400px; padding-bottom: 12.480px; }
.sheet-title { display: block; font-family: var(--pk-serif); font-size: 18px; line-height: 1.4; font-weight: 600; letter-spacing: .4px; }
.sheet-sub { display: block; margin-top: 4.160px; font-size: 12px; line-height: 1.55; color: var(--pk-ink-3); }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; }
.sheet-foot { flex: none; padding-top: 12.480px; }

.asheet { position: fixed; left: 8.320px; right: 8.320px; bottom: 8.320px; z-index: 21; }
.asheet .grp { background: rgba(255, 253, 248, .98); border-radius: var(--pk-r-xl); overflow: hidden; }
.asheet .grp .ttl { padding: 12.480px; text-align: center; font-size: 12px; line-height: 1.5; color: var(--pk-ink-3); border-bottom: var(--pk-border-soft); }
.asheet .grp .it { min-height: 58.240px; display: flex; align-items: center; justify-content: center; gap: 8.320px; font-size: 17px; font-weight: 400; color: var(--pk-ink); }
.asheet .grp .it + .it { border-top: var(--pk-border-soft); }
.asheet .grp .it.dan { color: var(--pk-danger); }
.asheet .cancel { margin-top: 8.320px; min-height: 58.240px; border-radius: var(--pk-r-xl); background: var(--pk-surface-raised); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500; margin-bottom: 0px; }

/* ---------------- 吸底操作条 ---------------- */
.pk-cta-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; box-sizing: border-box; padding: 12.480px var(--pk-gutter) calc(12.480px + 0px); background: linear-gradient(180deg, rgba(250, 247, 240, 0), rgba(250, 247, 240, .97) 34%); backdrop-filter: blur(10px); }

/* ---------------- 空态 / 骨架 ---------------- */
.pk-empty { text-align: center; padding: 37.440px 24.960px; }
.pk-empty .em { width: 70.720px; height: 70.720px; margin: 0 auto 14.560px; border-radius: 22.880px; background: radial-gradient(circle at 30% 25%, var(--pk-sprout-bg), var(--pk-primary-tint)); box-shadow: inset 0 0.520px 0 rgba(255, 255, 255, .7); display: flex; align-items: center; justify-content: center; }
.pk-empty .et { display: block; font-family: var(--pk-serif); font-size: 17px; line-height: 1.45; font-weight: 600; }
.pk-empty .ec { display: block; margin: 7.280px auto 0; max-width: 270.400px; font-size: 13px; line-height: 1.75; color: var(--pk-ink-3); }
.pk-empty .ea { margin-top: 16.640px; display: flex; align-items: center; justify-content: center; gap: 9.360px; }
.pk-empty.inline { padding: 22.880px 12.480px; }
.pk-empty.inline .et { font-family: var(--pk-sans); font-size: 14px; font-weight: 400; color: var(--pk-ink-2); }

.sk { border-radius: var(--pk-r-xl); background: linear-gradient(100deg, rgba(34, 38, 31, .055) 30%, rgba(34, 38, 31, .02) 50%, rgba(34, 38, 31, .055) 70%); background-size: 300% 100%; animation: pk-sk 1.5s linear infinite; }
.sk.hero-sk { height: 137.280px; border-radius: var(--pk-r-2xl); }
.sk.card-sk { height: 120.640px; }
.sk.h20 { height: 20.800px; border-radius: var(--pk-r-md); }
.sk.h14 { height: 14.560px; border-radius: 7.280px; }
.sk + .sk { margin-top: 10.400px; }
@keyframes pk-sk { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* ---------------- 布局工具 ---------------- */
.flex { display: flex; align-items: center; gap: 8.320px; }
.flex.top { align-items: flex-start; }
.flex.between { justify-content: space-between; }
.flex.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.mt1 { margin-top: 4.160px; }
.mt2 { margin-top: 9.360px; }
.mt3 { margin-top: 14.560px; }
.mt4 { margin-top: 20.800px; }
.mt5 { margin-top: 24.960px; }
.mt6 { margin-top: 29.120px; }
.hairline { height: 0.520px; background: var(--pk-line); }
.safe-tail { height: calc(20.800px + 0px); }
.enter { animation: pk-in var(--pk-dur-slow) var(--pk-ease) both; }
@keyframes pk-in { from { opacity: 0; transform: translateY(6.240px); } to { opacity: 1; transform: none; } }
