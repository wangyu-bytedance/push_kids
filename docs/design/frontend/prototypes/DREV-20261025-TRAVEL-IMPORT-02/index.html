<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅行日记 · 直接选图</title>
<style>
:root{--paper:#FAF7F0;--surface:#FFFDF8;--ink:#22261F;--muted:#59624F;--green:#1F5B45;--wash:#E4EDE6;--line:#E2DCCC;--error:#A85742}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input{font:inherit;color:inherit}button{border:0;background:none;min-width:44px;min-height:44px;padding:8px 12px;border-radius:999px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}button:disabled{cursor:default;opacity:.55}.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.brand{height:64px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;gap:8px}.brand svg{color:var(--green)}main{max-width:480px;margin:auto;padding:8px 16px 124px}.heading,.row{display:flex;align-items:center;gap:8px}.heading{justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.title{display:flex;align-items:center;gap:8px;font:22px/1.5 'Songti SC',serif;padding:0}.title svg{width:16px}.child{margin-left:auto;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:6px 12px 6px 6px}.avatar{display:grid;place-items:center;width:28px;height:28px;background:var(--wash);color:var(--green);border-radius:50%}.stats{display:flex;flex:1;min-width:0;flex-wrap:wrap;gap:2px 12px;color:var(--muted)}.segments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:3px;background:#22261f0d;border-radius:999px;margin-top:12px}.segments button{min-width:0;padding:8px 2px;color:var(--muted)}.segments .on{color:var(--green);background:var(--surface);box-shadow:0 1px 3px #22261f12}.link{color:var(--green);font-weight:500}.full{width:100%}.primary{width:100%;min-height:48px;background:var(--green);color:white;font-size:16px;font-weight:500;padding:10px 18px}.import{margin-top:20px;display:flex;justify-content:center;align-items:center;gap:8px}.empty{display:flex;min-height:220px;align-items:center;justify-content:center;flex-direction:column;color:var(--muted)}.empty svg{width:56px;height:56px;color:var(--green);margin:20px}.empty h2{font:22px/1.5 'Songti SC',serif;margin:0}.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 8px 24px;min-height:88px}.tabs button{flex:1;display:flex;flex-direction:column;gap:2px;align-items:center;padding:6px 0;color:var(--muted)}.tabs .active{color:var(--green)}.overlay{position:fixed;inset:0;background:#22261f66;display:flex;align-items:flex-end;z-index:10}.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:88dvh;display:flex;flex-direction:column}.sheet-head{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}.sheet-head h2{font-size:16px;margin:0;font-weight:600}.close{padding:0;width:48px;height:48px;display:grid;place-items:center;flex:none}.sheet-body{padding:16px;overflow:auto;min-height:0}.sheet-body p{margin:0}.sheet-footer{border-top:1px solid var(--line);padding:12px 16px 28px}.progress{height:8px;border-radius:8px;background:var(--wash);margin-top:16px;overflow:hidden}.progress span{display:block;width:67%;height:100%;background:var(--green)}.error{color:var(--error);margin-top:12px!important}.toggle{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:16px}.toggle input{appearance:none;margin:0;width:48px;height:44px;position:relative;flex:none;cursor:pointer}.toggle input:before{content:'';position:absolute;left:0;top:8px;width:48px;height:28px;border-radius:99px;background:#899285}.toggle input:checked:before{background:var(--green)}.toggle input:after{content:'';position:absolute;left:3px;top:11px;width:22px;height:22px;background:white;border-radius:50%}.toggle input:checked:after{left:23px}.review{display:none}@media(max-width:340px){main{padding-left:12px;padding-right:12px}.brand{height:56px}.heading{margin-bottom:12px}.sheet-footer{padding-bottom:20px}}@media(min-width:700px){.overlay{left:calc(50% - 240px);right:calc(50% - 240px)}.review{display:flex;gap:8px;flex-wrap:wrap;max-width:900px;margin:16px auto;padding:16px}.review a{color:var(--green);padding:8px}}
</style>
<div id="app"></div>
<script>
// Review-only synthetic states. No network, storage, native picker or user files.
const states=['entry','selecting','uploading','upload-error','settings'];
let current=new URLSearchParams(location.search).get('state')||'entry',aiEnabled=false;
const paths={sprout:'M12 21v-9M12 15C6 15 3 12 3 6c6 0 9 3 9 9Zm0-3c0-5 3-8 9-8 0 6-3 9-9 9',down:'m6 9 6 6 6-6',camera:'M4 6h4l2-3h4l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2ZM16 13a4 4 0 1 1-8 0 4 4 0 0 1 8 0',close:'m6 6 12 12M18 6 6 18',more:'M5 12h.01M12 12h.01M19 12h.01',calendar:'M4 5h16v16H4zM8 3v4m8-4v4M4 10h16',chart:'M5 20V10m7 10V4m7 16v-7M2 21h20',settings:'M3 6h18M3 12h18M3 18h18M8 4v4m8 2v4M8 16v4'};
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]}"></path></svg>`;
function render(){
 const busy=current==='selecting',panel=['uploading','upload-error','settings'].includes(current);
 const title=current==='settings'?'足迹设置':'导入照片';
 const body=current==='settings'?`<label class="toggle"><span>AI 地点候选</span><input type="checkbox" role="switch" aria-label="AI 地点候选" ${aiEnabled?'checked':''}></label>`:current==='uploading'?'<p role="status">正在上传 · 2 / 3 张</p><div class="progress" role="progressbar" aria-valuenow="67" aria-valuemin="0" aria-valuemax="100"><span></span></div>':'<p>已上传 2 / 3 张</p><p class="error" role="alert">第 3 张上传失败</p>';
 const footer=current==='settings'?'<button class="primary" data-go="entry">保存设置</button>':current==='uploading'?'<button class="primary" disabled>正在上传 67%</button>':'<button class="primary" data-go="uploading">重试未完成上传</button><button class="link full" data-go="entry">核对已上传照片</button>';
 document.getElementById('app').innerHTML=`<div ${panel?'inert aria-hidden="true"':''}><div class="brand">${icon('sprout')}<span>知芽</span></div><main><div class="heading"><button class="title">旅行日记${icon('down')}</button><button class="child"><span class="avatar">六</span><span>六六</span>${icon('down')}</button></div><div class="row"><div class="stats"><span>0 个地点</span><span>0 座城市</span><span>0 个国家</span><span>0 张照片</span></div><button data-go="settings" aria-label="更多足迹操作">${icon('more')}</button></div><div class="segments"><button class="on">时间线</button><button>轨迹回放</button><button>地图点亮</button></div><button class="link full">查看待整理照片</button><div class="empty">${icon('camera')}<h2>还没有足迹</h2><button class="link">手动记录</button></div><button class="primary import" data-go="selecting" ${busy?'disabled aria-busy="true"':''}>${icon('camera')}<span>${busy?'正在选择照片…':'导入照片'}</span></button></main><nav class="tabs" aria-label="主导航">${['今日','日程','记录','报表','设置'].map((text,i)=>`<button class="${i===2?'active':''}">${icon(['sprout','calendar','camera','chart','settings'][i])}${text}</button>`).join('')}</nav></div>${panel?`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><header class="sheet-head"><h2>${title}</h2><button class="close" aria-label="关闭面板" data-go="entry" ${current==='uploading'?'disabled':''}>${icon('close')}</button></header><div class="sheet-body">${body}</div><footer class="sheet-footer">${footer}</footer></section></div>`:''}<nav class="review" aria-label="设计状态">${states.map(s=>`<a href="?state=${s}">${s}</a>`).join('')}</nav>`;
}
document.addEventListener('click',event=>{const button=event.target.closest('button[data-go]');if(!button||button.disabled)return;current=button.dataset.go;render();});
document.addEventListener('change',event=>{if(event.target.matches('[role=switch]'))aiEnabled=event.target.checked;});
document.addEventListener('keydown',event=>{const dialog=document.querySelector('[role=dialog]');if(!dialog)return;if(event.key==='Escape'&&current!=='uploading'){current='entry';render();return;}if(event.key==='Tab'){const nodes=[...dialog.querySelectorAll('button:not([disabled]),input')];if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
render();window.designReady=true;
</script>
</html>
