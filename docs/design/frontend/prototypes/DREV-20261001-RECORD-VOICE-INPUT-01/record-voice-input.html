<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>记录页语音输入</title>
  <style>
    :root {
      --canvas:#faf7f0; --surface:#fffdf8; --sunken:#f3efe4; --ink:#202a25;
      --ink2:#4f5853; --ink3:#777d79; --line:#ebe5d7; --pine:#1f5b45;
      --pine-soft:#dce9e1; --sprout:#7fa65c; --attention:#a9762a; --error:#a85742;
      --serif:"Songti SC","Noto Serif SC",STSong,serif;
      --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:var(--canvas);color:var(--ink);font-family:var(--sans)}
    button{font:inherit}.app{position:relative;width:100vw;height:100vh;min-height:568px;overflow:hidden;background:var(--canvas)}
    .page{width:min(480px,100%);height:100%;margin:0 auto;padding:20px 16px 150px;overflow-y:auto}
    .brand{height:42px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--pine);font-family:var(--serif);font-size:18px;font-weight:700}
    .sprout{position:relative;width:20px;height:22px}.sprout:before,.sprout:after{content:"";position:absolute;top:1px;width:10px;height:15px;border-radius:10px 1px 10px 1px;background:var(--sprout);transform:rotate(-35deg)}
    .sprout:after{left:10px;transform:scaleX(-1) rotate(-35deg)}.sprout i{position:absolute;left:9px;top:11px;width:2px;height:11px;background:var(--pine);border-radius:2px}
    .head{margin-top:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-family:var(--serif);font-size:27px;font-weight:700;line-height:1.25}.child{height:44px;padding:0 14px;border:0;border-radius:999px;background:var(--pine-soft);color:var(--pine);font-weight:650}
    .time-card{margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 10px 28px rgba(52,58,52,.05)}
    .row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.cap{color:var(--ink3);font-size:12px}.time{margin-top:3px;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}.small-btn{min-width:60px;height:44px;border:0;border-radius:12px;background:var(--sunken);color:var(--ink2);font-size:13px;font-weight:650}
    .field-head{margin-top:24px;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px}.label{font-size:15px;font-weight:700}.voice-btn{height:44px;padding:0 13px;border:1px solid #b9cdbf;border-radius:999px;background:var(--surface);color:var(--pine);display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
    .mic{position:relative;width:16px;height:20px}.mic:before{content:"";position:absolute;left:4px;top:0;width:8px;height:13px;border:2px solid currentColor;border-radius:8px}.mic:after{content:"";position:absolute;left:2px;top:8px;width:12px;height:8px;border:2px solid currentColor;border-top:0;border-radius:0 0 9px 9px;box-shadow:0 4px 0 -1px currentColor}
    .textarea{position:relative;min-height:150px;padding:15px 15px 35px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-size:15px;line-height:1.65}.placeholder{color:#9a9e9a}.counter{position:absolute;right:14px;bottom:11px;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
    .voice-state{margin-top:10px;padding:14px;border:1px solid #c9d9ce;border-radius:16px;background:#f4f8f5}.state-main{display:flex;align-items:center;gap:10px}.status-dot{width:12px;height:12px;border-radius:50%;background:var(--error);box-shadow:0 0 0 5px rgba(168,87,66,.12)}
    .state-title{font-size:14px;font-weight:750}.state-sub{margin-top:3px;color:var(--ink3);font-size:12px}.timer{font-variant-numeric:tabular-nums}.state-actions{margin-top:12px;display:grid;grid-template-columns:minmax(88px,1fr) minmax(148px,1.7fr);gap:10px}.cancel,.stop{height:44px;border-radius:12px;font-weight:700}.cancel{border:1px solid var(--line);background:var(--surface);color:var(--ink2)}.stop{border:0;background:var(--pine);color:#fff}
    .success{margin-top:10px;min-height:48px;padding:0 13px;border:1px solid #c9d9ce;border-radius:14px;background:#f4f8f5;display:flex;align-items:center;gap:9px;color:var(--pine);font-size:13px;font-weight:650}.check{width:18px;height:18px;border-radius:50%;background:var(--pine);color:white;display:grid;place-items:center;font-size:12px}.undo{margin-left:auto;min-width:82px;height:44px;border:0;background:transparent;color:var(--pine);font-weight:700}
    .photo-label{margin-top:24px;font-size:15px;font-weight:700}.photo{margin-top:11px;height:92px;border:1px dashed #cfc7b8;border-radius:16px;background:rgba(255,253,248,.7);display:grid;place-items:center;color:var(--ink3);font-size:13px}
    .history{margin-top:24px;height:58px;padding:0 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;align-items:center;font-weight:700}.chev{margin-left:auto;color:var(--ink3)}
    .cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(250,247,240,0),var(--canvas) 18%,var(--canvas));z-index:3}.cta-in{width:min(480px,100%);margin:auto}.primary{width:100%;height:48px;border:0;border-radius:16px;background:var(--pine);color:#fff;font-size:16px;font-weight:750}.primary.disabled{background:#aeb8b2;color:#f5f7f5}.help{margin-top:7px;color:var(--ink3);text-align:center;font-size:11px}
    [data-state="idle"] .voice-state,[data-state="idle"] .success{display:none}[data-state="idle"] .textarea .typed{display:none}
    [data-state="recording"] .voice-btn,[data-state="recording"] .success{display:none}[data-state="recording"] .textarea{background:#f8f5ed;color:var(--ink2)}
    [data-state="recording"] .placeholder{display:none}[data-state="recording"] .primary{background:#aeb8b2;color:#f5f7f5}
    [data-state="appended"] .voice-state{display:none}[data-state="appended"] .placeholder{display:none}
    @media(max-width:350px){.page{padding:14px 12px 145px}.brand{height:34px}.head{margin-top:9px}.title{font-size:24px}.time-card{margin-top:14px;padding:13px}.field-head{margin-top:16px}.textarea{min-height:128px;padding:12px 12px 32px}.voice-state{padding:12px}.state-actions{grid-template-columns:1fr 1.45fr}.photo-label,.history{margin-top:16px}.photo{height:70px}.cta{padding-left:12px;padding-right:12px}}
    @media(min-width:421px){.page{padding-left:20px;padding-right:20px}.cta{padding-left:20px;padding-right:20px}}
  </style>
</head>
<body>
  <main class="app" data-state="idle">
    <section class="page">
      <div class="brand"><span class="sprout"><i></i></span>知芽</div>
      <header class="head"><div class="title">一笔一画，都算数</div><button class="child">芽芽⌄</button></header>
      <section class="time-card"><div class="row"><div class="grow"><div class="cap">实际学习时间</div><div class="time">2026-10-01 · 20:18</div></div><button class="small-btn">修改</button></div></section>

      <div class="photo-label">学习照片</div>
      <div class="photo">添加学习照片 · 拍摄或从相册选择</div>

      <div class="field-head">
        <div class="label">学习内容</div>
        <button class="voice-btn" aria-label="使用语音填写学习内容"><span class="mic"></span>语音输入</button>
      </div>
      <section class="textarea" aria-label="学习内容">
        <span class="placeholder">可补充照片里不明显的内容，也可以直接写下今天学了什么。</span>
        <span class="typed">今天练习了乘法分配律。<br />还复习了用分配律进行简便计算。</span>
        <span class="counter"><span class="idle-count">0</span><span class="typed-count">31</span> / 4000</span>
      </section>

      <section class="voice-state" aria-live="polite">
        <div class="state-main"><span class="status-dot"></span><div class="grow"><div class="state-title">正在听 <span class="timer">00:18 / 01:00</span></div><div class="state-sub">说完后停止，本次语音不会自动提交。</div></div></div>
        <div class="state-actions"><button class="cancel">取消</button><button class="stop">停止并转成文字</button></div>
      </section>

      <section class="success" aria-live="polite"><span class="check">✓</span><span>已转成文字，请核对</span><button class="undo">撤回本次</button></section>
      <div class="history">历史记录 <span class="chev">⌄</span></div>
    </section>

    <footer class="cta"><div class="cta-in"><button class="primary">添加照片或文字后继续</button><div class="help">提交后会先生成待确认的草稿，确认后才进入学习档案。</div></div></footer>
  </main>
  <script>
    const allowed = new Set(["idle", "recording", "appended"]);
    const requested = new URLSearchParams(location.search).get("state") || "idle";
    const state = allowed.has(requested) ? requested : "idle";
    const app = document.querySelector(".app");
    app.dataset.state = state;
    const primary = document.querySelector(".primary");
    const idleCount = document.querySelector(".idle-count");
    const typedCount = document.querySelector(".typed-count");
    if (state === "recording") {
      primary.textContent = "请先结束录音";
      primary.classList.add("disabled");
      idleCount.style.display = "none";
    } else if (state === "appended") {
      primary.textContent = "提交整理";
      idleCount.style.display = "none";
    } else {
      typedCount.style.display = "none";
    }
    if (state !== "idle" && window.innerHeight <= 600) {
      requestAnimationFrame(() => {
        document.querySelector(".page").scrollTop = 220;
      });
    }
  </script>
</body>
</html>
