<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知芽 · 六主题设置页</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#28372f;background:#f4f3ef;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer;font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #627f50;outline-offset:4px}.review{max-width:1440px;margin:auto;padding:38px 46px 30px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:1px solid #cdd3c9;padding-bottom:21px}.eyebrow{font-size:12px;letter-spacing:2px;color:#667360}h1{font-size:34px;font-weight:650;letter-spacing:-1px;line-height:1.3;margin:8px 0 10px}.subtitle{font-size:14px;line-height:1.6;margin:0;color:#5a6855}.edition{font-size:13px;line-height:1.8;text-align:right;color:#667360;white-space:nowrap}.toolbar{display:flex;align-items:center;gap:8px;margin:19px 0 25px;flex-wrap:wrap}.mode{border:1px solid #c2ccba;color:#53654a;background:transparent;border-radius:8px;min-height:44px;padding:0 17px;font-size:14px}.mode[aria-pressed="true"]{background:#314c37;color:#fff;border-color:#314c37}.rule{margin-left:auto;color:#65725b;font-size:13px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 26px}.variant{min-width:0}.label{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:650;letter-spacing:-.5px}.number{font-size:12px;width:30px;height:30px;display:grid;place-items:center;border:1px solid #a3af99;border-radius:50%;font-weight:500;letter-spacing:0}.description{margin:8px 0 13px;font-size:13px;color:#68755e;line-height:1.55}.picture{width:100%;border:0;padding:0;display:block;border-radius:20px;overflow:hidden;outline:1px solid #33482a22;background:#fff;box-shadow:0 7px 23px #354a2408}.picture img{width:100%;height:auto;display:block}.variant-foot{min-height:45px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:#64745a}.variant-foot strong{font-weight:550;color:#354b2e}.open{display:inline-flex;align-items:center;min-height:44px;color:#526a43;text-decoration:none;padding:10px 1px;white-space:nowrap}.open:hover{text-decoration:underline}.foot{display:flex;justify-content:space-between;gap:20px;font-size:12px;line-height:1.8;color:#69775f;border-top:1px solid #cdd3c9;margin-top:18px;padding-top:17px}.single{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:390px 1fr;gap:40px;align-items:start}.single-screen{display:block;width:390px;max-width:100%;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px #334c2910;outline:1px solid #33482a22}.single-screen img{display:block;width:100%;height:auto}.single-panel{position:sticky;top:25px}.single-panel h2{font-size:28px;margin:0 0 10px;line-height:1.4}.single-note{color:#68755e;font-size:14px;line-height:1.8}.theme-switches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:23px 0}.theme-choice{min-height:49px;border:1px solid #c3ceba;border-radius:10px;background:#fffdf8;color:#4d6241;font-size:14px;padding:8px 12px;text-align:left}.theme-choice[aria-pressed="true"]{background:#314c37;border-color:#314c37;color:#fff}.fallback-note{padding:16px 18px;border:1px solid #cbd5c2;border-radius:12px;font-size:14px;line-height:1.9;color:#506344;background:#eff3e9}.fallback-note strong{color:#2c462f}.original-link{display:inline-block;min-height:44px;padding:13px 0;color:#526a43;font-size:14px}.hidden{display:none!important}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.review{padding:30px}.single{gap:24px;grid-template-columns:minmax(0,390px) minmax(0,1fr)}.rule{margin-left:0;flex-basis:100%}}@media(max-width:680px){.review{padding:24px 18px}.grid{grid-template-columns:1fr;gap:22px}.head{display:block}.edition{display:none}h1{font-size:28px}.toolbar{margin:17px 0 22px}.single{display:flex;flex-direction:column-reverse;gap:24px}.single-panel{position:static;width:100%}.single-panel h2{font-size:25px}.theme-switches{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:14px 0}.theme-choice{padding:8px 7px;text-align:center;font-size:12px}.single-screen{width:100%}.single-note{margin:4px 0}.fallback-note{font-size:13px;padding:11px 13px}.foot{display:block}.label{font-size:24px}.rule{font-size:12px}.theme-choice{min-height:44px}}
</style>
</head>
<body>
<main class="review">
<header class="head"><div><div class="eyebrow">知芽 / THEME PREVIEW / 05</div><h1>同一页，六种风格。</h1><p class="subtitle">原始 · 成长花园 · 星际探索 · 深海夜色 · 海洋 · 科技</p></div><div class="edition">设置页 / 指定六主题<br>含自定义科目默认图标示例</div></header>
<div class="toolbar"><button class="mode" data-mode="grid" aria-pressed="true">六版对比</button><button class="mode" data-mode="single" aria-pressed="false">单页切换</button><span class="rule">“思维拓展”为自定义示例：无预置 → 使用本主题默认图标</span></div>
<div class="grid" id="grid"></div>
<div class="single hidden" id="single"><a class="single-screen" id="single-link" target="_blank" rel="noopener"><img id="single-image" alt=""></a><aside class="single-panel"><h2 id="single-title"></h2><p class="single-note" id="single-note"></p><div class="theme-switches" id="switches"></div><div class="fallback-note">未知科目统一使用：<strong id="fallback-name"></strong><br>沿用已有预置图标；无预置时直接回退，无需生成或等待。</div><a class="original-link" id="original-link" target="_blank" rel="noopener">打开原分辨率图片 ↗</a><p class="single-note">此处仅切换效果图，未接入小程序主题功能。</p></aside></div>
<footer class="foot"><span>原始风格按现有视觉复绘 · 其余为主题效果图 · 保留原图比例</span><span>六主题名单与回退规则已确认 / 视觉待 review</span></footer>
</main>
<script>
const themes=[
{id:'a',name:'原始风格',note:'暖纸松绿 · 现有视觉复绘',fallback:'线性书本'},
{id:'b',name:'成长花园',note:'纸雕花园 · 嫩芽与种子袋',fallback:'嫩芽'},
{id:'c',name:'星际探索',note:'观测站 · 星球与轨道',fallback:'小星球'},
{id:'d',name:'深海夜色',note:'深蓝灰 · 香槟色 · 安静细线',fallback:'罗盘星'},
{id:'e',name:'海洋风格',note:'浅海蓝 · 小鲸鱼 · 波浪与珊瑚',fallback:'贝壳'},
{id:'f',name:'科技风格',note:'白银青蓝 · 机器人 · 电路模块',fallback:'芯片'}
];
const base='../../snapshots/UI-001/DREV-20261106-UI-CONSISTENCY-05/';
let selected='a';
const imagePath=id=>`${base}style-${id}.png`;
document.querySelector('#grid').innerHTML=themes.map((t,i)=>`<section class="variant"><header><div class="label"><span class="number">${String(i+1).padStart(2,'0')}</span>${t.name}</div><p class="description">${t.note}</p></header><button class="picture" data-preview="${t.id}" aria-label="单独预览${t.name}"><img src="${imagePath(t.id)}" alt="${t.name}设置页，思维拓展使用${t.fallback}默认图标"></button><div class="variant-foot"><span>默认图标：<strong>${t.fallback}</strong></span><a class="open" href="${imagePath(t.id)}" target="_blank" rel="noopener">放大原图 ↗</a></div></section>`).join('');
document.querySelector('#switches').innerHTML=themes.map(t=>`<button class="theme-choice" data-theme="${t.id}" aria-pressed="false">${t.name}</button>`).join('');
function selectTheme(id){const t=themes.find(t=>t.id===id)||themes[0];selected=t.id;document.querySelector('#single-title').textContent=t.name;document.querySelector('#single-note').textContent=t.note;document.querySelector('#fallback-name').textContent=t.fallback;const img=document.querySelector('#single-image');img.src=imagePath(t.id);img.alt=`${t.name}设置页主题预览`;document.querySelector('#single-link').href=imagePath(t.id);document.querySelector('#original-link').href=imagePath(t.id);document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===t.id)));document.body.dataset.selectedTheme=t.id;}
function setMode(mode){const single=mode==='single';document.querySelector('#grid').classList.toggle('hidden',single);document.querySelector('#single').classList.toggle('hidden',!single);document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.body.dataset.mode=mode;if(single)selectTheme(selected);}
document.addEventListener('click',e=>{const m=e.target.closest('button[data-mode]');if(m){setMode(m.dataset.mode);return;}const t=e.target.closest('[data-theme]');if(t){selectTheme(t.dataset.theme);return;}const p=e.target.closest('[data-preview]');if(p){selected=p.dataset.preview;setMode('single');window.scrollTo({top:0,behavior:'instant'});}});
const query=new URLSearchParams(location.search);selected=themes.some(t=>t.id===query.get('theme'))?query.get('theme'):'a';setMode(query.get('mode')==='single'?'single':'grid');
window.THEME_PREVIEWS=themes;window.DESIGN_READY=true;
</script>
</body>
</html>
