<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复习条目 · 改版效果图</title>
  <style>
    :root { color-scheme: light; --canvas:#faf7f0; --paper:#fffdf8; --ink:#22261f; --muted:#79826f; --line:#ebe5d7; --green:#1f5b45; --tint:#e4ede6; }
    * { box-sizing:border-box; }
    body { margin:0; padding:28px 20px 48px; background:var(--canvas); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
    main { max-width:1080px; margin:auto; }
    h1 { margin:0 0 4px; font:600 28px/1.25 "Songti SC",serif; }
    p { margin:0 0 16px; color:var(--muted); }
    .controls { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 22px; }
    button { min-height:44px; padding:8px 16px; border:1px solid var(--line); border-radius:12px; background:var(--paper); color:var(--ink); font:inherit; cursor:pointer; }
    button[aria-pressed="true"] { border-color:var(--green); background:var(--tint); color:var(--green); font-weight:600; }
    button:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
    .group-label { flex-basis:100%; margin:8px 0 0; color:var(--muted); font-size:13px; }
    .stage { display:grid; grid-template-columns:minmax(320px,1fr) minmax(220px,330px); gap:32px; align-items:start; }
    .phone { width:max-content; max-width:100%; margin:0; border-radius:28px; background:var(--paper); box-shadow:0 16px 48px rgba(34,38,31,.13); overflow:hidden; }
    .phone img { display:block; max-width:100%; height:auto; }
    aside { padding:20px; border:1px solid var(--line); border-radius:20px; background:var(--paper); }
    aside h2 { margin:0 0 12px; font:600 20px/1.35 "Songti SC",serif; }
    aside ul { margin:0; padding-left:1.2em; }
    aside li { margin:0 0 10px; }
    .small { margin:18px 0 0; font-size:13px; }
    @media(max-width:740px) { body{padding:18px 12px 32px}.stage{display:block}.phone{margin:auto}aside{margin:20px auto 0;max-width:430px} }
  </style>
</head>
<body>
  <main>
    <h1>复习条目 · 改版候选</h1>
    <p>纸芽视觉基线下的清单式设计。选择状态和视口查看效果；内容均为合成示例。</p>
    <nav class="controls" aria-label="预览状态和视口">
      <span class="group-label">页面状态</span>
      <button data-state="time" aria-pressed="true">按时间</button>
      <button data-state="subject" aria-pressed="false">按科目</button>
      <button data-state="count" aria-pressed="false">按次数</button>
      <button data-state="actions" aria-pressed="false">打开“…”菜单</button>
      <span class="group-label">手机尺寸</span>
      <button data-width="320" aria-pressed="false">320 × 568</button>
      <button data-width="390" aria-pressed="true">390 × 844</button>
      <button data-width="430" aria-pressed="false">430 × 932</button>
    </nav>
    <div class="stage">
      <figure class="phone"><img id="screen" width="390" height="844" src="time-390x844.svg" alt="复习条目按时间效果图"></figure>
      <aside>
        <h2>这版主要变化</h2>
        <ul>
          <li>原生导航已显示“复习条目”，页面内不再重复大标题。</li>
          <li>筛选保持一层；科目和次数改为一个清晰的选择入口。</li>
          <li>同科知识放在同一张清单里，条目靠分隔线区分。</li>
          <li>每项保留次数、最近复习、建议日期和当前状态；“…”保留既有操作。</li>
        </ul>
        <p class="small">这只是待审阅设计，不会查询或修改孩子的学习记录。选择器展开、删除确认等后续状态会在方向确认后补齐。</p>
      </aside>
    </div>
  </main>
  <script>
    const sizes = {320:568,390:844,430:932};
    let state = "time";
    let width = 390;
    const screen = document.getElementById("screen");
    document.querySelectorAll("button[data-state],button[data-width]").forEach(button => {
      button.addEventListener("click", () => {
        if (button.dataset.state) state = button.dataset.state;
        if (button.dataset.width) width = Number(button.dataset.width);
        document.querySelectorAll("button[data-state]").forEach(item => item.setAttribute("aria-pressed", String(item.dataset.state === state)));
        document.querySelectorAll("button[data-width]").forEach(item => item.setAttribute("aria-pressed", String(Number(item.dataset.width) === width)));
        screen.src = `${state}-${width}x${sizes[width]}.svg`;
        screen.width = width;
        screen.height = sizes[width];
        screen.alt = `复习条目${button.dataset.state || state}状态，${width}像素宽效果图`;
      });
    });
  </script>
</body>
</html>
