<title>知芽 · 记录入口与孩子选择</title>
<style>
:root{--paper:#FAF7F0;--surface:#FFFDF8;--ink:#22261F;--muted:#59624F;--green:#1F5B45;--wash:#E4EDE6;--line:#E2DCCC;--recess:#F3EFE4}

z-index:2}.nav button{flex:1;max-width:96px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:#6D7662;padding:4px 0;font-size:14px}.nav .active{color:var(--green);font-weight:600}
</style>
<style>
.heading{flex-wrap:wrap}.child-chip{max-width:100%;margin-left:auto}
.photo{min-height:160px;padding:12px 16px 16px;border:1.5px dashed #38826A5C;background:linear-gradient(160deg,#E4EDE6B3,#FFFDF8B3);border-radius:16px;font-weight:500;line-height:1.4}.photo:active{background:var(--wash)}.upload-art{width:140px;height:95px;object-fit:contain;pointer-events:none}
.travel-upload{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;min-height:48px;margin:20px 0 0}
.record-type{position:relative;flex:none}.record-type.open{z-index:4}.title[aria-expanded=true]>.icon{transform:rotate(180deg)}
.menu-dismiss{position:fixed;inset:0;z-index:3;background:transparent}
.type-menu{position:absolute;left:0;top:calc(100% + 8px);width:200px;max-width:calc(100vw - 32px);padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 8px 24px #22261F18;z-index:4}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;border-radius:8px;text-align:left;font-size:14px}.choice+.choice{margin-top:4px}.choice span{flex:1}.choice[aria-checked=true]{background:var(--wash);color:var(--green)}.choice .check{visibility:hidden}.choice[aria-checked=true] .check{visibility:visible}
</style>

 const menu=`<div class="type-menu" id="record-types" role="menu" aria-label="记录类型">${[['learning','book','学习记录'],['travel','camera','旅行日记']].map(([type,i,label])=>`<button class="choice" role="menuitemradio" tabindex="-1" data-type="${type}" aria-checked="${model.type===type}">${icon(i)}<span>${label}</span>${icon('check','check')}</button>`).join('')}</div>`;
 const heading=`<div class="heading"><div class="record-type ${model.menu?'open':''}"><button id="record-title" class="title" aria-haspopup="menu" aria-controls="record-types" aria-expanded="${model.menu}"><span>${model.type==='travel'?'旅行日记':'学习记录'}</span>${icon('down')}</button>${model.menu?menu:''}</div>${child}</div>`;
 const travel=`<section id="travel"><div class="subhead"><h1>${name}的足迹</h1></div><div class="muted">0 个地点　0 座城市　0 个国家　0 张照片</div><div class="segments"><button class="selected">时间线</button><button>轨迹回放</button><button>地图点亮</button></div><button class="link">查看待整理照片</button><div class="empty">${icon('pin')}<h2>还没有出游足迹</h2><p>把照片里的回忆留下来</p></div><button class="primary travel-upload" aria-label="导入照片">${icon('camera')}<span>导入照片</span></button></section>`;
 const learning=`<section id="learning"><div class="time-card">${icon('clock')}<div><span class="muted">实际学习时间</span><strong>10月24日 · 11:10</strong></div><button>修改</button></div><h2>学习照片</h2><button class="photo"><img class="upload-art" src="${uploadArt}" alt="" aria-hidden="true"><span>添加学习照片</span></button><label class="field">学习内容<textarea id="learning-text" placeholder="写下今天学了什么…"></textarea></label><button class="primary submit">提交整理</button></section>`;
 const today=`<h1 class="today-title">今天，也慢慢来</h1><section class="hero"><h1>今天没有安排复习</h1><p>有新的学习内容，可以随手记下来。</p><button id="record-learning" class="primary">${icon('camera')}<span>记录学习</span></button></section>`;
 const tabs=[['today','sprout','今日'],['calendar','calendar','日程'],['records','camera','记录'],['reports','chart','报表'],['settings','settings','设置']];
 const nav=`<nav class="nav" aria-label="主导航">${tabs.map(([route,i,label])=>`<button data-route="${route}" class="${model.route===route?'active':''}" ${model.route===route?'aria-current="page"':''}>${icon(i)}<span>${label}</span></button>`).join('')}</nav>`;
 document.querySelector('#app').innerHTML=`<div class="brand">${icon('sprout')}<span>知芽</span></div><main>${model.route==='today'?today:heading+(model.type==='travel'?travel:learning)}</main>${nav}${model.menu?'<div class="menu-dismiss" aria-hidden="true"></div>':''}`;
 const text=document.querySelector('#learning-text');if(text){text.value=model.text;text.oninput=()=>{model.text=text.value;};}
 const select=document.querySelector('select');if(select)select.onchange=()=>{model.name=select.value;render();};
 document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{model.type=b.dataset.type;closeTypes();});
 document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{if(!['today','records'].includes(b.dataset.route))return;model.route=b.dataset.route;model.entry='tab';model.menu=false;render();window.scrollTo(0,0);});
 const title=document.querySelector('#record-title');if(title)title.onclick=()=>{if(model.menu)return closeTypes();model.menu=true;render();document.querySelector('[aria-checked="true"]').focus();};
 const dismiss=document.querySelector('.menu-dismiss');if(dismiss)dismiss.onclick=closeTypes;
 const entry=document.querySelector('#record-learning');if(entry)entry.onclick=()=>{model.type='learning';model.route='records';model.entry='learning';render();window.scrollTo(0,0);};
}
function closeTypes(){model.menu=false;render();document.querySelector('#record-title').focus({preventScroll:true});}
document.addEventListener('keydown',e=>{if(!model.menu)return;const controls=[...document.querySelectorAll('.type-menu button')];if(e.key==='Escape'){e.preventDefault();closeTypes();}else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const current=controls.indexOf(document.activeElement);const index=e.key==='Home'?0:e.key==='End'?controls.length-1:(current+(e.key==='ArrowDown'?1:-1)+controls.length)%controls.length;controls[index].focus();}else if(e.key==='Tab'){e.preventDefault();closeTypes();if(!e.shiftKey)document.querySelector('.child-chip select').focus();}});
window.addEventListener('scroll',()=>{if(model.menu)closeTypes();},{passive:true});
render();
</script>
</html>
