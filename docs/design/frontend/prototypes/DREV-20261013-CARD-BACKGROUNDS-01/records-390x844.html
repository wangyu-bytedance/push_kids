/* 全局纸面：暖白底 + 两层极淡光斑，模拟纸张受光；不使用图片，零包体成本 */
.page-root {
  min-height: 100%;
  background-color: var(--pk-canvas);
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 62%),
    radial-gradient(90% 50% at 100% 100%, rgba(127, 166, 92, .07), rgba(127, 166, 92, 0) 70%);
  background-repeat: no-repeat;
  color: var(--pk-ink);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  font-family: var(--pk-sans);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}

/* 页面外壳：左右安全边距 18px，底部预留 TabBar + 安全区 */
.page { width: 100%; max-width: 499.200px; margin: 0 auto; box-sizing: border-box; padding: 12.480px var(--pk-gutter) calc(78.000px + 0px); overflow-x: hidden; }
.page.sticky-cta { padding-bottom: calc(112.320px + 0px); }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12.480px; margin: 10.400px 0 14.560px; }
.eyebrow { display: block; color: var(--pk-primary-mid); font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 1.040px; }
.title { display: block; margin-top: 4.160px; font-family: var(--pk-serif); font-size: 24px; line-height: 1.28; font-weight: 600; letter-spacing: .4px; }
.section-title { display: block; margin: var(--pk-s6) 0 var(--pk-s3); font-family: var(--pk-serif); font-size: 17px; line-height: 1.45; font-weight: 600; letter-spacing: .4px; }
.muted { color: var(--pk-ink-3); }
.small { font-size: 13px; line-height: 1.55; }

/* 卡片：纸描边 + 近乎无感的落影 */
.card { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); padding: var(--pk-s4); margin-bottom: var(--pk-s3); box-shadow: var(--pk-e0); box-sizing: border-box; }
.card.flat { background: var(--pk-surface-warm); box-shadow: none; }
.card.tight { padding: 13.520px 14.560px; }
.hero { position: relative; overflow: hidden; background-color: #F7F4EA; background-image: radial-gradient(120% 130% at 100% 0%, rgba(127, 166, 92, .16), rgba(127, 166, 92, 0) 58%); border: var(--pk-border); border-radius: var(--pk-r-2xl); padding: 20.800px 18.720px 18.720px; box-shadow: var(--pk-e2); box-sizing: border-box; }
.hero-number { font-family: var(--pk-serif); font-size: 28px; line-height: 1.1; font-weight: 600; color: var(--pk-primary); font-variant-numeric: tabular-nums; }
.hero-copy { margin: 7.280px 0 16.640px; color: var(--pk-ink-3); font-size: 13px; line-height: 1.65; }

.row { display: flex; align-items: center; gap: 8.320px; }
.row.top { align-items: flex-start; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* 按钮：主 48px 胶囊，卡内 36px */
.button { box-sizing: border-box; min-height: var(--pk-cta-h); margin: 0; border: none; border-radius: var(--pk-r-pill); padding: 0 18.720px; background: var(--pk-primary); color: var(--pk-ink-inv); font-size: 16px; line-height: 1.2; font-weight: 500; letter-spacing: .4px; display: flex; align-items: center; justify-content: center; gap: 8.320px; box-shadow: var(--pk-e-btn); transition: transform var(--pk-dur-fast) var(--pk-ease), background var(--pk-dur-fast) var(--pk-ease); }
.button::after { border: none; }
.button:active { transform: scale(.98); }
.button.secondary { background: var(--pk-primary-tint); color: var(--pk-primary-strong); box-shadow: none; }
.button.ghost { background: transparent; color: var(--pk-primary); border: var(--pk-border-primary); box-shadow: none; }
.button.neutral { background: var(--pk-surface); color: var(--pk-ink); border: 0.520px solid var(--pk-line-strong); box-shadow: var(--pk-e1); }
.button.compact { min-height: var(--pk-btn-sm); padding: 0 15.600px; font-size: 14px; box-shadow: none; }
.button.danger { background: var(--pk-danger-bg); color: var(--pk-danger); box-shadow: none; }
.button.is-disabled, .button[disabled] { background: var(--pk-surface-sunken); color: var(--pk-ink-4); border-color: transparent; box-shadow: none; }
.action-row { display: grid; grid-template-columns: minmax(0, 1fr); width: 100%; box-sizing: border-box; gap: 10.400px; }
.action-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.action-row > .button { width: 100%; min-width: 0; max-width: none; margin-left: 0; margin-right: 0; justify-self: stretch; }

.pill { display: inline-flex; align-items: center; gap: 4.160px; min-height: 22.880px; padding: 0 9.360px; border-radius: var(--pk-r-pill); background: var(--pk-primary-tint); color: var(--pk-primary-strong); font-size: 11px; font-weight: 500; letter-spacing: .2px; }
.pill.warm { background: var(--pk-attention-bg); color: var(--pk-attention); }

.notice { display: flex; align-items: center; gap: 9.360px; padding: 11.440px 13.520px; box-sizing: border-box; border-radius: var(--pk-r-lg); background: var(--pk-attention-bg); border: 0.520px solid var(--pk-attention-line); color: var(--pk-ink-2); font-size: 13px; line-height: 1.6; margin-bottom: var(--pk-s3); }
.notice.error { background: var(--pk-danger-bg); border-color: var(--pk-danger-line); }
.notice.ai { background-color: #EDF2E6; border: 0.520px dashed rgba(56, 130, 106, .4); color: var(--pk-primary-strong); }
.notice.quiet { background: var(--pk-surface-warm); border-color: var(--pk-line); color: var(--pk-ink-2); }

.empty { text-align: center; padding: 37.440px 24.960px; }
.empty-mark { width: 70.720px; height: 70.720px; margin: 0 auto 14.560px; border-radius: 22.880px; background-color: var(--pk-primary-tint); background-image: radial-gradient(circle at 30% 25%, rgba(127, 166, 92, .35), rgba(127, 166, 92, 0) 70%); color: var(--pk-primary); display: flex; align-items: center; justify-content: center; }
.empty-title { display: block; font-family: var(--pk-serif); font-size: 17px; line-height: 1.45; font-weight: 600; }
.empty-copy { display: block; margin: 7.280px auto 0; max-width: 270.400px; font-size: 13px; line-height: 1.75; color: var(--pk-ink-3); }

.skeleton { height: 120.640px; border-radius: var(--pk-r-xl); margin-bottom: 10.400px; background: linear-gradient(100deg, rgba(34, 38, 31, .055) 30%, rgba(34, 38, 31, .02) 50%, rgba(34, 38, 31, .055) 70%); background-size: 300% 100%; animation: pulse 1.5s linear infinite; }
@keyframes pulse { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

.field { margin-bottom: 14.560px; }
.label { display: block; margin-bottom: 6.240px; color: var(--pk-ink-2); font-size: 13px; font-weight: 500; }
.input, .textarea, .picker { box-sizing: border-box; width: 100%; min-height: 47.840px; padding: 12.480px 14.560px; border-radius: var(--pk-r-md); border: 0.520px solid var(--pk-line-strong); background: var(--pk-surface-raised); font-size: 15px; line-height: 1.5; color: var(--pk-ink); }
.textarea { min-height: 108.160px; line-height: 1.7; }
.divider { height: 0.520px; background: var(--pk-line); margin: var(--pk-s3) 0; }

.metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10.400px; }
.metric-value { display: block; font-family: var(--pk-serif); font-size: 30px; line-height: 1.05; font-weight: 600; font-variant-numeric: tabular-nums; }

.timeline { border-left: 0.520px solid var(--pk-line-strong); margin-left: 6.240px; padding-left: 16.640px; }
.timeline-item { position: relative; margin-bottom: 12.480px; }
.timeline-item::before { content: ""; position: absolute; width: 6.240px; height: 6.240px; border-radius: 50%; background: var(--pk-surface); left: -20.280px; top: 9.360px; border: 2.600px solid var(--pk-primary-mid); box-sizing: content-box; }

.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8.320px; }
.photo { width: 100%; height: 108.160px; border-radius: var(--pk-r-md); object-fit: cover; }
.safe-bottom { height: calc(20.800px + 0px); }

.compact-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12.480px; }
.child-trigger { box-sizing: border-box; min-height: 37.440px; display: flex; align-items: center; gap: 6.240px; padding: 0 10.400px 0 4.160px; border: var(--pk-border-line); border-radius: var(--pk-r-pill); background: var(--pk-surface); box-shadow: var(--pk-e1); font-size: 13px; line-height: 1.4; font-weight: 500; color: var(--pk-ink-2); }
.avatar-small { flex: none; width: 29.120px; height: 29.120px; line-height: 29.120px; text-align: center; border-radius: 50%; background-color: var(--pk-primary-tint); background-image: linear-gradient(150deg, rgba(127, 166, 92, .3), rgba(56, 130, 106, .12)); color: var(--pk-primary-strong); font-family: var(--pk-serif); font-size: 13px; font-weight: 600; }
.chevron { width: 7.280px; height: 7.280px; border-right: 1.560px solid var(--pk-ink-4); border-bottom: 1.560px solid var(--pk-ink-4); transform: rotate(45deg) translateY(-2.080px); transition: transform var(--pk-dur-base) var(--pk-ease); }
.chevron.up { transform: rotate(225deg) translate(-1.040px, -1.040px); }

.sheet-mask { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 20; background: rgba(24, 28, 20, .42); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 85vh; overflow: auto; box-sizing: border-box; padding: 8.320px var(--pk-gutter) calc(14.560px + 0px); border-radius: var(--pk-r-2xl) var(--pk-r-2xl) 0 0; background: var(--pk-canvas); box-shadow: var(--pk-e-sheet); }
.sheet-handle { width: 39.520px; height: 4.160px; margin: 0 auto 12.480px; border-radius: 2.080px; background: var(--pk-line-strong); }

.icon-button { display: flex; align-items: center; justify-content: center; flex: 0 0 37.440px; width: 37.440px; max-width: 37.440px; height: 37.440px; min-height: 37.440px; margin: 0; padding: 0; border: var(--pk-border-line); border-radius: 50%; background: var(--pk-surface); box-sizing: border-box; overflow: hidden; }
.icon-button::after { border: 0; }

.segmented { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3.120px; margin: 10.400px 0 16.640px; border-radius: var(--pk-r-pill); background: rgba(34, 38, 31, .05); box-sizing: border-box; }
.segmented button { display: flex; align-items: center; justify-content: center; width: 100%; min-width: 0; min-height: 37.440px; margin: 0; padding: 0; border: 0; border-radius: var(--pk-r-pill); background: transparent; color: var(--pk-ink-3); font-size: 14px; line-height: 1.2; font-weight: 400; box-sizing: border-box; transition: background var(--pk-dur-base) var(--pk-ease), color var(--pk-dur-base) var(--pk-ease); }
.segmented button::after { border: 0; }
.segmented button.active { background: var(--pk-surface-raised); color: var(--pk-primary-strong); font-weight: 500; box-shadow: var(--pk-e1); }

.repeat-row { min-height: 47.840px; margin-bottom: 14.560px; border-top: var(--pk-border-soft); border-bottom: var(--pk-border-soft); }
.time-separator { margin-top: 16.640px; color: var(--pk-ink-3); }

.screen-intro { margin: 8.320px 0 20.800px; }
.screen-kicker { display: block; color: var(--pk-primary-mid); font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 1.040px; }
.screen-heading { display: block; margin-top: 4.160px; color: var(--pk-ink); font-family: var(--pk-serif); font-size: 24px; line-height: 1.28; font-weight: 600; letter-spacing: .4px; }
.content-card { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); padding: var(--pk-s4); box-shadow: var(--pk-e0); box-sizing: border-box; }
.quiet-link { display: flex; align-items: center; justify-content: center; gap: 4.160px; min-height: 45.760px; margin: 0; padding: 0; background: transparent; color: var(--pk-primary); font-size: 13px; font-weight: 500; }
.quiet-link::after { border: 0; }

.ui-icon { display: block; width: 21.840px; height: 21.840px; flex: none; }
.ui-icon.large { width: 24.960px; height: 24.960px; }
.ui-icon.family { width: 29.120px; height: 29.120px; }
.ui-chevron { display: block; flex: none; width: 7.280px; height: 7.280px; border-top: 1.560px solid currentColor; border-right: 1.560px solid currentColor; box-sizing: border-box; }
.ui-chevron.right { transform: rotate(45deg); }
.ui-chevron.left { transform: rotate(-135deg); }
.ui-chevron.down { transform: rotate(135deg); }
.ui-plus { position: relative; display: block; flex: none; width: 18.720px; height: 18.720px; }
.ui-plus::before, .ui-plus::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14.560px; height: 1.560px; border-radius: 1.560px; background: currentColor; transform: translate(-50%, -50%); }
.ui-plus::after { transform: translate(-50%, -50%) rotate(90deg); }
.ui-close { position: relative; display: block; width: 16.640px; height: 16.640px; }
.ui-close::before, .ui-close::after { content: ""; position: absolute; left: 50%; top: 50%; width: 13.000px; height: 1.560px; border-radius: 1.560px; background: currentColor; transform: translate(-50%, -50%) rotate(45deg); }
.ui-close::after { transform: translate(-50%, -50%) rotate(-45deg); }

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:flex-start;height:calc(56.160px + 0px);padding:7.280px 2.080px 0px;border-top:0.520px solid rgba(34,38,31,.06);background:rgba(255,253,248,.92);backdrop-filter:blur(18px);box-shadow:0 -6.240px 20.800px -12.480px rgba(34,38,31,.3);color:#8E9686;box-sizing:border-box}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;flex:1;min-width:0;height:45.760px;gap:3.120px}
.tab.active{color:#14402F}
.icon-slot{position:relative;display:flex;align-items:center;justify-content:center;width:29.120px;height:24.960px}
.icon-slot::before{content:"";position:absolute;left:50%;top:50%;width:29.120px;height:29.120px;margin:-14.560px 0 0 -14.560px;border-radius:50%;background:#E4EDE6;opacity:0;transform:scale(.6);transition:opacity 240ms cubic-bezier(.22,.75,.24,1),transform 240ms cubic-bezier(.34,1.42,.5,1)}
.tab.active .icon-slot::before{opacity:1;transform:scale(1)}
.tab-icon{position:relative;display:block;width:20.800px;height:20.800px}
.tab-label{font-size:10px;line-height:1.2;font-weight:500;letter-spacing:0.260px}
.tab.active .tab-label{font-weight:600}
/* 中央凸起「记录」键：全局唯一的高饱和触点，让「记下今天学到的」永远一键可达 */
.tab.is-center{justify-content:flex-start}
.tab.is-center .key{position:relative;display:flex;align-items:center;justify-content:center;width:54.080px;height:54.080px;margin-top:-23.920px;border-radius:50%;background:linear-gradient(150deg,#38826A,#14402F);border:3.120px solid rgba(255,253,248,.94);box-sizing:border-box;box-shadow:0 10.400px 22.880px -8.320px rgba(31,91,69,.66)}
.tab.is-center .key-icon{width:23.920px;height:23.920px}
.tab.is-center .tab-label{margin-top:1.040px;color:#14402F;font-weight:600}
.tab.is-center:active .key{transform:scale(.94)}
.tab-badge{position:absolute;left:15.600px;top:-2.080px;min-width:15.600px;height:15.600px;padding:0 3.640px;border-radius:7.800px;background:#A9762A;color:#FFFDF8;font-size:10px;font-weight:600;line-height:15.600px;text-align:center;box-sizing:border-box;box-shadow:0 0 0 2.080px rgba(255,253,248,.95)}
.tab-badge.on-key{left:auto;right:-1.040px;top:-1.040px}

/* PKDS-2.0 · TodoCard：左侧主色轨表达「必做 / 有余力」，反馈面板内嵌在卡内，
   每个选项都先写清后果（复习日期由服务端确定性策略产生，文案与策略一一对应）。 */
.todo { position: relative; overflow: hidden; padding: 15.600px 15.600px 11.440px 17.680px; box-sizing: border-box; background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); box-shadow: var(--pk-e0); }
.todo .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 4.160px; background: linear-gradient(180deg, var(--pk-primary-mid), var(--pk-primary)); }
.todo.opt { background: var(--pk-surface-warm); box-shadow: none; }
.todo.opt .rail { background: repeating-linear-gradient(180deg, var(--pk-sprout) 0 9.360px, rgba(127, 166, 92, .25) 9.360px 15.600px); }

.todo-top { display: flex; align-items: flex-start; gap: 10.400px; }
.todo-top .grow { flex: 1; min-width: 0; }
.todo-top .pill { flex: none; margin-top: 2.080px; }
.todo-title { display: block; font-size: 16px; line-height: 1.4; font-weight: 600; letter-spacing: .2px; }
.todo-meta { display: block; margin-top: 3.120px; font-size: 12px; line-height: 1.5; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }

.todo-points { margin-top: 6.240px; }
.pt-row { display: flex; align-items: center; gap: 8.320px; min-height: 58.240px; padding: 6.240px 0; box-sizing: border-box; }
.todo-pt + .todo-pt { border-top: var(--pk-border-soft); }
.pt-dot { flex: none; width: 18.720px; height: 18.720px; border-radius: 50%; border: 1.040px solid var(--pk-line-strong); background: var(--pk-surface-raised); box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
.pt-dot.on { background: var(--pk-primary); border-color: var(--pk-primary); }
.pt-main { flex: 1; min-width: 0; }
.pt-n { display: block; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.pt-n.is-done { color: var(--pk-ink-3); }
.pt-summary { display: -webkit-box; margin-top: 4.160px; overflow: hidden; color: var(--pk-ink-3); font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.source-link { display: inline-flex; position: relative; align-items: center; gap: 4.160px; min-height: 33.280px; margin-top: 2.080px; color: var(--pk-primary); font-size: 12px; font-weight: 500; }
.source-link::after { content: ""; position: absolute; left: -6.240px; right: -6.240px; top: -6.240px; bottom: -6.240px; }
.pt-done { flex: none; display: inline-flex; align-items: center; gap: 5.200px; font-size: 12px; font-weight: 500; color: var(--pk-primary); }
.act-done-hit { flex: none; min-height: 45.760px; display: flex; align-items: center; }
.btn.sm.act-done { width: auto; height: 33.280px; min-height: 33.280px; padding-top: 0; padding-bottom: 0; line-height: 33.280px; }
/* 视觉 32×32，热区用伪元素撑到 45.760px，兼顾规格与触控下限。 */
.act-more { position: relative; flex: none; box-sizing: border-box; width: 33.280px; height: 33.280px; border: var(--pk-border-line); border-radius: var(--pk-r-sm); background: var(--pk-surface); display: flex; align-items: center; justify-content: center; transition: background var(--pk-dur-fast) var(--pk-ease); }
.act-more::after { content: ""; position: absolute; left: -6.240px; right: -6.240px; top: -6.240px; bottom: -6.240px; }
.act-more.on { background: var(--pk-primary-tint); border-color: var(--pk-primary-hairline); }

/* 反馈面板：不使用系统 ActionSheet，选项与它影响的复习安排写在同一屏。 */
.fb-panel { margin: 2.080px 0 10.400px 27.040px; padding: 10.400px 11.440px 4.160px; border-radius: var(--pk-r-md); background: var(--pk-surface-warm); border: var(--pk-border-line); animation: fb-in var(--pk-dur-base) var(--pk-ease) both; }
@keyframes fb-in { from { opacity: 0; transform: translateY(-4.160px); } to { opacity: 1; transform: none; } }
.fb-hd { display: block; padding-bottom: 4.160px; font-size: 11px; line-height: 1.4; color: var(--pk-ink-4); letter-spacing: .4px; }
.fb { display: flex; align-items: center; gap: 8.320px; min-height: 49.920px; }
.fb + .fb { border-top: var(--pk-border-soft); }
.fb .grow { flex: 1; min-width: 0; }
.fb .fb-t { display: block; font-size: 14px; line-height: 1.4; font-weight: 500; }
.fb .fb-s { display: block; margin-top: 2.080px; font-size: 11px; line-height: 1.5; color: var(--pk-ink-3); }
.fb-cancel { min-height: 45.760px; display: flex; align-items: center; justify-content: center; border-top: var(--pk-border-soft); font-size: 13px; color: var(--pk-ink-3); }
.fb-delete { border-top: var(--pk-border-line); margin-top: 4.160px; min-height: 44px; }
.fb-delete .fb-s { font-size: 13px; }

/* 五个一级 Tab 共用的品牌导航。胶囊和状态栏几何由组件运行时测量，页面不复制平台常量。 */
:host { display: block; }
.primary-nav-spacer { width: 100%; }
.primary-nav {
  position: fixed; z-index: 30; left: 0; top: 0; right: 0;
  box-sizing: border-box; background: var(--pk-canvas);
}
.primary-nav-row {
  width: 100%; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center;
}
.primary-nav-brand {
  min-width: 0; max-width: 100%; display: inline-flex; align-items: center; justify-content: center;
  gap: 6.240px; white-space: nowrap; color: var(--pk-ink);
}
.primary-nav-mark { flex: none; }
.primary-nav-title {
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--pk-sans); font-size: 16px; line-height: 1.4; font-weight: 600; letter-spacing: 0.520px;
}

/* 记录（D1~D6）：只写本页特有几何，其余全部复用 tokens / atoms / icons。 */
.record-page { padding-bottom: var(--pk-s6); }
.record-page.sticky-cta { padding-bottom: calc(195.520px + 0px); }

/* 记录页是原生 Tab 页：固定主操作需同时避开 TabBar 和中央凸起按钮。 */
.record-cta {
  bottom: calc(var(--pk-tabbar-h) + var(--pk-s4) + 0px);
  padding-bottom: var(--pk-s3);
}

.record-intro { display: flex; align-items: center; gap: 8.320px; margin-top: 6.240px; padding: 16.640px 14.560px; }
.record-intro-copy { position: relative; z-index: 1; flex: 1; min-width: 0; }
.record-intro .pg-title { display: block; overflow-wrap: anywhere; }
.record-intro picker { margin-top: 10.400px; }
.record-intro .child-chip { max-width: 100%; min-height: 44px; box-sizing: border-box; }
.record-intro .child-chip .chip-nm { min-width: 0; max-width: 104.000px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.record-intro-art { position: relative; flex: none; width: 124.800px; height: 124.800px; pointer-events: none; }
.child-chip.single { padding-right: 14.560px; }

/* 两行文案的提示条（错误态需要标题 + 说明） */
.pk-notice .n-txt .n-t { display: block; font-size: 14px; font-weight: 600; line-height: 1.45; }
.pk-notice .n-txt .n-c { display: block; margin-top: 2.080px; font-size: 13px; font-weight: 400; line-height: 1.5; opacity: .82; }

/* 实际学习时间卡 */
.time-card .time-val { display: block; margin-top: 2.080px; font-size: 15px; font-weight: 600; color: var(--pk-ink); }
.time-card .btn.sm { flex: none; }

/* 字段标题行 */
.field-head { margin: var(--pk-s4) 0 var(--pk-s2); }
.add-photo-tile { width: 100%; height: auto; min-height: 166.400px; padding: 8.320px 12.480px 14.560px; }
.record-upload-art { flex: none; width: 145.600px; height: 98.800px; pointer-events: none; }

/* 文字记录输入区 */
.voice-input-shell { position: relative; min-height: 95.680px; }
.text-input { height: 95.680px; min-height: 95.680px; padding: 11.440px 58.240px 30.160px 12.480px; }
.text-counter { position: absolute; left: 12.480px; bottom: 9.360px; z-index: 2; }
.voice-touch { position: absolute; right: 4.160px; bottom: 2.080px; z-index: 4; display: flex; align-items: center; justify-content: center; width: 45.760px; height: 45.760px; }
.voice-touch.is-disabled { opacity: .48; }
.voice-face { display: flex; align-items: center; justify-content: center; width: 37.440px; height: 37.440px; border-radius: 50%; background: var(--pk-primary-tint); border: var(--pk-border-primary); }
.voice-status { position: absolute; top: 0.520px; right: 0.520px; bottom: 0.520px; left: 0.520px; z-index: 3; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 12.480px 54.080px 12.480px 12.480px; border-radius: var(--pk-r-md); background: rgba(228, 237, 230, .96); color: var(--pk-primary-strong); font-size: 15px; font-weight: 500; pointer-events: none; }
.state-cancel_armed .voice-status { background: rgba(247, 232, 226, .97); color: var(--pk-danger); }
.state-recognizing .voice-status, .state-requesting_permission .voice-status { background: rgba(253, 251, 245, .97); color: var(--pk-ink-2); }
.voice-overflow { margin-top: var(--pk-s2); padding: var(--pk-s3); border: 0.520px solid var(--pk-attention-line); border-radius: var(--pk-r-md); background: var(--pk-attention-bg); }
.overflow-help { display: block; margin-top: 2.080px; }
.overflow-input { height: 93.600px; min-height: 93.600px; margin-top: var(--pk-s2); background: var(--pk-surface); }
.help.center { display: block; margin-top: var(--pk-s2); text-align: center; }
.submit-row { display: block; }
.submit-row > .btn { width: 100%; }
