<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>settings @430</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
view, scroll-view, swiper, swiper-item, picker, cover-view, navigator, form, slider, progress { display: block; }
text, icon { display: inline; }
swiper { overflow: hidden; }
slider { height: 44px; background: linear-gradient(var(--pk-line-strong), var(--pk-line-strong)) center/100% 4px no-repeat; }
body { width: 430px; }
.page-root { position: relative; width: 430px; min-height: 100vh; display: block; }
button, input, textarea { font: inherit; color: inherit; border: 0; background: none; outline: none; resize: none; }
/* 知芽 Push Kids · PKDS-2.0「纸 · 芽」design tokens
   设计语言：暖白纸面 + 松绿主色 + 嫩芽成长色；低对比大扩散阴影，像纸叠在纸上。
   单位约定：颜色语义 token 无单位；几何量 rpx（= px@375 × 2）；字号 px；发丝线固定 0.573px。 */

.page-root {
  /* ---------------- 纸面 ---------------- */
  --pk-canvas: #FAF7F0;
  --pk-canvas-deep: #F3EFE4;
  --pk-surface: #FFFDF8;
  --pk-surface-raised: #FFFFFF;
  --pk-surface-warm: #FDFBF5;
  --pk-surface-sunken: #F3EFE4;

  /* ---------------- 松绿（确定、可信） ---------------- */
  --pk-primary: #1F5B45;
  --pk-primary-strong: #14402F;
  --pk-primary-pressed: #103527;
  --pk-primary-mid: #38826A;
  --pk-primary-tint: #E4EDE6;
  --pk-primary-tint-2: #D2E1D6;
  --pk-primary-wash: #F0F5F0;
  --pk-primary-hairline: #C3D8CA;

  /* ---------------- 嫩芽（成长、可选项） ---------------- */
  --pk-sprout: #7FA65C;
  --pk-sprout-bg: #EDF2E2;
  --pk-sprout-line: #D8E4C4;

  /* ---------------- 墨色 ---------------- */
  --pk-ink: #22261F;
  --pk-ink-2: #464E43;
  --pk-ink-3: #79826F;
  --pk-ink-4: #A6AD9C;
  --pk-ink-inv: #FFFDF8;

  /* ---------------- 线 ---------------- */
  --pk-line: #EBE5D7;
  --pk-line-soft: #F1ECE0;
  --pk-line-strong: #DDD6C4;

  /* ---------------- 状态色 ---------------- */
  --pk-attention: #A9762A;
  --pk-attention-bg: #F8EFDC;
  --pk-attention-line: #E9D5AE;
  --pk-danger: #A85742;
  --pk-danger-bg: #F7E8E2;
  --pk-danger-line: #E9CDC2;
  --pk-success: #2F7A5B;
  --pk-success-bg: #E4EDE6;
  --pk-info: #4A6A7C;
  --pk-info-bg: #E7EEF2;
  --pk-info-line: #D4E1E8;

  /* 科目色，仅允许出现在 <=41.280px 的小面积上 */
  --pk-sub-chinese: #96671F;
  --pk-sub-chinese-bg: #F5EBDA;
  --pk-sub-math: #3F6379;
  --pk-sub-math-bg: #E6EDF3;
  --pk-sub-english: #565383;
  --pk-sub-english-bg: #EDECF5;
  --pk-sub-activity: #566E33;
  --pk-sub-activity-bg: #E9F1E0;
  --pk-sub-other: #96543F;
  --pk-sub-other-bg: #F3E9E9;

  /* 圆角：每个值只有一个职责，禁止中间值 */
  --pk-r-xs: 5.733px;
  --pk-r-sm: 9.173px;
  --pk-r-md: 13.760px;
  --pk-r-lg: 18.347px;
  --pk-r-xl: 22.933px;
  --pk-r-2xl: 29.813px;
  --pk-r-pill: 572.760px;

  /* 间距：4px 网格 */
  --pk-s1: 4.587px;
  --pk-s2: 9.173px;
  --pk-s3: 13.760px;
  --pk-s4: 18.347px;
  --pk-s5: 22.933px;
  --pk-s6: 27.520px;
  --pk-s7: 36.693px;
  --pk-s8: 45.867px;
  --pk-gutter: 20.640px;

  --pk-border: 0.573px solid rgba(34, 38, 31, .06);
  --pk-border-line: 0.573px solid var(--pk-line);
  --pk-border-soft: 0.573px solid var(--pk-line-soft);
  --pk-border-primary: 0.573px solid var(--pk-primary-hairline);

  /* 阴影：低对比、大扩散 */
  --pk-e0: 0 1.147px 2.293px rgba(34, 38, 31, .04);
  --pk-e1: 0 1.147px 2.293px rgba(34, 38, 31, .04);
  --pk-e2: 0 1.147px 2.293px rgba(34, 38, 31, .04), 0 11.467px 27.520px -16.053px rgba(34, 38, 31, .18);
  --pk-e3: 0 2.293px 6.880px rgba(34, 38, 31, .05), 0 25.227px 50.453px -22.933px rgba(34, 38, 31, .26);
  --pk-e-sheet: 0 -13.760px 45.867px -16.053px rgba(24, 28, 20, .44);
  --pk-e-fab: 0 11.467px 25.227px -9.173px rgba(31, 91, 69, .66);
  --pk-e-btn: 0 6.880px 18.347px -9.173px rgba(31, 91, 69, .7);

  --pk-touch-min: 50.453px;
  --pk-cta-h: 55.040px;
  --pk-btn-md: 50.453px;
  --pk-btn-sm: 41.280px;
  --pk-row-min: 64.213px;
  --pk-tabbar-h: 61.920px;

  /* 字体：标题用衬线体拉出「纸感」，数据用等宽数字 */
  --pk-serif: "Songti SC", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", serif;
  --pk-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  --pk-dur-fast: 140ms;
  --pk-dur-base: 240ms;
  --pk-dur-slow: 420ms;
  --pk-ease: cubic-bezier(.22, .75, .24, 1);
  --pk-ease-spring: cubic-bezier(.34, 1.42, .5, 1);
  --pk-ease-sheet: cubic-bezier(.32, .72, 0, 1);

  /* 兼容层：旧变量名指向 PKDS 值，存量页面无需改动即可继承新色板 */
  --canvas: var(--pk-canvas);
  --surface: var(--pk-surface);
  --surface-soft: var(--pk-primary-tint);
  --primary: var(--pk-primary);
  --primary-dark: var(--pk-primary-strong);
  --ink: var(--pk-ink);
  --muted: var(--pk-ink-3);
  --line: var(--pk-line);
  --warm: var(--pk-attention-bg);
  --warning: var(--pk-attention);
  --danger: var(--pk-danger);
}

/* 知芽 Push Kids · PKDS-2.0「纸 · 芽」原子组件层
   规则：几何量 rpx，字号 px，发丝线 0.573px；类名前缀 pk- 的是新原子，无前缀的是与既有页面共用的通用原子。
   视觉基调：纸面描边 + 极淡阴影；标题走衬线体，数字走等宽；主色只用于「确定/可信」，嫩芽色只用于「可选/成长」。 */

/* ---------------- 字阶 ---------------- */
.t-display { font-family: var(--pk-serif); font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: .2px; }
.t-h1 { font-family: var(--pk-serif); font-size: 23px; line-height: 1.3; font-weight: 600; letter-spacing: .2px; }
.t-h2 { font-family: var(--pk-serif); font-size: 18px; line-height: 1.4; font-weight: 600; }
.t-h3 { font-size: 17px; line-height: 1.45; font-weight: 600; }
.t-body { font-size: 16px; line-height: 1.6; }
.t-body-m { font-size: 16px; line-height: 1.6; font-weight: 500; }
.t-sub { font-size: 14px; line-height: 1.6; }
.t-sub-m { font-size: 14px; line-height: 1.6; font-weight: 500; }
.t-cap { font-size: 13px; line-height: 1.5; }
.t-micro { font-size: 11px; line-height: 1.35; font-weight: 500; letter-spacing: .6px; }
.c-ink { color: var(--pk-ink); }
.c-ink-2 { color: var(--pk-ink-2); }
.c-ink-3 { color: var(--pk-ink-3); }
.c-pri { color: var(--pk-primary); }
.c-att { color: var(--pk-attention); }
.c-dan { color: var(--pk-danger); }
.c-suc { color: var(--pk-success); }
.tnum { font-variant-numeric: tabular-nums; letter-spacing: .2px; }
.block { display: block; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------- 页内头部 ---------------- */
.pg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 13.760px; padding: 16.053px 0 13.760px; }
.pg-kicker { display: block; font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 1.147px; color: var(--pk-primary-mid); }
.pg-title { display: block; margin-top: 4.587px; font-family: var(--pk-serif); font-size: 24px; line-height: 1.28; font-weight: 600; letter-spacing: .4px; color: var(--pk-ink); }
.pg-context { display: block; margin-top: 4.587px; font-size: 12px; line-height: 1.5; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }

.child-chip {
  flex: 0 0 auto; height: 41.280px; box-sizing: border-box;
  display: inline-flex; align-items: center; gap: 6.880px;
  margin: 2.293px 0 0; padding: 0 11.467px 0 4.587px; border-radius: var(--pk-r-pill);
  background: var(--pk-surface); border: var(--pk-border-line); box-shadow: var(--pk-e1);
  font-size: 13px; line-height: 1.4; font-weight: 500; color: var(--pk-ink-2);
  transition: transform var(--pk-dur-fast) var(--pk-ease);
}
.child-chip::after { border: 0; }
.child-chip:active { transform: scale(.97); }
.child-chip .ava {
  flex: none; width: 32.107px; height: 32.107px; border-radius: 50%;
  background: linear-gradient(150deg, var(--pk-sprout-bg), var(--pk-primary-tint));
  color: var(--pk-primary-strong); font-family: var(--pk-serif);
  font-size: 13px; font-weight: 600; line-height: 32.107px; text-align: center;
}

.chev { flex: none; width: 8.027px; height: 8.027px; border-right: 1.720px solid var(--pk-ink-4); border-bottom: 1.720px solid var(--pk-ink-4); transform: rotate(45deg) translateY(-2.293px); transition: transform var(--pk-dur-base) var(--pk-ease); }
.chev.up { transform: rotate(225deg) translate(-1.147px, -1.147px); }
.chev.right { transform: translateX(-1.720px) rotate(-45deg); }
.chev.left { transform: translateX(1.720px) rotate(135deg); }
.chev.pri { border-color: var(--pk-primary); }

/* ---------------- 卡片 ---------------- */
.pk-card { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); padding: var(--pk-s4); box-shadow: var(--pk-e0); box-sizing: border-box; }
.pk-card + .pk-card { margin-top: var(--pk-s3); }
.pk-card.flat { background: var(--pk-surface-warm); box-shadow: none; }
.pk-card.tight { padding: 14.907px 16.053px; }
.pk-card.plain { border-radius: var(--pk-r-lg); }

/* Hero：右上角一抹嫩芽光，右下角一道年轮弧线 */
.pk-hero {
  position: relative; overflow: hidden;
  border-radius: var(--pk-r-2xl); padding: 22.933px 20.640px 20.640px; box-sizing: border-box;
  background: radial-gradient(120% 130% at 100% 0%, rgba(127, 166, 92, .16), rgba(127, 166, 92, 0) 58%), linear-gradient(158deg, #FFFEFA 0%, #F7F4EA 100%);
  border: var(--pk-border); box-shadow: var(--pk-e2);
}
.pk-hero::after { content: ""; position: absolute; right: -59.627px; bottom: -84.853px; width: 183.467px; height: 183.467px; border-radius: 50%; border: 0.573px solid rgba(56, 130, 106, .16); }
.pk-hero .hero-eyebrow { position: relative; display: block; font-size: 11px; line-height: 1.4; font-weight: 500; letter-spacing: 1.720px; color: var(--pk-primary-mid); }
.pk-hero .hero-line { position: relative; display: block; margin-top: 9.173px; font-family: var(--pk-serif); font-size: 19px; line-height: 1.4; font-weight: 600; color: var(--pk-ink); }
.pk-hero .hero-num { font-family: var(--pk-serif); font-size: 27px; font-weight: 600; letter-spacing: 0; color: var(--pk-primary); font-variant-numeric: tabular-nums; }
.pk-hero .hero-note { position: relative; display: block; margin-top: 8.027px; font-size: 13px; line-height: 1.65; color: var(--pk-ink-3); }
.pk-hero .btn-row, .pk-hero .btn { position: relative; }

/* 安排环：只描述今天的复习负荷组成（必做 / 有余力），不是完成率、不是评分 */
.ring { position: relative; flex: none; width: 105.493px; height: 105.493px; border-radius: 50%; }
.ring-plate { position: absolute; left: 17.200px; top: 17.200px; right: 17.200px; bottom: 17.200px; border-radius: 50%; background: rgba(255, 253, 248, .72); border: 0.573px solid rgba(34, 38, 31, .05); }
.ring-mid { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-mid .rv { font-family: var(--pk-serif); font-size: 24px; line-height: 1; font-weight: 600; color: var(--pk-ink); font-variant-numeric: tabular-nums; }
.ring-mid .rv .ru { font-family: var(--pk-sans); font-size: 12px; font-weight: 400; color: var(--pk-ink-4); }
.ring-mid .rl { margin-top: 3.440px; font-size: 10px; line-height: 1.2; letter-spacing: 0.573px; color: var(--pk-ink-3); }
.ring-legend { display: flex; align-items: center; gap: 11.467px; margin-top: 10.320px; }
.ring-legend .rg { display: inline-flex; align-items: center; gap: 4.587px; font-size: 11px; color: var(--pk-ink-3); }
.ring-legend .rg .rgd { width: 8.027px; height: 8.027px; border-radius: 50%; background: var(--pk-primary); }
.ring-legend .rg.opt .rgd { background: var(--pk-sprout); }

/* ---------------- 可折叠分区 ---------------- */
.sec { margin-top: var(--pk-s6); }
.sec-bar { min-height: 45.867px; display: flex; align-items: center; gap: 9.173px; padding: 0 2.293px; }
.sec-bar .s-t { flex: none; font-family: var(--pk-serif); font-size: 17px; line-height: 1.45; font-weight: 600; letter-spacing: .4px; color: var(--pk-ink); }
.sec-bar .s-m { flex: 1; min-width: 0; font-size: 12px; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }
.sec-rule { height: 0.573px; margin: 0 2.293px var(--pk-s3); background: linear-gradient(90deg, var(--pk-line-strong), rgba(235, 229, 215, 0)); }
.sec-body > view + view, .sec-body > .stack + .stack { margin-top: 11.467px; }

/* ---------------- 按钮 ---------------- */
.btn {
  box-sizing: border-box; width: 100%; height: var(--pk-cta-h); min-height: 50.453px;
  margin: 0; padding: 0 20.640px; border: 0; border-radius: var(--pk-r-pill);
  background: var(--pk-primary); color: var(--pk-ink-inv);
  font-size: 16px; line-height: 1.2; font-weight: 500; letter-spacing: .4px;
  display: flex; align-items: center; justify-content: center; gap: 8.027px;
  box-shadow: var(--pk-e-btn);
  transition: transform var(--pk-dur-fast) var(--pk-ease), background var(--pk-dur-fast) var(--pk-ease), box-shadow var(--pk-dur-fast) var(--pk-ease);
}
.btn::after { border: 0; }
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--pk-primary-tint); color: var(--pk-primary-strong); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--pk-primary); border: var(--pk-border-primary); box-shadow: none; }
.btn.neutral { background: var(--pk-surface); color: var(--pk-ink); border: 0.573px solid var(--pk-line-strong); box-shadow: var(--pk-e1); }
.btn.danger { background: var(--pk-danger-bg); color: var(--pk-danger); box-shadow: none; }
.btn.md { height: var(--pk-btn-md); min-height: var(--pk-btn-md); font-size: 15px; }
.btn.sm { height: var(--pk-btn-sm); min-height: var(--pk-btn-sm); width: auto; padding: 0 17.200px; font-size: 14px; box-shadow: none; }
.btn.auto { width: auto; }
.btn.is-disabled, .btn[disabled] { background: var(--pk-surface-sunken); color: var(--pk-ink-4); border-color: transparent; box-shadow: none; }
.btn.is-pressed { background: var(--pk-primary-pressed); }
.btn.secondary.is-pressed { background: var(--pk-primary-tint-2); }
/* 添加入口：虚线描边，不抢主 CTA 的注意力。设置、切换孩子弹层等多处共用。 */
.add-entry { display: flex; align-items: center; justify-content: center; gap: 6.880px; box-sizing: border-box; width: 100%; height: 50.453px; margin-top: 13.760px; border: 0.573px dashed var(--pk-primary-hairline); border-radius: var(--pk-r-md); color: var(--pk-primary); font-size: 15px; font-weight: 600; }

.btn-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11.467px; }
.btn-row.one { grid-template-columns: minmax(0, 1fr); }
.btn-row > .btn { width: 100%; min-width: 0; }

.link-btn { display: inline-flex; align-items: center; gap: 4.587px; min-height: 50.453px; margin: 0; padding: 0; border: 0; background: transparent; color: var(--pk-primary); font-size: 13px; font-weight: 500; }
.link-btn::after { border: 0; }
.link-btn.dan { color: var(--pk-danger); }
.icon-btn { flex: 0 0 41.280px; box-sizing: border-box; width: 41.280px; height: 41.280px; min-height: 41.280px; margin: 0; padding: 0; border: var(--pk-border-line); border-radius: 50%; background: var(--pk-surface); display: flex; align-items: center; justify-content: center; }
.icon-btn::after { border: 0; }

/* ---------------- 标签 / 状态 ---------------- */
.pill { display: inline-flex; align-items: center; gap: 4.587px; height: 25.227px; padding: 0 10.320px; border-radius: var(--pk-r-pill); background: var(--pk-primary-tint); color: var(--pk-primary-strong); font-size: 11px; font-weight: 500; letter-spacing: .2px; white-space: nowrap; }
.pill.att { background: var(--pk-attention-bg); color: var(--pk-attention); }
.pill.dan { background: var(--pk-danger-bg); color: var(--pk-danger); }
.pill.neutral { background: var(--pk-canvas-deep); color: var(--pk-ink-3); }
.pill.info { background: var(--pk-info-bg); color: var(--pk-info); }
.pill.suc { background: var(--pk-success-bg); color: var(--pk-success); }
.pill.solid { background: var(--pk-primary); color: var(--pk-ink-inv); }
.pill.line { background: transparent; border: 0.573px solid var(--pk-line-strong); color: var(--pk-ink-2); }
.pill .dot { width: 5.733px; height: 5.733px; border-radius: 50%; background: currentColor; }
.tagx { display: inline-flex; align-items: center; height: 22.933px; padding: 0 8.027px; border-radius: var(--pk-r-sm); background: var(--pk-canvas-deep); color: var(--pk-ink-3); font-size: 11px; }

.tag-sub { display: inline-flex; align-items: center; height: 25.227px; padding: 0 9.173px; border-radius: var(--pk-r-sm); font-size: 11px; font-weight: 600; }
.sub-mark { flex: 0 0 38.987px; width: 38.987px; height: 38.987px; border-radius: 12.613px; display: flex; align-items: center; justify-content: center; font-family: var(--pk-serif); font-size: 15px; font-weight: 600; }
.tag-sub.s-chinese, .sub-mark.s-chinese { background: var(--pk-sub-chinese-bg); color: var(--pk-sub-chinese); }
.tag-sub.s-math, .sub-mark.s-math { background: var(--pk-sub-math-bg); color: var(--pk-sub-math); }
.tag-sub.s-english, .sub-mark.s-english { background: var(--pk-sub-english-bg); color: var(--pk-sub-english); }
.tag-sub.s-activity, .sub-mark.s-activity { background: var(--pk-sub-activity-bg); color: var(--pk-sub-activity); }
.tag-sub.s-other, .sub-mark.s-other { background: var(--pk-sub-other-bg); color: var(--pk-sub-other); }

/* 识别置信度：三格竖条，只描述「要不要核对」，不是分数 */
.confidence { display: inline-flex; align-items: center; gap: 4.587px; font-size: 11px; font-weight: 500; }
.confidence .bars { display: inline-flex; align-items: flex-end; gap: 1.720px; }
.confidence .bars .b { width: 4.013px; height: 6.880px; border-radius: 1.147px; background: currentColor; opacity: .2; }
.confidence .bars .b:nth-child(2) { height: 10.320px; }
.confidence .bars .b:nth-child(3) { height: 13.760px; }
.confidence .bars .b.on { opacity: 1; }
.confidence.high { color: var(--pk-primary); }
.confidence.medium { color: var(--pk-attention); }
.confidence.low { color: var(--pk-danger); }

/* 草稿印章：AI 产出与正式记录的永久分界 */
.stamp { display: inline-flex; align-items: center; gap: 5.733px; height: 27.520px; padding: 0 10.320px; border: 1.147px dashed rgba(56, 130, 106, .55); border-radius: var(--pk-r-sm); background: rgba(228, 237, 230, .6); color: var(--pk-primary-strong); font-size: 12px; font-weight: 600; letter-spacing: 0.573px; transform: rotate(-1.4deg); }
.stamp.manual { border-color: var(--pk-line-strong); background: var(--pk-canvas-deep); color: var(--pk-ink-3); }

/* ---------------- 提示条 ---------------- */
.pk-notice { display: flex; align-items: center; gap: 10.320px; min-height: 52.747px; padding: 12.613px 14.907px; box-sizing: border-box; border-radius: var(--pk-r-lg); background: var(--pk-attention-bg); border: 0.573px solid var(--pk-attention-line); color: var(--pk-ink-2); font-size: 13px; line-height: 1.6; }
.pk-notice .n-txt { flex: 1; min-width: 0; }
.pk-notice .n-t { display: block; font-size: 14px; line-height: 1.5; font-weight: 500; color: var(--pk-ink); }
.pk-notice .n-c { display: block; margin-top: 2.293px; font-size: 12px; line-height: 1.6; color: var(--pk-ink-3); }

/* 知芽 Push Kids · PKDS-2.0「纸 · 芽」design tokens
   设计语言：暖白纸面 + 松绿主色 + 嫩芽成长色；低对比大扩散阴影，像纸叠在纸上。
   单位约定：颜色语义 token 无单位；几何量 rpx（= px@375 × 2）；字号 px；发丝线固定 0.573px。 */

.page-root {
  /* ---------------- 纸面 ---------------- */
  --pk-canvas: #FAF7F0;
  --pk-canvas-deep: #F3EFE4;
  --pk-surface: #FFFDF8;
  --pk-surface-raised: #FFFFFF;
  --pk-surface-warm: #FDFBF5;
  --pk-surface-sunken: #F3EFE4;

  /* ---------------- 松绿（确定、可信） ---------------- */
  --pk-primary: #1F5B45;
  --pk-primary-strong: #14402F;
  --pk-primary-pressed: #103527;
  --pk-primary-mid: #38826A;
  --pk-primary-tint: #E4EDE6;
  --pk-primary-tint-2: #D2E1D6;
  --pk-primary-wash: #F0F5F0;
  --pk-primary-hairline: #C3D8CA;

  /* ---------------- 嫩芽（成长、可选项） ---------------- */
  --pk-sprout: #7FA65C;
  --pk-sprout-bg: #EDF2E2;
  --pk-sprout-line: #D8E4C4;

  /* ---------------- 墨色 ---------------- */
  --pk-ink: #22261F;
  --pk-ink-2: #464E43;
  --pk-ink-3: #79826F;
  --pk-ink-4: #A6AD9C;
  --pk-ink-inv: #FFFDF8;

  /* ---------------- 线 ---------------- */
  --pk-line: #EBE5D7;
  --pk-line-soft: #F1ECE0;
  --pk-line-strong: #DDD6C4;

  /* ---------------- 状态色 ---------------- */
  --pk-attention: #A9762A;
  --pk-attention-bg: #F8EFDC;
  --pk-attention-line: #E9D5AE;
  --pk-danger: #A85742;
  --pk-danger-bg: #F7E8E2;
  --pk-danger-line: #E9CDC2;
  --pk-success: #2F7A5B;
  --pk-success-bg: #E4EDE6;
  --pk-info: #4A6A7C;
  --pk-info-bg: #E7EEF2;
  --pk-info-line: #D4E1E8;

  /* 科目色，仅允许出现在 <=41.280px 的小面积上 */
  --pk-sub-chinese: #96671F;
  --pk-sub-chinese-bg: #F5EBDA;
  --pk-sub-math: #3F6379;
  --pk-sub-math-bg: #E6EDF3;
  --pk-sub-english: #565383;
  --pk-sub-english-bg: #EDECF5;
  --pk-sub-activity: #566E33;
  --pk-sub-activity-bg: #E9F1E0;
  --pk-sub-other: #96543F;
  --pk-sub-other-bg: #F3E9E9;

  /* 圆角：每个值只有一个职责，禁止中间值 */
  --pk-r-xs: 5.733px;
  --pk-r-sm: 9.173px;
  --pk-r-md: 13.760px;
  --pk-r-lg: 18.347px;
  --pk-r-xl: 22.933px;
  --pk-r-2xl: 29.813px;
  --pk-r-pill: 572.760px;

  /* 间距：4px 网格 */
  --pk-s1: 4.587px;
  --pk-s2: 9.173px;
  --pk-s3: 13.760px;
  --pk-s4: 18.347px;
  --pk-s5: 22.933px;
  --pk-s6: 27.520px;
  --pk-s7: 36.693px;
  --pk-s8: 45.867px;
  --pk-gutter: 20.640px;

  --pk-border: 0.573px solid rgba(34, 38, 31, .06);
  --pk-border-line: 0.573px solid var(--pk-line);
  --pk-border-soft: 0.573px solid var(--pk-line-soft);
  --pk-border-primary: 0.573px solid var(--pk-primary-hairline);

  /* 阴影：低对比、大扩散 */
  --pk-e0: 0 1.147px 2.293px rgba(34, 38, 31, .04);
  --pk-e1: 0 1.147px 2.293px rgba(34, 38, 31, .04);
  --pk-e2: 0 1.147px 2.293px rgba(34, 38, 31, .04), 0 11.467px 27.520px -16.053px rgba(34, 38, 31, .18);
  --pk-e3: 0 2.293px 6.880px rgba(34, 38, 31, .05), 0 25.227px 50.453px -22.933px rgba(34, 38, 31, .26);
  --pk-e-sheet: 0 -13.760px 45.867px -16.053px rgba(24, 28, 20, .44);
  --pk-e-fab: 0 11.467px 25.227px -9.173px rgba(31, 91, 69, .66);
  --pk-e-btn: 0 6.880px 18.347px -9.173px rgba(31, 91, 69, .7);

  --pk-touch-min: 50.453px;
  --pk-cta-h: 55.040px;
  --pk-btn-md: 50.453px;
  --pk-btn-sm: 41.280px;
  --pk-row-min: 64.213px;
  --pk-tabbar-h: 61.920px;

  /* 字体：标题用衬线体拉出「纸感」，数据用等宽数字 */
  --pk-serif: "Songti SC", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", serif;
  --pk-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  --pk-dur-fast: 140ms;
  --pk-dur-base: 240ms;
  --pk-dur-slow: 420ms;
  --pk-ease: cubic-bezier(.22, .75, .24, 1);
  --pk-ease-spring: cubic-bezier(.34, 1.42, .5, 1);
  --pk-ease-sheet: cubic-bezier(.32, .72, 0, 1);

  /* 兼容层：旧变量名指向 PKDS 值，存量页面无需改动即可继承新色板 */
  --canvas: var(--pk-canvas);
  --surface: var(--pk-surface);
  --surface-soft: var(--pk-primary-tint);
  --primary: var(--pk-primary);
  --primary-dark: var(--pk-primary-strong);
  --ink: var(--pk-ink);
  --muted: var(--pk-ink-3);
  --line: var(--pk-line);
  --warm: var(--pk-attention-bg);
  --warning: var(--pk-attention);
  --danger: var(--pk-danger);
}

/* 知芽 Push Kids · PKDS-2.0「纸 · 芽」原子组件层
   规则：几何量 rpx，字号 px，发丝线 0.573px；类名前缀 pk- 的是新原子，无前缀的是与既有页面共用的通用原子。
   视觉基调：纸面描边 + 极淡阴影；标题走衬线体，数字走等宽；主色只用于「确定/可信」，嫩芽色只用于「可选/成长」。 */

/* ---------------- 字阶 ---------------- */
.t-display { font-family: var(--pk-serif); font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: .2px; }
.t-h1 { font-family: var(--pk-serif); font-size: 23px; line-height: 1.3; font-weight: 600; letter-spacing: .2px; }
.t-h2 { font-family: var(--pk-serif); font-size: 18px; line-height: 1.4; font-weight: 600; }
.t-h3 { font-size: 17px; line-height: 1.45; font-weight: 600; }
.t-body { font-size: 16px; line-height: 1.6; }
.t-body-m { font-size: 16px; line-height: 1.6; font-weight: 500; }
.t-sub { font-size: 14px; line-height: 1.6; }
.t-sub-m { font-size: 14px; line-height: 1.6; font-weight: 500; }
.t-cap { font-size: 13px; line-height: 1.5; }
.t-micro { font-size: 11px; line-height: 1.35; font-weight: 500; letter-spacing: .6px; }
.c-ink { color: var(--pk-ink); }
.c-ink-2 { color: var(--pk-ink-2); }
.c-ink-3 { color: var(--pk-ink-3); }
.c-pri { color: var(--pk-primary); }
.c-att { color: var(--pk-attention); }
.c-dan { color: var(--pk-danger); }
.c-suc { color: var(--pk-success); }

/* ---------------- 页内头部 ---------------- */

.pk-hero::after { content: ""; position: absolute; right: -59.627px; bottom: -84.853px; width: 183.467px; height: 183.467px; border-radius: 50%; border: 0.573px solid rgba(56, 130, 106, .16); }
.pk-hero .hero-eyebrow { position: relative; display: block; font-size: 11px; line-height: 1.4; font-weight: 500; letter-spacing: 1.720px; color: var(--pk-primary-mid); }

/* 安排环：只描述今天的复习负荷组成（必做 / 有余力），不是完成率、不是评分 */
.ring { position: relative; flex: none; width: 105.493px; height: 105.493px; border-radius: 50%; }
.ring-plate { position: absolute; left: 17.200px; top: 17.200px; right: 17.200px; bottom: 17.200px; border-radius: 50%; background: rgba(255, 253, 248, .72); border: 0.573px solid rgba(34, 38, 31, .05); }
.ring-mid { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* ---------------- 可折叠分区 ---------------- */

.sec-body > view + view, .sec-body > .stack + .stack { margin-top: 11.467px; }

/* ---------------- 按钮 ---------------- */
.btn {
  box-sizing: border-box; width: 100%; height: var(--pk-cta-h); min-height: 50.453px;
  margin: 0; padding: 0 20.640px; border: 0; border-radius: var(--pk-r-pill);
  background: var(--pk-primary); color: var(--pk-ink-inv);
  font-size: 16px; line-height: 1.2; font-weight: 500; letter-spacing: .4px;
  display: flex; align-items: center; justify-content: center; gap: 8.027px;
  box-shadow: var(--pk-e-btn);
  transition: transform var(--pk-dur-fast) var(--pk-ease), background var(--pk-dur-fast) var(--pk-ease), box-shadow var(--pk-dur-fast) var(--pk-ease);
}
.btn::after { border: 0; }
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--pk-primary-tint); color: var(--pk-primary-strong); box-shadow: none; }

/* 添加入口：虚线描边，不抢主 CTA 的注意力。设置、切换孩子弹层等多处共用。 */
.add-entry { display: flex; align-items: center; justify-content: center; gap: 6.880px; box-sizing: border-box; width: 100%; height: 50.453px; margin-top: 13.760px; border: 0.573px dashed var(--pk-primary-hairline); border-radius: var(--pk-r-md); color: var(--pk-primary); font-size: 15px; font-weight: 600; }

.btn-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11.467px; }

.link-btn { display: inline-flex; align-items: center; gap: 4.587px; min-height: 50.453px; margin: 0; padding: 0; border: 0; background: transparent; color: var(--pk-primary); font-size: 13px; font-weight: 500; }

.icon-btn { flex: 0 0 41.280px; box-sizing: border-box; width: 41.280px; height: 41.280px; min-height: 41.280px; margin: 0; padding: 0; border: var(--pk-border-line); border-radius: 50%; background: var(--pk-surface); display: flex; align-items: center; justify-content: center; }
.icon-btn::after { border: 0; }

/* ---------------- 标签 / 状态 ---------------- */
.pill { display: inline-flex; align-items: center; gap: 4.587px; height: 25.227px; padding: 0 10.320px; border-radius: var(--pk-r-pill); background: var(--pk-primary-tint); color: var(--pk-primary-strong); font-size: 11px; font-weight: 500; letter-spacing: .2px; white-space: nowrap; }
.pill.att { background: var(--pk-attention-bg); color: var(--pk-attention); }

.tag-sub.s-chinese, .sub-mark.s-chinese { background: var(--pk-sub-chinese-bg); color: var(--pk-sub-chinese); }
.tag-sub.s-math, .sub-mark.s-math { background: var(--pk-sub-math-bg); color: var(--pk-sub-math); }
.tag-sub.s-english, .sub-mark.s-english { background: var(--pk-sub-english-bg); color: var(--pk-sub-english); }

/* 识别置信度：三格竖条，只描述「要不要核对」，不是分数 */

.confidence.high { color: var(--pk-primary); }

/* 草稿印章：AI 产出与正式记录的永久分界 */
.stamp { display: inline-flex; align-items: center; gap: 5.733px; height: 27.520px; padding: 0 10.320px; border: 1.147px dashed rgba(56, 130, 106, .55); border-radius: var(--pk-r-sm); background: rgba(228, 237, 230, .6); color: var(--pk-primary-strong); font-size: 12px; font-weight: 600; letter-spacing: 0.573px; transform: rotate(-1.4deg); }

/* ---------------- 提示条 ---------------- */

/* ---------------- 分段控件 / chips ---------------- */
.seg { display: grid; padding: 3.440px; border-radius: var(--pk-r-pill); background: rgba(34, 38, 31, .05); box-sizing: border-box; }
.seg.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg > button, .seg > view { box-sizing: border-box; width: 100%; min-width: 0; height: 41.280px; margin: 0; padding: 0; border: 0; border-radius: var(--pk-r-pill); background: transparent; color: var(--pk-ink-3); font-size: 14px; line-height: 1.2; font-weight: 400; display: flex; align-items: center; justify-content: center; gap: 5.733px; transition: background var(--pk-dur-base) var(--pk-ease), color var(--pk-dur-base) var(--pk-ease); }

.chips { display: flex; flex-wrap: wrap; gap: 8.027px; }

.chips > view.on, .chips > button.on { background: var(--pk-primary); border-color: var(--pk-primary); color: var(--pk-ink-inv); font-weight: 500; box-shadow: var(--pk-e-btn); }
.chips > view:active, .chips > button:active { transform: scale(.96); }

/* ---------------- 表单 ---------------- */
.pk-field + .pk-field { margin-top: 16.053px; }

.pk-picker { display: flex; align-items: center; justify-content: space-between; gap: 9.173px; }

.help { margin-top: 6.880px; font-size: 12px; line-height: 1.6; color: var(--pk-ink-3); }

/* ---------------- 行列表 ---------------- */
.rowlist { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); box-shadow: var(--pk-e0); overflow: hidden; }
.rowitem { position: relative; display: flex; align-items: center; gap: 12.613px; min-height: var(--pk-row-min); padding: 13.760px 16.053px; box-sizing: border-box; transition: background var(--pk-dur-fast) var(--pk-ease); }
.rowitem + .rowitem::before { content: ""; position: absolute; left: 16.053px; right: 0; top: 0; height: 0.573px; background: var(--pk-line); }

.tl { position: relative; padding-left: 66.507px; }

.tl-card { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-lg); padding: 13.760px 14.907px; box-shadow: var(--pk-e0); box-sizing: border-box; }

.tl-item.past .tl-node { border-color: var(--pk-line-strong); }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3.440px; }

/* ---------------- FAB ---------------- */
.pk-fab { position: fixed; right: var(--pk-gutter); bottom: calc(var(--pk-s4) + var(--pk-tabbar-h) + 0px); z-index: 12; height: 55.040px; padding: 0 20.640px 0 17.200px; margin: 0; border: 0; border-radius: var(--pk-r-pill); background: linear-gradient(150deg, var(--pk-primary-mid), var(--pk-primary-strong)); color: var(--pk-ink-inv); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 8.027px; box-shadow: var(--pk-e-fab); }

/* ---------------- 数据展示 ---------------- */
/* 指标是 2×2 的只读小卡：每格自带描边与间距，小屏也不挤。 */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--pk-s2); }
.metric { position: relative; overflow: hidden; box-sizing: border-box; min-width: 0; min-height: 96.320px; padding: 13.760px 13.760px 11.467px; display: flex; flex-direction: column; justify-content: center; background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); box-shadow: var(--pk-e0); }
.metric .mv { position: relative; display: block; font-family: var(--pk-serif); font-size: 27px; line-height: 1.1; font-weight: 600; color: var(--pk-ink); font-variant-numeric: tabular-nums; }
.metric .mv.zero { color: var(--pk-ink-4); }

.bar-row { position: relative; display: flex; align-items: center; gap: 11.467px; min-height: 55.040px; }
.bar-row .bn { flex: 0 0 59.627px; font-size: 14px; font-weight: 400; }
.bar-track { flex: 1; min-width: 0; height: 9.173px; border-radius: var(--pk-r-pill); background: rgba(34, 38, 31, .06); overflow: hidden; }
.bar-fill { height: 100%; border-radius: var(--pk-r-pill); background: linear-gradient(90deg, var(--pk-primary-mid), var(--pk-primary)); transition: width var(--pk-dur-slow) var(--pk-ease); }
.bar-row .bv { flex: none; font-size: 12px; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }

.udot { width: 38.987px; height: 38.987px; margin: 0 auto; border-radius: 11.467px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.udot.l0 { background: var(--pk-canvas-deep); color: var(--pk-ink-4); }
.udot.l1 { background: var(--pk-primary-tint); color: var(--pk-primary-strong); }
.udot.l2 { background: #C9DDCD; color: var(--pk-primary-strong); }
.udot.l3 { background: var(--pk-attention-bg); color: var(--pk-attention); }
.udot.l4 { background: #EFD9AD; color: #7E561A; }
.udot.pass { background: var(--pk-primary); color: var(--pk-ink-inv); }
.hbox { width: 100%; max-width: 38.987px; height: 38.987px; margin: 0 auto; border-radius: 10.320px; }
.hbox.h0 { background: rgba(34, 38, 31, .05); }
.hbox.h1 { background: #E2EBE1; }
.hbox.h2 { background: #C0D6C2; }
.hbox.h3 { background: #86AF92; }
.hbox.h4 { background: var(--pk-primary); }
.cell-label { display: block; margin-top: 4.587px; text-align: center; font-size: 10px; line-height: 1.2; color: var(--pk-ink-4); font-variant-numeric: tabular-nums; }
.legend { display: flex; align-items: center; gap: 4.587px; font-size: 10px; color: var(--pk-ink-4); }
.legend .sw { width: 11.467px; height: 11.467px; border-radius: 3.440px; }

.pager { display: flex; align-items: center; justify-content: space-between; min-height: 45.867px; }
.pager .pbtn { flex: 0 0 34.400px; width: 34.400px; height: 34.400px; min-height: 34.400px; margin: 0; padding: 0; border: 0.573px solid var(--pk-line-strong); border-radius: 50%; background: var(--pk-surface); display: flex; align-items: center; justify-content: center; }
.pager .pbtn::after { border: 0; }
.pager .pbtn.off { opacity: .35; }
.pager .plabel { flex: 1; min-width: 0; text-align: center; font-size: 12px; font-weight: 500; color: var(--pk-ink-2); }
.pager .plabel .psub { display: block; margin-top: 2.293px; font-size: 10px; font-weight: 400; color: var(--pk-ink-4); font-variant-numeric: tabular-nums; }
.pdots { display: flex; align-items: center; justify-content: center; gap: 4.587px; margin-top: 9.173px; }
.pdots .pd { width: 4.587px; height: 4.587px; border-radius: 50%; background: var(--pk-line-strong); transition: width var(--pk-dur-base) var(--pk-ease); }
.pdots .pd.on { width: 16.053px; border-radius: 2.293px; background: var(--pk-primary); }

/* ---------------- 照片上传 ---------------- */
.upload-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11.467px; }
.up-tile { box-sizing: border-box; height: 123.840px; margin: 0; padding: 0; border-radius: var(--pk-r-xl); border: 1.720px dashed rgba(56, 130, 106, .36); background: linear-gradient(160deg, rgba(228, 237, 230, .7), rgba(255, 253, 248, .7)); color: var(--pk-primary-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9.173px; font-size: 14px; line-height: 1.3; font-weight: 500; transition: transform var(--pk-dur-base) var(--pk-ease), background var(--pk-dur-base) var(--pk-ease); }
.up-tile::after { border: 0; }
.up-tile:active { transform: scale(.98); background: var(--pk-primary-tint); }
.up-tile .us { font-size: 11px; font-weight: 400; color: var(--pk-ink-4); }
.up-tile.alt { background: var(--pk-surface); border: 1.720px dashed var(--pk-line-strong); color: var(--pk-ink-2); }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9.173px; }
.pcell { position: relative; width: 100%; height: 0; padding-bottom: 100%; border-radius: var(--pk-r-md); overflow: hidden; background: var(--pk-canvas-deep); border: var(--pk-border-line); box-sizing: border-box; }
.pcell .pimg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.pcell .rm { position: absolute; top: 4.587px; right: 4.587px; width: 25.227px; height: 25.227px; border-radius: 50%; background: rgba(24, 28, 20, .62); color: #fff; display: flex; align-items: center; justify-content: center; }
.pcell .idx { position: absolute; left: 5.733px; bottom: 5.733px; height: 19.493px; padding: 0 6.880px; border-radius: 5.733px; background: rgba(24, 28, 20, .62); color: #fff; font-size: 10px; font-weight: 500; display: flex; align-items: center; font-variant-numeric: tabular-nums; }
.pcell .prog { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(255, 253, 248, .7); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--pk-primary-strong); }
.pcell.add { border: 1.720px dashed var(--pk-line-strong); background: transparent; }
.pcell.add .ph-center { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; color: var(--pk-ink-4); }
.prog-line { height: 5.733px; border-radius: var(--pk-r-pill); background: rgba(34, 38, 31, .08); overflow: hidden; }
.prog-line .pf { display: block; height: 100%; border-radius: var(--pk-r-pill); background: linear-gradient(90deg, var(--pk-primary-mid), var(--pk-sprout)); transition: width var(--pk-dur-base) var(--pk-ease); }

/* AI 整理中：命名进度，不给假百分比 */
.ai-run { padding: 18.347px; box-sizing: border-box; border-radius: var(--pk-r-xl); background: linear-gradient(150deg, rgba(228, 237, 230, .8), rgba(255, 253, 248, .9)); border: 0.573px dashed rgba(56, 130, 106, .38); }
.ai-step { display: flex; align-items: center; gap: 11.467px; min-height: 41.280px; }

.ai-step .st { font-size: 13px; color: var(--pk-ink-4); }
.ai-step.done .sd { background: var(--pk-primary); border-color: var(--pk-primary); color: var(--pk-ink-inv); }
.ai-step.done .st { color: var(--pk-ink-2); }
.ai-step.run .sd { border-color: var(--pk-primary); color: var(--pk-primary); }
.ai-step.run .st { color: var(--pk-primary-strong); font-weight: 500; }

/* ---------------- 浮层 ---------------- */
.pk-mask { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 20; background: rgba(24, 28, 20, .42); }
.pk-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 85vh; box-sizing: border-box; background: var(--pk-canvas); border-radius: var(--pk-r-2xl) var(--pk-r-2xl) 0 0; box-shadow: var(--pk-e-sheet); padding: 9.173px var(--pk-gutter) calc(16.053px + var(--pk-tabbar-h) + 0px); display: flex; flex-direction: column; }

.pk-sheet.plain { padding-bottom: calc(16.053px + 0px); }
.pk-sheet .handle { flex: none; width: 43.573px; height: 4.587px; border-radius: 2.293px; background: var(--pk-line-strong); margin: 0 auto 11.467px; }
.sheet-head { flex: none; display: flex; align-items: flex-start; gap: 11.467px; padding-bottom: 13.760px; }

.sheet-sub { display: block; margin-top: 4.587px; font-size: 12px; line-height: 1.55; color: var(--pk-ink-3); }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; }
.sheet-foot { flex: none; padding-top: 13.760px; }

.asheet { position: fixed; left: 9.173px; right: 9.173px; bottom: 9.173px; z-index: 21; }

.asheet .grp .ttl { padding: 13.760px; text-align: center; font-size: 12px; line-height: 1.5; color: var(--pk-ink-3); border-bottom: var(--pk-border-soft); }
.asheet .grp .it { min-height: 64.213px; display: flex; align-items: center; justify-content: center; gap: 9.173px; font-size: 17px; font-weight: 400; color: var(--pk-ink); }

.asheet .grp .it.dan { color: var(--pk-danger); }

/* ---------------- 吸底操作条 ---------------- */
.pk-cta-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; box-sizing: border-box; padding: 13.760px var(--pk-gutter) calc(13.760px + 0px); background: linear-gradient(180deg, rgba(250, 247, 240, 0), rgba(250, 247, 240, .97) 34%); backdrop-filter: blur(10px); }

.sk { border-radius: var(--pk-r-xl); background: linear-gradient(100deg, rgba(34, 38, 31, .055) 30%, rgba(34, 38, 31, .02) 50%, rgba(34, 38, 31, .055) 70%); background-size: 300% 100%; animation: pk-sk 1.5s linear infinite; }

/* 全局纸面：暖白底 + 两层极淡光斑，模拟纸张受光；不使用图片，零包体成本 */
.page-root {
  min-height: 100%;
  background-color: var(--pk-canvas);
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 62%),
    radial-gradient(90% 50% at 100% 100%, rgba(127, 166, 92, .07), rgba(127, 166, 92, 0) 70%);
  background-repeat: no-repeat;
  color: var(--pk-ink);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  font-family: var(--pk-sans);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}

/* 页面外壳：左右安全边距 18px，底部预留 TabBar + 安全区 */
.page { width: 100%; max-width: 550.400px; margin: 0 auto; box-sizing: border-box; padding: 13.760px var(--pk-gutter) calc(86.000px + 0px); overflow-x: hidden; }
.page.sticky-cta { padding-bottom: calc(123.840px + 0px); }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 13.760px; margin: 11.467px 0 16.053px; }
.eyebrow { display: block; color: var(--pk-primary-mid); font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 1.147px; }
.title { display: block; margin-top: 4.587px; font-family: var(--pk-serif); font-size: 24px; line-height: 1.28; font-weight: 600; letter-spacing: .4px; }
.section-title { display: block; margin: var(--pk-s6) 0 var(--pk-s3); font-family: var(--pk-serif); font-size: 17px; line-height: 1.45; font-weight: 600; letter-spacing: .4px; }
.muted { color: var(--pk-ink-3); }
.small { font-size: 13px; line-height: 1.55; }

/* 卡片：纸描边 + 近乎无感的落影 */
.card { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); padding: var(--pk-s4); margin-bottom: var(--pk-s3); box-shadow: var(--pk-e0); box-sizing: border-box; }
.card.flat { background: var(--pk-surface-warm); box-shadow: none; }
.card.tight { padding: 14.907px 16.053px; }
.hero { position: relative; overflow: hidden; background-color: #F7F4EA; background-image: radial-gradient(120% 130% at 100% 0%, rgba(127, 166, 92, .16), rgba(127, 166, 92, 0) 58%); border: var(--pk-border); border-radius: var(--pk-r-2xl); padding: 22.933px 20.640px 20.640px; box-shadow: var(--pk-e2); box-sizing: border-box; }
.hero-number { font-family: var(--pk-serif); font-size: 28px; line-height: 1.1; font-weight: 600; color: var(--pk-primary); font-variant-numeric: tabular-nums; }
.hero-copy { margin: 8.027px 0 18.347px; color: var(--pk-ink-3); font-size: 13px; line-height: 1.65; }

.row { display: flex; align-items: center; gap: 9.173px; }
.row.top { align-items: flex-start; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* 按钮：主 48px 胶囊，卡内 36px */
.button { box-sizing: border-box; min-height: var(--pk-cta-h); margin: 0; border: none; border-radius: var(--pk-r-pill); padding: 0 20.640px; background: var(--pk-primary); color: var(--pk-ink-inv); font-size: 16px; line-height: 1.2; font-weight: 500; letter-spacing: .4px; display: flex; align-items: center; justify-content: center; gap: 9.173px; box-shadow: var(--pk-e-btn); transition: transform var(--pk-dur-fast) var(--pk-ease), background var(--pk-dur-fast) var(--pk-ease); }
.button::after { border: none; }
.button:active { transform: scale(.98); }
.button.secondary { background: var(--pk-primary-tint); color: var(--pk-primary-strong); box-shadow: none; }
.button.ghost { background: transparent; color: var(--pk-primary); border: var(--pk-border-primary); box-shadow: none; }
.button.neutral { background: var(--pk-surface); color: var(--pk-ink); border: 0.573px solid var(--pk-line-strong); box-shadow: var(--pk-e1); }
.button.compact { min-height: var(--pk-btn-sm); padding: 0 17.200px; font-size: 14px; box-shadow: none; }
.button.danger { background: var(--pk-danger-bg); color: var(--pk-danger); box-shadow: none; }
.button.is-disabled, .button[disabled] { background: var(--pk-surface-sunken); color: var(--pk-ink-4); border-color: transparent; box-shadow: none; }
.action-row { display: grid; grid-template-columns: minmax(0, 1fr); width: 100%; box-sizing: border-box; gap: 11.467px; }
.action-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.action-row > .button { width: 100%; min-width: 0; max-width: none; margin-left: 0; margin-right: 0; justify-self: stretch; }

.pill { display: inline-flex; align-items: center; gap: 4.587px; min-height: 25.227px; padding: 0 10.320px; border-radius: var(--pk-r-pill); background: var(--pk-primary-tint); color: var(--pk-primary-strong); font-size: 11px; font-weight: 500; letter-spacing: .2px; }
.pill.warm { background: var(--pk-attention-bg); color: var(--pk-attention); }

.notice { display: flex; align-items: center; gap: 10.320px; padding: 12.613px 14.907px; box-sizing: border-box; border-radius: var(--pk-r-lg); background: var(--pk-attention-bg); border: 0.573px solid var(--pk-attention-line); color: var(--pk-ink-2); font-size: 13px; line-height: 1.6; margin-bottom: var(--pk-s3); }
.notice.error { background: var(--pk-danger-bg); border-color: var(--pk-danger-line); }
.notice.ai { background-color: #EDF2E6; border: 0.573px dashed rgba(56, 130, 106, .4); color: var(--pk-primary-strong); }
.notice.quiet { background: var(--pk-surface-warm); border-color: var(--pk-line); color: var(--pk-ink-2); }

.empty { text-align: center; padding: 41.280px 27.520px; }
.empty-mark { width: 77.973px; height: 77.973px; margin: 0 auto 16.053px; border-radius: 25.227px; background-color: var(--pk-primary-tint); background-image: radial-gradient(circle at 30% 25%, rgba(127, 166, 92, .35), rgba(127, 166, 92, 0) 70%); color: var(--pk-primary); display: flex; align-items: center; justify-content: center; }
.empty-title { display: block; font-family: var(--pk-serif); font-size: 17px; line-height: 1.45; font-weight: 600; }
.empty-copy { display: block; margin: 8.027px auto 0; max-width: 298.133px; font-size: 13px; line-height: 1.75; color: var(--pk-ink-3); }

.skeleton { height: 133.013px; border-radius: var(--pk-r-xl); margin-bottom: 11.467px; background: linear-gradient(100deg, rgba(34, 38, 31, .055) 30%, rgba(34, 38, 31, .02) 50%, rgba(34, 38, 31, .055) 70%); background-size: 300% 100%; animation: pulse 1.5s linear infinite; }
@keyframes pulse { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

.field { margin-bottom: 16.053px; }
.label { display: block; margin-bottom: 6.880px; color: var(--pk-ink-2); font-size: 13px; font-weight: 500; }
.input, .textarea, .picker { box-sizing: border-box; width: 100%; min-height: 52.747px; padding: 13.760px 16.053px; border-radius: var(--pk-r-md); border: 0.573px solid var(--pk-line-strong); background: var(--pk-surface-raised); font-size: 15px; line-height: 1.5; color: var(--pk-ink); }
.textarea { min-height: 119.253px; line-height: 1.7; }
.divider { height: 0.573px; background: var(--pk-line); margin: var(--pk-s3) 0; }

.metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11.467px; }
.metric-value { display: block; font-family: var(--pk-serif); font-size: 30px; line-height: 1.05; font-weight: 600; font-variant-numeric: tabular-nums; }

.timeline { border-left: 0.573px solid var(--pk-line-strong); margin-left: 6.880px; padding-left: 18.347px; }
.timeline-item { position: relative; margin-bottom: 13.760px; }
.timeline-item::before { content: ""; position: absolute; width: 6.880px; height: 6.880px; border-radius: 50%; background: var(--pk-surface); left: -22.360px; top: 10.320px; border: 2.867px solid var(--pk-primary-mid); box-sizing: content-box; }

.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9.173px; }
.photo { width: 100%; height: 119.253px; border-radius: var(--pk-r-md); object-fit: cover; }
.safe-bottom { height: calc(22.933px + 0px); }

.compact-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 13.760px; }
.child-trigger { box-sizing: border-box; min-height: 41.280px; display: flex; align-items: center; gap: 6.880px; padding: 0 11.467px 0 4.587px; border: var(--pk-border-line); border-radius: var(--pk-r-pill); background: var(--pk-surface); box-shadow: var(--pk-e1); font-size: 13px; line-height: 1.4; font-weight: 500; color: var(--pk-ink-2); }
.avatar-small { flex: none; width: 32.107px; height: 32.107px; line-height: 32.107px; text-align: center; border-radius: 50%; background-color: var(--pk-primary-tint); background-image: linear-gradient(150deg, rgba(127, 166, 92, .3), rgba(56, 130, 106, .12)); color: var(--pk-primary-strong); font-family: var(--pk-serif); font-size: 13px; font-weight: 600; }
.chevron { width: 8.027px; height: 8.027px; border-right: 1.720px solid var(--pk-ink-4); border-bottom: 1.720px solid var(--pk-ink-4); transform: rotate(45deg) translateY(-2.293px); transition: transform var(--pk-dur-base) var(--pk-ease); }
.chevron.up { transform: rotate(225deg) translate(-1.147px, -1.147px); }

.sheet-mask { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 20; background: rgba(24, 28, 20, .42); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 85vh; overflow: auto; box-sizing: border-box; padding: 9.173px var(--pk-gutter) calc(16.053px + 0px); border-radius: var(--pk-r-2xl) var(--pk-r-2xl) 0 0; background: var(--pk-canvas); box-shadow: var(--pk-e-sheet); }
.sheet-handle { width: 43.573px; height: 4.587px; margin: 0 auto 13.760px; border-radius: 2.293px; background: var(--pk-line-strong); }

.icon-button { display: flex; align-items: center; justify-content: center; flex: 0 0 41.280px; width: 41.280px; max-width: 41.280px; height: 41.280px; min-height: 41.280px; margin: 0; padding: 0; border: var(--pk-border-line); border-radius: 50%; background: var(--pk-surface); box-sizing: border-box; overflow: hidden; }
.icon-button::after { border: 0; }

.segmented { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3.440px; margin: 11.467px 0 18.347px; border-radius: var(--pk-r-pill); background: rgba(34, 38, 31, .05); box-sizing: border-box; }
.segmented button { display: flex; align-items: center; justify-content: center; width: 100%; min-width: 0; min-height: 41.280px; margin: 0; padding: 0; border: 0; border-radius: var(--pk-r-pill); background: transparent; color: var(--pk-ink-3); font-size: 14px; line-height: 1.2; font-weight: 400; box-sizing: border-box; transition: background var(--pk-dur-base) var(--pk-ease), color var(--pk-dur-base) var(--pk-ease); }
.segmented button::after { border: 0; }
.segmented button.active { background: var(--pk-surface-raised); color: var(--pk-primary-strong); font-weight: 500; box-shadow: var(--pk-e1); }

.repeat-row { min-height: 52.747px; margin-bottom: 16.053px; border-top: var(--pk-border-soft); border-bottom: var(--pk-border-soft); }
.time-separator { margin-top: 18.347px; color: var(--pk-ink-3); }

.screen-intro { margin: 9.173px 0 22.933px; }
.screen-kicker { display: block; color: var(--pk-primary-mid); font-size: 12px; line-height: 1.4; font-weight: 500; letter-spacing: 1.147px; }
.screen-heading { display: block; margin-top: 4.587px; color: var(--pk-ink); font-family: var(--pk-serif); font-size: 24px; line-height: 1.28; font-weight: 600; letter-spacing: .4px; }
.content-card { background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); padding: var(--pk-s4); box-shadow: var(--pk-e0); box-sizing: border-box; }
.quiet-link { display: flex; align-items: center; justify-content: center; gap: 4.587px; min-height: 50.453px; margin: 0; padding: 0; background: transparent; color: var(--pk-primary); font-size: 13px; font-weight: 500; }
.quiet-link::after { border: 0; }

.ui-icon { display: block; width: 24.080px; height: 24.080px; flex: none; }
.ui-icon.large { width: 27.520px; height: 27.520px; }
.ui-icon.family { width: 32.107px; height: 32.107px; }
.ui-chevron { display: block; flex: none; width: 8.027px; height: 8.027px; border-top: 1.720px solid currentColor; border-right: 1.720px solid currentColor; box-sizing: border-box; }
.ui-chevron.right { transform: rotate(45deg); }
.ui-chevron.left { transform: rotate(-135deg); }
.ui-chevron.down { transform: rotate(135deg); }
.ui-plus { position: relative; display: block; flex: none; width: 20.640px; height: 20.640px; }
.ui-plus::before, .ui-plus::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16.053px; height: 1.720px; border-radius: 1.720px; background: currentColor; transform: translate(-50%, -50%); }
.ui-plus::after { transform: translate(-50%, -50%) rotate(90deg); }
.ui-close { position: relative; display: block; width: 18.347px; height: 18.347px; }
.ui-close::before, .ui-close::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14.333px; height: 1.720px; border-radius: 1.720px; background: currentColor; transform: translate(-50%, -50%) rotate(45deg); }
.ui-close::after { transform: translate(-50%, -50%) rotate(-45deg); }

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:flex-start;height:calc(61.920px + 0px);padding:8.027px 2.293px 0px;border-top:0.573px solid rgba(34,38,31,.06);background:rgba(255,253,248,.92);backdrop-filter:blur(18px);box-shadow:0 -6.880px 22.933px -13.760px rgba(34,38,31,.3);color:#8E9686;box-sizing:border-box}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;flex:1;min-width:0;height:50.453px;gap:3.440px}
.tab.active{color:#14402F}
.icon-slot{position:relative;display:flex;align-items:center;justify-content:center;width:32.107px;height:27.520px}
.icon-slot::before{content:"";position:absolute;left:50%;top:50%;width:32.107px;height:32.107px;margin:-16.053px 0 0 -16.053px;border-radius:50%;background:#E4EDE6;opacity:0;transform:scale(.6);transition:opacity 240ms cubic-bezier(.22,.75,.24,1),transform 240ms cubic-bezier(.34,1.42,.5,1)}
.tab.active .icon-slot::before{opacity:1;transform:scale(1)}
.tab-icon{position:relative;display:block;width:22.933px;height:22.933px}
.tab-label{font-size:10px;line-height:1.2;font-weight:500;letter-spacing:0.287px}
.tab.active .tab-label{font-weight:600}
/* 中央凸起「记录」键：全局唯一的高饱和触点，让「记下今天学到的」永远一键可达 */
.tab.is-center{justify-content:flex-start}
.tab.is-center .key{position:relative;display:flex;align-items:center;justify-content:center;width:59.627px;height:59.627px;margin-top:-26.373px;border-radius:50%;background:linear-gradient(150deg,#38826A,#14402F);border:3.440px solid rgba(255,253,248,.94);box-sizing:border-box;box-shadow:0 11.467px 25.227px -9.173px rgba(31,91,69,.66)}
.tab.is-center .key-icon{width:26.373px;height:26.373px}
.tab.is-center .tab-label{margin-top:1.147px;color:#14402F;font-weight:600}
.tab.is-center:active .key{transform:scale(.94)}
.tab-badge{position:absolute;left:17.200px;top:-2.293px;min-width:17.200px;height:17.200px;padding:0 4.013px;border-radius:8.600px;background:#A9762A;color:#FFFDF8;font-size:10px;font-weight:600;line-height:17.200px;text-align:center;box-sizing:border-box;box-shadow:0 0 0 2.293px rgba(255,253,248,.95)}
.tab-badge.on-key{left:auto;right:-1.147px;top:-1.147px}

/* PKDS-2.0 · TodoCard：左侧主色轨表达「必做 / 有余力」，反馈面板内嵌在卡内，
   每个选项都先写清后果（复习日期由服务端确定性策略产生，文案与策略一一对应）。 */
.todo { position: relative; overflow: hidden; padding: 17.200px 17.200px 12.613px 19.493px; box-sizing: border-box; background: var(--pk-surface); border: var(--pk-border); border-radius: var(--pk-r-xl); box-shadow: var(--pk-e0); }
.todo .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 4.587px; background: linear-gradient(180deg, var(--pk-primary-mid), var(--pk-primary)); }
.todo.opt { background: var(--pk-surface-warm); box-shadow: none; }
.todo.opt .rail { background: repeating-linear-gradient(180deg, var(--pk-sprout) 0 10.320px, rgba(127, 166, 92, .25) 10.320px 17.200px); }

.todo-top { display: flex; align-items: flex-start; gap: 11.467px; }
.todo-top .grow { flex: 1; min-width: 0; }
.todo-top .pill { flex: none; margin-top: 2.293px; }
.todo-title { display: block; font-size: 16px; line-height: 1.4; font-weight: 600; letter-spacing: .2px; }
.todo-meta { display: block; margin-top: 3.440px; font-size: 12px; line-height: 1.5; color: var(--pk-ink-3); font-variant-numeric: tabular-nums; }

.todo-points { margin-top: 6.880px; }
.pt-row { display: flex; align-items: center; gap: 9.173px; min-height: 64.213px; padding: 6.880px 0; box-sizing: border-box; }
.todo-pt + .todo-pt { border-top: var(--pk-border-soft); }
.pt-dot { flex: none; width: 20.640px; height: 20.640px; border-radius: 50%; border: 1.147px solid var(--pk-line-strong); background: var(--pk-surface-raised); box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
.pt-dot.on { background: var(--pk-primary); border-color: var(--pk-primary); }
.pt-main { flex: 1; min-width: 0; }
.pt-n { display: block; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.pt-n.is-done { color: var(--pk-ink-3); }
.pt-summary { display: -webkit-box; margin-top: 4.587px; overflow: hidden; color: var(--pk-ink-3); font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.source-link { display: inline-flex; position: relative; align-items: center; gap: 4.587px; min-height: 36.693px; margin-top: 2.293px; color: var(--pk-primary); font-size: 12px; font-weight: 500; }
.source-link::after { content: ""; position: absolute; left: -6.880px; right: -6.880px; top: -6.880px; bottom: -6.880px; }
.pt-done { flex: none; display: inline-flex; align-items: center; gap: 5.733px; font-size: 12px; font-weight: 500; color: var(--pk-primary); }
.act-done-hit { flex: none; min-height: 50.453px; display: flex; align-items: center; }
.btn.sm.act-done { width: auto; height: 36.693px; min-height: 36.693px; padding-top: 0; padding-bottom: 0; line-height: 36.693px; }
/* 视觉 32×32，热区用伪元素撑到 50.453px，兼顾规格与触控下限。 */
.act-more { position: relative; flex: none; box-sizing: border-box; width: 36.693px; height: 36.693px; border: var(--pk-border-line); border-radius: var(--pk-r-sm); background: var(--pk-surface); display: flex; align-items: center; justify-content: center; transition: background var(--pk-dur-fast) var(--pk-ease); }
.act-more::after { content: ""; position: absolute; left: -6.880px; right: -6.880px; top: -6.880px; bottom: -6.880px; }
.act-more.on { background: var(--pk-primary-tint); border-color: var(--pk-primary-hairline); }

/* 反馈面板：不使用系统 ActionSheet，选项与它影响的复习安排写在同一屏。 */
.fb-panel { margin: 2.293px 0 11.467px 29.813px; padding: 11.467px 12.613px 4.587px; border-radius: var(--pk-r-md); background: var(--pk-surface-warm); border: var(--pk-border-line); animation: fb-in var(--pk-dur-base) var(--pk-ease) both; }
@keyframes fb-in { from { opacity: 0; transform: translateY(-4.587px); } to { opacity: 1; transform: none; } }
.fb-hd { display: block; padding-bottom: 4.587px; font-size: 11px; line-height: 1.4; color: var(--pk-ink-4); letter-spacing: .4px; }
.fb { display: flex; align-items: center; gap: 9.173px; min-height: 55.040px; }
.fb + .fb { border-top: var(--pk-border-soft); }
.fb .grow { flex: 1; min-width: 0; }
.fb .fb-t { display: block; font-size: 14px; line-height: 1.4; font-weight: 500; }
.fb .fb-s { display: block; margin-top: 2.293px; font-size: 11px; line-height: 1.5; color: var(--pk-ink-3); }
.fb-cancel { min-height: 50.453px; display: flex; align-items: center; justify-content: center; border-top: var(--pk-border-soft); font-size: 13px; color: var(--pk-ink-3); }
.fb-delete { border-top: var(--pk-border-line); margin-top: 4.587px; min-height: 44px; }
.fb-delete .fb-s { font-size: 13px; }
