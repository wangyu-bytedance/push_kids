services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.runtime
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
